<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Liquid Glass Gallery</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#141218">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="translucent">
    <meta name="apple-mobile-web-app-title" content="Liquid Glass Gallery">
    <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: #f3f8ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #07121e;
    }

    .app {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #07121e;
    }

    .stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
    }

    .stage.dragging {
      cursor: grabbing;
    }

    #gl {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    header {
      position: absolute;
      z-index: 2;
      top: max(22px, env(safe-area-inset-top));
      left: 24px;
      right: 24px;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    header p {
      margin: 6px 0 0;
      color: rgba(243, 248, 255, 0.78);
      font-size: 0.88rem;
    }

    .controls {
      position: absolute;
      z-index: 3;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    button {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 50%;
      color: #f3f8ff;
      background: rgba(255, 255, 255, 0.12);
      font: inherit;
      font-size: 1.35rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      transform: scale(1.06);
      background: rgba(255, 255, 255, 0.2);
    }

    #counter {
      min-width: 62px;
      color: rgba(243, 248, 255, 0.82);
      text-align: center;
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .hint {
      position: absolute;
      z-index: 3;
      right: 12px;
      bottom: max(82px, calc(env(safe-area-inset-bottom) + 76px));
      left: 12px;
      margin: 0;
      color: rgba(243, 248, 255, 0.78);
      text-align: center;
      font-size: 0.78rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      header {
        top: max(18px, env(safe-area-inset-top));
        left: 18px;
        right: 18px;
      }

      header p {
        max-width: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>Liquid Glass Carousel</h1>
      <p>Extracted code by lhd</p>
    </header>

    <section class="stage" id="stage" aria-label="Carousel foto">
      <canvas id="gl" width="880" height="1912"></canvas>
    </section>

    <nav class="controls" aria-label="Kontrol carousel">
      <button id="previous" type="button" aria-label="Foto sebelumnya">‹</button>
      <span id="counter" aria-live="polite">1 / 5</span>
      <button id="next" type="button" aria-label="Foto berikutnya">›</button>
    </nav>

    <p class="hint">Geser, atau gunakan tombol panah kiri/kanan</p>
  </main>

  <script>
    const items = [
      {
        title: "Pegunungan",
        description: "Udara pagi yang tenang",
        image: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1000&q=85"
      },
      {
        title: "Hutan",
        description: "Cahaya di antara pepohonan",
        image: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=85"
      },
      {
        title: "Pantai",
        description: "Garis pantai saat senja",
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=85"
      },
      {
        title: "Danau",
        description: "Pantulan di permukaan air",
        image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85"
      },
      {
        title: "Kota",
        description: "Lampu kota menjelang malam",
        image: "https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1000&q=85"
      }
    ];

    const stage = document.getElementById("stage");
    const visibleCanvas = document.getElementById("gl");
    const counter = document.getElementById("counter");

    // Seluruh carousel digambar ke canvas ini, lalu diproses sebagai tekstur WebGL.
    const sceneCanvas = document.createElement("canvas");
    const ctx = sceneCanvas.getContext("2d");

    let gl;
    let program;
    let sceneTexture;
    let uniforms;
    let images = [];

    let width = 0;
    let height = 0;
    let dpr = 1;
    let cardWidth = 0;
    let cardHeight = 0;
    let slot = 0;

    let scroll = 0;
    let target = 0;
    let velocity = 0;
    let dragging = false;
    let dragStartX = 0;
    let dragStartScroll = 0;
    let lastPointerX = 0;
    let lastPointerTime = 0;
    let pointerVelocity = 0;
    let previousFrameTime = 0;

    const wrapIndex = (index) =>
      ((index % items.length) + items.length) % items.length;

    const vertexSource = `#version 300 es
      precision highp float;

      void main() {
        vec2 point = vec2(
          float((gl_VertexID << 1) & 2),
          float(gl_VertexID & 2)
        );
        gl_Position = vec4(point * 2.0 - 1.0, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      out vec4 outColor;

      uniform sampler2D uScene;
      uniform vec2 uResolution;
      uniform vec2 uCardSize;
      uniform float uTime;
      uniform float uRadius;

      float roundedBoxDistance(vec2 point, vec2 halfSize, float radius) {
        vec2 q = abs(point) - halfSize + radius;
        return length(max(q, 0.0))
          + min(max(q.x, q.y), 0.0)
          - radius;
      }

      vec4 sampleScene(vec2 uv) {
        return texture(uScene, clamp(uv, 0.001, 0.999));
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        float aspect = uResolution.x / uResolution.y;

        // Jarak dari pusat lensa, dikoreksi untuk rasio layar.
        vec2 offset = uv - vec2(0.5);
        vec2 p = vec2(offset.x * aspect, offset.y);

        // Area kartu tengah tetap jernih.
        vec2 clearPoint = vec2(offset.x * aspect, offset.y);
        vec2 clearHalfSize = vec2(
          uCardSize.x / (2.0 * uResolution.y),
          uCardSize.y / (2.0 * uResolution.y)
        );

        float clearDistance = roundedBoxDistance(
          clearPoint,
          clearHalfSize,
          uRadius / uResolution.y
        );

        vec4 original = sampleScene(uv);

        if (clearDistance <= 0.0) {
          outColor = original;
          return;
        }

        // Bidang lensa elips di sekitar kartu aktif.
        vec2 lensSize = vec2(aspect * 0.78, 0.82);
        float radialDistance = length(p / lensSize);
        float field = smoothstep(0.30, 0.88, radialDistance);

        // Distorsi mulai di luar kartu lalu memudar ke bagian luar lensa.
        float outsideCard = smoothstep(0.0, 0.055, clearDistance);
        field *= outsideCard;
        float verticalPosition =
  abs(clearPoint.y) / max(clearHalfSize.y, 0.001);

float verticalFade =
  1.0 - 0.98 * smoothstep(0.85, 1.20, verticalPosition);

field *= verticalFade;

        if (field <= 0.001) {
          outColor = original;
          return;
        }

        float angle = atan(p.y, p.x);
        float fluidWave =
          sin(angle * 2.0 + uTime * 0.55) * 0.55 +
          sin(angle * 2.0 - uTime * 0.35) * 0.25;

        vec2 radialDirection = normalize(offset + vec2(0.00001));
        vec2 tangentDirection = vec2(-radialDirection.y, radialDirection.x);

        // Pembesaran dan lengkungan seperti lensa kaca.
        vec2 shift =
          -offset * 0.45 * field +
          tangentDirection * fluidWave * field * field * 0.012;

        // Dispersi warna ringan di tepi refraksi.
        vec2 spread = shift * 0.10;
        vec2 redUv = uv + shift + spread;
        vec2 greenUv = uv + shift;
        vec2 blueUv = uv + shift - spread;

        vec4 refracted;
        refracted.r = sampleScene(redUv).r;
        refracted.g = sampleScene(greenUv).g;
        refracted.b = sampleScene(blueUv).b;
        refracted.a = 1.0;

        // Kilau tipis di tepi kartu.
        float rim = exp(-abs(clearDistance * uResolution.y) / 2.2);
        refracted.rgb += vec3(0.15, 0.19, 0.23) * rim * field;

        outColor = vec4(refracted.rgb, 1.0);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || "Shader gagal dikompilasi.");
      }

      return shader;
    }

    function createProgram() {
      const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      const result = gl.createProgram();

      gl.attachShader(result, vertex);
      gl.attachShader(result, fragment);
      gl.linkProgram(result);

      if (!gl.getProgramParameter(result, gl.LINK_STATUS)) {
        throw new Error(
          gl.getProgramInfoLog(result) || "Program WebGL gagal dibuat."
        );
      }

      return result;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Gagal memuat gambar: ${url}`));
        image.src = url;
      });
    }

    function resize() {
      const rect = stage.getBoundingClientRect();

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = rect.width;
      height = rect.height;

      const pixelWidth = Math.max(1, Math.round(width * dpr));
      const pixelHeight = Math.max(1, Math.round(height * dpr));

      visibleCanvas.width = pixelWidth;
      visibleCanvas.height = pixelHeight;
      sceneCanvas.width = pixelWidth;
      sceneCanvas.height = pixelHeight;

      // Kartu portrait besar, mengikuti ukuran viewport.
      cardHeight = pixelHeight * 0.62;
      cardWidth = cardHeight * 0.75;

      // Jaga agar kartu tetap muat di layar sempit.
      const maxCardWidth = pixelWidth * 0.8;
      if (cardWidth > maxCardWidth) {
        cardWidth = maxCardWidth;
        cardHeight = cardWidth / 0.75;
      }

      slot = cardWidth * 0.95;

      if (gl) {
        gl.viewport(0, 0, pixelWidth, pixelHeight);
      }
    }

    function drawRoundedRect(context, x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + w, y, x + w, y + h, r);
      context.arcTo(x + w, y + h, x, y + h, r);
      context.arcTo(x, y + h, x, y, r);
      context.arcTo(x, y, x + w, y, r);
      context.closePath();
    }

    function drawImageCover(image, x, y, w, h) {
      const imageAspect = image.width / image.height;
      const boxAspect = w / h;

      let sx = 0;
      let sy = 0;
      let sw = image.width;
      let sh = image.height;

      if (imageAspect > boxAspect) {
        sw = image.height * boxAspect;
        sx = (image.width - sw) / 2;
      } else {
        sh = image.width / boxAspect;
        sy = (image.height - sh) / 2;
      }

      ctx.drawImage(image, sx, sy, sw, sh, x, y, w, h);
    }

    function getOffset(index) {
      const count = items.length;
      let offset = index - scroll;
      offset = ((offset + count / 2) % count + count) % count - count / 2;
      return offset;
    }

    function drawScene() {
      const pixelWidth = sceneCanvas.width;
      const pixelHeight = sceneCanvas.height;

      // Latar gradasi.
      const background = ctx.createLinearGradient(
        0,
        0,
        pixelWidth,
        pixelHeight
      );
      background.addColorStop(0, "#1c3548");
      background.addColorStop(0.52, "#152638");
      background.addColorStop(1, "#07121e");

      ctx.fillStyle = background;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      // Backdrop blur menggunakan gambar aktif.
      const activeIndex = wrapIndex(Math.round(scroll));
      const activeImage = images[activeIndex];

      if (activeImage) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.filter = `blur(${24 * dpr}px) saturate(1.15)`;
        drawImageCover(
          activeImage,
          -20 * dpr,
          -20 * dpr,
          pixelWidth + 40 * dpr,
          pixelHeight + 40 * dpr
        );
        ctx.restore();

        ctx.fillStyle = "rgba(5, 14, 24, 0.42)";
        ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      }

      const centerX = pixelWidth / 2;
      const centerY = pixelHeight / 2;
      const radius = 35 * dpr;

      items.forEach((item, index) => {
        const offset = getOffset(index);
        if (Math.abs(offset) > 2.6) return;

        const distance = Math.abs(offset);
        const scale = 1 - Math.min(distance, 1) * 0.16;
        const w = cardWidth * scale;
        const h = cardHeight * scale;
        const x = centerX + offset * slot - w / 2;
        const y = centerY - h / 2;
        const image = images[index];

        ctx.save();
        ctx.globalAlpha = Math.max(0.38, 1 - distance * 0.2);

        // Bayangan kartu.
        ctx.shadowColor = "rgba(0, 0, 0, 0.38)";
        ctx.shadowBlur = 28 * dpr;
        ctx.shadowOffsetY = 12 * dpr;

        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.fillStyle = "#263646";
        ctx.fill();

        ctx.shadowColor = "transparent";
        ctx.save();
        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.clip();

        if (image) {
          drawImageCover(image, x, y, w, h);
        }

        // Gradasi gelap di bawah teks.
        const shade = ctx.createLinearGradient(
          0,
          y + h * 0.55,
          0,
          y + h
        );
        shade.addColorStop(0, "rgba(5, 10, 18, 0)");
        shade.addColorStop(1, "rgba(5, 10, 18, 0.78)");
        ctx.fillStyle = shade;
        ctx.fillRect(x, y + h * 0.5, w, h * 0.5);

        // Kilau permukaan kartu.
        const gloss = ctx.createLinearGradient(x, y, x + w, y + h * 0.45);
        gloss.addColorStop(0, "rgba(255, 255, 255, 0.19)");
        gloss.addColorStop(0.34, "rgba(255, 255, 255, 0.035)");
        gloss.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = gloss;
        ctx.fillRect(x, y, w, h * 0.55);

        const titleSize = Math.max(17, 22 * scale) * dpr;
        ctx.font = `600 ${titleSize}px system-ui, sans-serif`;
        ctx.fillStyle = "#fff";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(
          item.title,
          x + 20 * dpr,
          y + h - 54 * dpr,
          w - 40 * dpr
        );

        ctx.font = `${12 * dpr}px system-ui, sans-serif`;
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        ctx.fillText(
          item.description,
          x + 20 * dpr,
          y + h - 31 * dpr,
          w - 40 * dpr
        );

        ctx.restore();

        // Tepi tipis kartu.
        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.lineWidth = 1 * dpr;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.36)";
        ctx.stroke();

        ctx.restore();
      });

      counter.textContent = `${activeIndex + 1} / ${items.length}`;
    }

    function uploadSceneTexture() {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        sceneCanvas
      );
    }

    function renderFrame(time) {
      const now = time || performance.now();

      if (!previousFrameTime) previousFrameTime = now;
      const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
      previousFrameTime = now;

      if (!dragging) {
        // Pegas redam untuk perpindahan antar foto.
        const stiffness = 170;
        const damping = 2 * Math.sqrt(stiffness) * 0.92;

        velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
        scroll += velocity * dt;

        if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
          scroll = target;
          velocity = 0;
        }
      }

      drawScene();
      uploadSceneTexture();

      gl.useProgram(program);
      gl.uniform1i(uniforms.scene, 0);
      gl.uniform2f(
        uniforms.resolution,
        visibleCanvas.width,
        visibleCanvas.height
      );
      gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
      gl.uniform1f(uniforms.time, now / 1000);
      gl.uniform1f(uniforms.radius, 16 * dpr);

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      requestAnimationFrame(renderFrame);
    }

    function moveBy(direction) {
      target = Math.round(scroll) + direction;
      velocity = 0;
    }

    document
      .getElementById("previous")
      .addEventListener("click", () => moveBy(-1));

    document
      .getElementById("next")
      .addEventListener("click", () => moveBy(1));

    stage.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;

      dragging = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);

      dragStartX = event.clientX;
      dragStartScroll = scroll;
      lastPointerX = event.clientX;
      lastPointerTime = performance.now();
      pointerVelocity = 0;
      velocity = 0;
      target = scroll;
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const now = performance.now();
      const elapsed = Math.max(1, now - lastPointerTime);
      const dx = event.clientX - dragStartX;

      scroll = dragStartScroll - (dx * dpr) / slot;
      target = scroll;

      pointerVelocity =
        (-(event.clientX - lastPointerX) * dpr / slot) /
        (elapsed / 1000);

      lastPointerX = event.clientX;
      lastPointerTime = now;
    });

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      stage.classList.remove("dragging");

      const projected = scroll + pointerVelocity * 0.16;
      target = Math.round(projected);

      if (Math.abs(pointerVelocity) > 1.1) {
        target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
      }

      velocity = pointerVelocity;
    }

    stage.addEventListener("pointerup", finishDrag);
    stage.addEventListener("pointercancel", finishDrag);

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") moveBy(1);
      if (event.key === "ArrowLeft") moveBy(-1);
    });

    async function init() {
      gl = visibleCanvas.getContext("webgl2", {
        alpha: false,
        antialias: true
      });

      if (!gl) {
        stage.innerHTML =
          "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
        return;
      }

      try {
        images = await Promise.all(items.map((item) => loadImage(item.image)));

        program = createProgram();
        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());

        sceneTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        uniforms = {
          scene: gl.getUniformLocation(program, "uScene"),
          resolution: gl.getUniformLocation(program, "uResolution"),
          cardSize: gl.getUniformLocation(program, "uCardSize"),
          time: gl.getUniformLocation(program, "uTime"),
          radius: gl.getUniformLocation(program, "uRadius")
        };

        resize();
        requestAnimationFrame(renderFrame);
      } catch (error) {
        console.error(error);
        stage.innerHTML =
          "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
      }
    }

    window.addEventListener("resize", resize);
    init();
  </script>

</body></html>
