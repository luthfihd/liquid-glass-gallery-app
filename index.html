customBgPhotoInput.addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  customBgPhotoInput.value = "";
  if (!file || !file.type.startsWith("image/")) return;

  try {
    const url = URL.createObjectURL(file);
    sessionObjectUrls.push(url);
    customBgImageObj = await loadImage(url, true);
    customBgImageUrl = url;
    bgPresetIndex = 6;
    bgSliderCtrl.sync(bgPresetIndex);
    updateMockupBackgroundDOM();
    renderDeviceMockup();
    closeCustomPicker();
  } catch (err) {
    console.error("Gagal memuat custom background:", err);
  }
});

saveMockupBtn.addEventListener("click", () => {
  if (!mockupPreviewCanvas.width) return;
  mockupPreviewCanvas.toBlob((blob) => {
    if (!blob) return;
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `LiquidGlass-Mockup-${currentMockupDevice}-${Date.now()}.png`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }, "image/png");
});

/* =========================================================
   CAMEL #1: NAVBAR 3-TAB (iOS 26 NATIVE + INERTIAL SETTLE BOUNCE)
   ========================================================= */
const navW = () => cachedNavBaseRect.width || liquidNav.clientWidth || 344;
const navInset = 5;
const navInnerW = () => Math.max(1, navW() - navInset * 2);
const navTw = () => navInnerW() / 3;
const navCtr = (i) => navInset + (i + 0.5) * navTw();
const navLx = (e) => {
  const rect = liquidNav.getBoundingClientRect();
  return e.clientX - rect.left;
};

function switchTab(tabIndex, options = {}) {
  const clamped = cl(tabIndex, 0, 2);
  const prevTab = activeTab;

  if (clamped !== 2) {
    closeCustomPicker();
  }

  if (clamped === 2 && !options.skipCapture && (prevTab === 0 || !capturedRawScene)) {
    triggerCameraBlitz();
    captureCurrentExploreScreen();
  }

  activeTab = clamped;

  if (clamped === 0) {
    stopCamera();
    snapView.classList.remove("active");
    mockupView.classList.remove("active");
    stage.classList.remove("is-hidden");
    sceneDirty = true;
  } else if (clamped === 1) {
    mockupView.classList.remove("active");
    stage.classList.add("is-hidden");
    snapView.classList.add("active");
    startCamera();
  } else if (clamped === 2) {
    stopCamera();
    snapView.classList.remove("active");
    stage.classList.add("is-hidden");
    mockupView.classList.add("active");
    requestAnimationFrame(() => {
      deviceToggleCtrl.sync(currentMockupDevice === "iphone" ? 0 : 1);
      navToggleCtrl.sync(includeNavInSS ? 0 : 1);
      bgSliderCtrl.sync(bgPresetIndex);
      frameSliderCtrl.sync(frameFinishIndex);
    });
  }
}

liquidNav.addEventListener("pointerdown", (e) => {
  if (e.button !== undefined && e.button !== 0) return;
  navDown = true;
  liquidNav.setPointerCapture(e.pointerId);
  navPx = navPxs = navPrevPxs = navLx(e);
  navFingerSpd = 0;
  navPr = prs(e);
  navHoldUntil = performance.now() + 260;
  navZ.v += RM * (0.9 + 1.2 * navPr);
});

liquidNav.addEventListener("pointermove", (e) => {
  if (!navDown) return;
  navPx = navLx(e);
  navPr = prs(e);
});

function releaseNav() {
  if (!navDown) return;
  navDown = false;
  navZ.v -= RM * 0.72;

  const targetTab = cl(Math.floor((navPx - navInset) / navTw()), 0, 2);
  const destX = navCtr(targetTab);
  const distToDest = destX - navX.x;

  if (RM) {
    navX.v += cl(distToDest * 2.2, -320, 320);
    navWd.v += 24;
    navHt.v -= 16;
  }

  switchTab(targetTab);
}

liquidNav.addEventListener("pointerup", releaseNav);
liquidNav.addEventListener("pointercancel", releaseNav);
liquidNav.addEventListener("click", (e) => {
  if (e.detail === 0) {
    const btn = e.target.closest(".nav-btn");
    if (btn) {
      switchTab(+btn.dataset.tab);
    }
  }
});

function updateLiquidPillPhysics(now, dt) {
  const w = navW();
  const t = navTw();
  const on_ = navDown || now < navHoldUntil;

  navPxs += (navPx - navPxs) * Math.min(1, dt * 28);
  const instFingerSpd = Math.abs(navPxs - navPrevPxs) / Math.max(0.001, dt);
  navPrevPxs = navPxs;
  navFingerSpd += (instFingerSpd - navFingerSpd) * Math.min(1, dt * 14);

  const restW = t - navInset * 2 + 10;
  const restH = (cachedNavBaseRect.height || 68) - navInset * 2;
  const idealActiveW = t * 1.16;
  const idealActiveH = 80;

  const ALLOW = t * 0.12;
  const minC = lp(navInset + t * 0.5, navInset + idealActiveW * 0.5 - ALLOW, cl(navP.x, 0, 1));
  const maxC = w - minC;
  const tg = cl(on_ ? navPxs : navCtr(activeTab), minC, maxC);

  const posK = on_ ? 260 : 310;
  const posC = on_ ? 24 : 18.0;
  const pressK = on_ ? 320 : 340;
  const pressC = on_ ? 21 : 16.0;

  for (let k = 0; k < 2; k++) {
    sp(navX, tg, posK, posC, dt / 2);
    sp(navP, on_ ? 1 : 0, pressK, pressC, dt / 2);
  }

  if (navX.x < minC) {
    navX.x = minC;
    if (navX.v < 0) navX.v *= -0.28;
  } else if (navX.x > maxC) {
    navX.x = maxC;
    if (navX.v > 0) navX.v *= -0.28;
  }

  const pp = Math.max(navP.x, 0);
  const p1 = Math.min(pp, 1);

  navSpd += (Math.abs(navX.v) - navSpd) * Math.min(1, dt * 10);
  navSvx += (navX.v - navSvx) * Math.min(1, dt * 10);

  const motionSpd = Math.max(navSpd, navFingerSpd * 0.85);
  const sn = cl(motionSpd / 740, 0, 1);

  const activeSlideForce = navDown ? Math.max(cl((navPr - 0.35) / 0.65, 0, 1) * sn, sn) : 0;
  navStr += (activeSlideForce - navStr) * Math.min(1, dt * 12);
  navSpdS += (motionSpd - navSpdS) * Math.min(1, dt * 3);
  navStrS += (navStr - navStrS) * Math.min(1, dt * 4);

  const st = sn * p1;
  const ac = cl((motionSpd - navSpdS) / 680, -1, 1) * p1;
  const ap = Math.max(ac, 0);
  const an = Math.max(-ac, 0);

  const wdC = on_ ? 18 : 14.5;
  const htC = on_ ? 12 : 10.2;

  // Ubah 2 baris di bawah untuk atur Lebar & Tinggi Lensa Saat Drag
  sp(navWd, lp(restW, idealActiveW, pp) + st * -40 + ap * 2 - an * 14, 210, wdC, dt);
  sp(navHt, lp(restH, idealActiveH, pp) - st * -10 - ap * 14 + an * 18 + navStr * 8 * p1, 145, htC, dt);

  sp(navZ, on_ ? RM * (0.03 + 0.04 * navStr) : 0, 220, 13.5, dt);
  sp(navSX, RM * st * 0.09, 200, 14.5, dt);
  sp(navSH, RM * cl(navSvx * 0.004, -5, 5) * p1, 160, 14.5, dt);
  sp(navIZ, on_ ? RM * (0.06 + 0.06 * navStrS) : 0, 48, 12.5, dt);

  const maxW = 2 * (Math.min(navX.x - navInset, (w - navInset) - navX.x) + ALLOW);
  const wd = Math.max(Math.min(navWd.x, maxW), 32);
  const h = Math.max(navHt.x, 30);

  liquidNav.style.transform = `translateX(${navSH.x.toFixed(2)}px) scale(${(1 + navZ.x + navSX.x).toFixed(4)},${(1 + navZ.x - navSX.x * 0.45).toFixed(4)})`;

  navLensGeom = {
    centerXCss: cachedNavBaseRect.left + navSH.x + navX.x,
    centerYCss: cachedNavBaseRect.top + 34,
    halfWCss: wd * 0.5,
    halfHCss: h * 0.5,
    press: p1,
    velX: navSvx / 260,
    iconZoom: 1 + navIZ.x
  };
}

window.addEventListener("beforeunload", () => {
  stopCamera();
  sessionObjectUrls.forEach((url) => URL.revokeObjectURL(url));
});

/* =========================================================
   VIEWPORT & RESIZE
   ========================================================= */
function getFullScreenDimensions() {
  const isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia("(display-mode: standalone)").matches ||
    window.matchMedia("(display-mode: fullscreen)").matches;

  let w = Math.max(window.innerWidth, document.documentElement.clientWidth);
  let h = Math.max(window.innerHeight, document.documentElement.clientHeight);

  if (isStandalone && window.screen) {
    const isPortrait = window.innerHeight >= window.innerWidth;
    const screenH = isPortrait
      ? Math.max(window.screen.height, window.screen.width)
      : Math.min(window.screen.height, window.screen.width);

    h = Math.max(h, screenH);
  }

  return { w, h };
}

function updateCachedNavRect() {
  liquidNav.style.transform = "";
  const r = liquidNav.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) {
    cachedNavBaseRect = { left: r.left, top: r.top, width: r.width, height: r.height };
  }
}

function resize() {
  const { w, h } = getFullScreenDimensions();
  if (!w || !h) return;

  document.documentElement.style.height = `${h}px`;
  document.body.style.height = `${h}px`;
  app.style.height = `${h}px`;
  stage.style.height = `${h}px`;
  visibleCanvas.style.height = `${h}px`;

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = w;
  height = h;

  const pixelWidth = Math.max(1, Math.round(width * dpr));
  const pixelHeight = Math.max(1, Math.round(height * dpr));

  visibleCanvas.width = pixelWidth;
  visibleCanvas.height = pixelHeight;
  sceneCanvas.width = pixelWidth;
  sceneCanvas.height = pixelHeight;

  const isMobile = window.matchMedia("(max-width: 600px)").matches;

  const aspectRatio = 0.72;
  cardWidth = pixelWidth * (isMobile ? 0.94 : 0.74);
  cardHeight = cardWidth / aspectRatio;

  const maxCardHeight = pixelHeight * (isMobile ? 0.62 : 0.66);
  if (cardHeight > maxCardHeight) {
    cardHeight = maxCardHeight;
    cardWidth = cardHeight * aspectRatio;
  }

  const cardGap = (isMobile ? 250 : 50) * dpr;
  slot = cardHeight + cardGap;

  cardCenterY = pixelHeight * (isMobile ? 0.45 : 0.53);

  buildItemSnapshots();

  if (gl) {
    gl.viewport(0, 0, pixelWidth, pixelHeight);
  }

  updateCachedNavRect();
  navX.x = navCtr(activeTab);
  navPx = navPxs = navPrevPxs = navX.x;
  resizeGlassCanvas();
  lastNavRenderSig = "";
  sceneDirty = true;

  if (activeTab === 2) {
    deviceToggleCtrl.sync(currentMockupDevice === "iphone" ? 0 : 1);
    navToggleCtrl.sync(includeNavInSS ? 0 : 1);
    bgSliderCtrl.sync(bgPresetIndex);
    frameSliderCtrl.sync(frameFinishIndex);
  }
}

function resizeGlassCanvas() {
  const baseW = cachedNavBaseRect.width || liquidNav.offsetWidth || Math.min(344, width - 32);
  const baseH = cachedNavBaseRect.height || liquidNav.offsetHeight || 68;
  const newWidth = Math.max(1, Math.round((baseW + 88) * dpr));
  const newHeight = Math.max(1, Math.round((baseH + 96) * dpr));

  if (glassCanvas.width !== newWidth || glassCanvas.height !== newHeight) {
    glassCanvas.width = newWidth;
    glassCanvas.height = newHeight;
    navAccentBuffer.width = newWidth;
    navAccentBuffer.height = newHeight;
    navLensLayer.width = newWidth;
    navLensLayer.height = newHeight;
    glassImageData = navLensCtx.createImageData(newWidth, newHeight);
    lastNavRenderSig = "";
  }
}

/* =========================================================
   DRAW SHARP TAB ICONS (OUTLINE vs SOLID FILLED) & LABELS
   ========================================================= */
function drawTabVectorIcon(octx, tabIdx, cx, cy, s, filled) {
  octx.beginPath();
  if (tabIdx === 0) {
    const box = 7 * s;
    const gap = 3.5 * s;
    const r = 1.8 * s;
    octx.roundRect(cx - box - gap * 0.5, cy - box - gap * 0.5, box, box, r);
    octx.roundRect(cx + gap * 0.5, cy - box - gap * 0.5, box, box, r);
    octx.roundRect(cx + gap * 0.5, cy + gap * 0.5, box, box, r);
    octx.roundRect(cx - box - gap * 0.5, cy + gap * 0.5, box, box, r);
    if (filled) octx.fill();
    octx.stroke();
  } else if (tabIdx === 1) {
    const w = 18 * s;
    const h = 13 * s;
    const topY = cy - h * 0.5 + 1.5 * s;
    octx.roundRect(cx - w * 0.5, topY, w, h, 3 * s);
    octx.moveTo(cx - 4.5 * s, topY);
    octx.lineTo(cx - 2.8 * s, topY - 2.6 * s);
    octx.lineTo(cx + 2.8 * s, topY - 2.6 * s);
    octx.lineTo(cx + 4.5 * s, topY);
    if (filled) {
      octx.fill();
      octx.stroke();
      octx.save();
      octx.globalCompositeOperation = "destination-out";
      octx.beginPath();
      octx.arc(cx, topY + h * 0.52, 3.2 * s, 0, Math.PI * 2);
      octx.fill();
      octx.restore();
      octx.beginPath();
      octx.arc(cx, topY + h * 0.52, 1.35 * s, 0, Math.PI * 2);
      octx.fill();
    } else {
      octx.stroke();
      octx.beginPath();
      octx.arc(cx, topY + h * 0.52, 3.1 * s, 0, Math.PI * 2);
      octx.stroke();
    }
  } else {
    const w = 13.5 * s;
    const h = 19 * s;
    octx.roundRect(cx - w * 0.5, cy - h * 0.5, w, h, 2.8 * s);
    if (filled) {
      octx.fill();
      octx.stroke();
      octx.save();
      octx.globalCompositeOperation = "destination-out";
      octx.lineWidth = 1.9 * s;
      octx.beginPath();
      octx.moveTo(cx - 1.6 * s, cy + h * 0.5 - 3.2 * s);
      octx.lineTo(cx + 1.6 * s, cy + h * 0.5 - 3.2 * s);
      octx.stroke();
      octx.restore();
    } else {
      octx.moveTo(cx - 1.2 * s, cy + h * 0.5 - 3.2 * s);
      octx.lineTo(cx + 1.2 * s, cy + h * 0.5 - 3.2 * s);
      octx.stroke();
    }
  }
}

function drawAllTabsGraphics(targetCtx, padX, padY, insetPx, tabW, navH, color, lineWidth, filled) {
  const labels = ["Explore", "Snap", "Mockup"];
  const iconY = padY + navH * 0.37;
  const textY = padY + navH * 0.74;

  targetCtx.strokeStyle = color;
  targetCtx.fillStyle = color;
  targetCtx.lineWidth = lineWidth;
  targetCtx.lineCap = "round";
  targetCtx.lineJoin = "round";
  targetCtx.font = `${filled ? "680" : "620"} ${Math.round(10.6 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
  targetCtx.textAlign = "center";
  targetCtx.textBaseline = "middle";

  for (let i = 0; i < 3; i++) {
    const cx = padX + insetPx + (i + 0.5) * tabW;
    drawTabVectorIcon(targetCtx, i, cx, iconY, dpr, filled);
    targetCtx.fillText(labels[i], cx, textY);
  }
}

function drawLiquidNavRefraction() {
  resizeGlassCanvas();

  const lensWidth = glassCanvas.width;
  const lensHeight = glassCanvas.height;
  if (!lensWidth || !lensHeight || !glassImageData) return;

  const padX = 44 * dpr;
  const padY = 48 * dpr;
  const navW = lensWidth - padX * 2;
  const navH = lensHeight - padY * 2;
  const insetPx = 5 * dpr;
  const innerW = navW - insetPx * 2;
  const tabW = innerW / 3;

  const pillCenterX = padX + navX.x * dpr;
  const pillCenterY = lensHeight * 0.5;
  const pillHalfW = navLensGeom.halfWCss * dpr;
  const pillHalfH = navLensGeom.halfHCss * dpr;
  const pc = navLensGeom.press;

  const navSig = `${pillCenterX.toFixed(2)}|${pillHalfW.toFixed(2)}|${pillHalfH.toFixed(2)}|${pc.toFixed(3)}|${navLensGeom.iconZoom.toFixed(3)}|${currentAccentRgb.join(",")}|${lensWidth}x${lensHeight}`;
  if (navSig === lastNavRenderSig) return;
  lastNavRenderSig = navSig;

  navAccentCtx.clearRect(0, 0, lensWidth, lensHeight);
  navAccentCtx.save();
  const magScale = 1 + 0.13 * pc + (navLensGeom.iconZoom - 1) * 0.4;
  navAccentCtx.translate(pillCenterX, pillCenterY);
  navAccentCtx.scale(magScale, magScale);
  navAccentCtx.translate(-pillCenterX, -pillCenterY);
  drawAllTabsGraphics(
    navAccentCtx,
    padX,
    padY,
    insetPx,
    tabW,
    navH,
    `rgb(${currentAccentRgb.join(",")})`,
    1.85 * dpr,
    true
  );
  navAccentCtx.restore();

  const source = navAccentCtx.getImageData(0, 0, lensWidth, lensHeight).data;
  const output = glassImageData.data;

  const cornerR = Math.min(pillHalfW, pillHalfH);
  const boxHalfX = Math.max(0, pillHalfW - cornerR);
  const boxHalfY = Math.max(0, pillHalfH - cornerR);

  const padBound = Math.ceil(4 * dpr);
  const minX = Math.max(0, Math.floor(pillCenterX - pillHalfW - padBound));
  const maxX = Math.min(lensWidth - 1, Math.ceil(pillCenterX + pillHalfW + padBound));
  const minY = Math.max(0, Math.floor(pillCenterY - pillHalfH - padBound));
  const maxY = Math.min(lensHeight - 1, Math.ceil(pillCenterY + pillHalfH + padBound));

  output.fill(0);

  for (let y = minY; y <= maxY; y++) {
    const dyPill = y - pillCenterY;
    const qyPill = Math.abs(dyPill) - boxHalfY;
    const oyPill = qyPill > 0 ? qyPill : 0;
    const oyPill2 = oyPill * oyPill;

    for (let x = minX; x <= maxX; x++) {
      const outIndex = (y * lensWidth + x) * 4;
      const dxPill = x - pillCenterX;

      const qxPill = Math.abs(dxPill) - boxHalfX;
      const oxPill = qxPill > 0 ? qxPill : 0;
      const sdfPill = Math.sqrt(oxPill * oxPill + oyPill2) + Math.min(Math.max(qxPill, qyPill), 0) - cornerR;

      if (sdfPill <= 1.1 * dpr) {
        shadeContentOnlyRefractionPixel(
          source, lensWidth, lensHeight, x, y,
          dxPill, dyPill, pillHalfW, pillHalfH,
          cornerR, sdfPill, pc, dpr,
          output, outIndex, navLensGeom.velX
        );
      }
    }
  }

  navLensCtx.putImageData(glassImageData, 0, 0);

  glassCtx.clearRect(0, 0, lensWidth, lensHeight);
  glassCtx.save();
  glassCtx.translate(lensWidth * 0.5, lensHeight * 0.5);
  glassCtx.scale(navLensGeom.iconZoom, navLensGeom.iconZoom);
  glassCtx.translate(-lensWidth * 0.5, -lensHeight * 0.5);
  drawAllTabsGraphics(
    glassCtx,
    padX,
    padY,
    insetPx,
    tabW,
    navH,
    "rgba(255, 255, 255, 0.94)",
    1.85 * dpr,
    false
  );
  glassCtx.restore();

  glassCtx.save();
  glassCtx.globalCompositeOperation = "destination-out";
  drawRoundedRect(
    glassCtx,
    pillCenterX - pillHalfW,
    pillCenterY - pillHalfH,
    pillHalfW * 2,
    pillHalfH * 2,
    pillHalfH
  );
  glassCtx.fill();

  glassCtx.globalCompositeOperation = "source-over";
  glassCtx.drawImage(navLensLayer, 0, 0);
  glassCtx.restore();
}

function getOffset(index) {
  const count = items.length;
  let offset = index - scroll;
  offset = ((offset + count / 2) % count + count) % count - count / 2;
  return offset;
}

function drawScene() {
  const pixelWidth = sceneCanvas.width;
  const pixelHeight = sceneCanvas.height;

  const background = ctx.createLinearGradient(0, 0, pixelWidth, pixelHeight);
  background.addColorStop(0, "#1d2d3b");
  background.addColorStop(0.52, "#182838");
  background.addColorStop(1, "#07121e");
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, pixelWidth, pixelHeight);

  const activeIndex = wrapIndex(Math.round(scroll));

  if (activeIndex !== lastAppliedPaletteIndex && itemPalettes[activeIndex]) {
    lastAppliedPaletteIndex = activeIndex;
    applyNavMaterialYouPalette(itemPalettes[activeIndex]);
  }

  const activeBackdrop = backdropSnapshots[activeIndex];

  if (activeBackdrop) {
    ctx.save();
    ctx.globalAlpha = 0.90;
    ctx.drawImage(activeBackdrop, 0, 0, pixelWidth, pixelHeight);
    ctx.restore();

    ctx.fillStyle = "rgba(5, 14, 22, 0.18)";
    ctx.fillRect(0, 0, pixelWidth, pixelHeight);
  }

  const centerX = pixelWidth / 2;
  const centerY = cardCenterY;

  const visibleItems = items
    .map((item, index) => ({ index, offset: getOffset(index) }))
    .filter(({ offset }) => Math.abs(offset) <= 2.6)
    .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

  visibleItems.forEach(({ index, offset }) => {
    const distance = Math.abs(offset);
    const scale = 1 - Math.min(distance, 1) * 0.08;
    const w = cardWidth * scale;
    const h = cardHeight * scale;
    const x = centerX - w / 2;
    const y = centerY + offset * slot - h / 2;
    const snapshot = itemSnapshots[index];

    if (!snapshot) return;

    ctx.save();
    ctx.globalAlpha = Math.max(0.55, 1 - distance * 0.14);

    ctx.shadowColor = "rgba(0, 0, 0, 0.36)";
    ctx.shadowBlur = 26 * dpr;
    ctx.shadowOffsetY = 10 * dpr;

    ctx.drawImage(snapshot, x, y, w, h);

    ctx.restore();
  });

  counter.textContent = `${activeIndex + 1} / ${items.length}`;
}

function uploadSceneTexture() {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  gl.texImage2D(
    gl.TEXTURE_2D,
    0,
    gl.RGBA,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    sceneCanvas
  );
}

function renderWebGLScene(now, hidePill = false) {
  const isGalleryMoving = dragging || Math.abs(velocity) > 0.0005 || Math.abs(target - scroll) > 0.0005;
  if (sceneDirty || isGalleryMoving) {
    drawScene();
    uploadSceneTexture();
    sceneDirty = false;
  }

  gl.useProgram(program);
  gl.uniform1i(uniforms.scene, 0);
  gl.uniform2f(
    uniforms.resolution,
    visibleCanvas.width,
    visibleCanvas.height
  );
  gl.uniform2f(
    uniforms.cardCenter,
    0.5,
    1.0 - cardCenterY / visibleCanvas.height
  );
  gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
  gl.uniform1f(uniforms.time, now / 1000);

  if (!hidePill && cachedNavBaseRect.width > 0 && width > 0 && height > 0) {
    gl.uniform4f(
      uniforms.pillRect,
      navLensGeom.centerXCss / width,
      1.0 - (navLensGeom.centerYCss / height),
      navLensGeom.halfWCss / width,
      navLensGeom.halfHCss / height
    );
    gl.uniform1f(uniforms.pillPress, navLensGeom.press);
  } else {
    gl.uniform4f(uniforms.pillRect, 0, 0, 0, 0);
    gl.uniform1f(uniforms.pillPress, 0);
  }

  gl.clearColor(11 / 255, 24 / 255, 36 / 255, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function renderFrame(time) {
  if (document.hidden) {
    requestAnimationFrame(renderFrame);
    return;
  }

  const now = time || performance.now();

  if (!previousFrameTime) previousFrameTime = now;
  const dt = Math.min((now - previousFrameTime) / 1000, 1 / 30) || 1 / 60;
  previousFrameTime = now;

  if (!dragging) {
    const stiffness = 170;
    const damping = 2 * Math.sqrt(stiffness) * 0.92;

    velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
    scroll += velocity * dt;

    if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
      scroll = target;
      velocity = 0;
    }
  }

  updateLiquidPillPhysics(now, dt);

  if (activeTab === 0) {
    renderWebGLScene(now);
  } else if (activeTab === 2) {
    deviceToggleCtrl.updateSpring(now, dt);
    navToggleCtrl.updateSpring(now, dt);
    bgSliderCtrl.updateSpring(now, dt);
    frameSliderCtrl.updateSpring(now, dt);

    deviceToggleCtrl.renderOptics();
    navToggleCtrl.renderOptics();
    bgSliderCtrl.renderOptics();
    frameSliderCtrl.renderOptics();
  }

  drawLiquidNavRefraction();

  requestAnimationFrame(renderFrame);
}

function moveBy(direction) {
  target = Math.round(scroll) + direction;
  velocity = 0;
  sceneDirty = true;
}

stage.addEventListener("pointerdown", (event) => {
  if (activeTab !== 0) return;
  if (event.button !== undefined && event.button !== 0) return;

  dragging = true;
  sceneDirty = true;
  stage.classList.add("dragging");
  stage.setPointerCapture(event.pointerId);

  dragStartY = event.clientY;
  dragStartScroll = scroll;
  lastPointerY = event.clientY;
  lastPointerTime = performance.now();
  pointerVelocity = 0;
  velocity = 0;
  target = scroll;
});

stage.addEventListener("pointermove", (event) => {
  if (!dragging) return;

  const now = performance.now();
  const elapsed = Math.max(1, now - lastPointerTime);
  const dy = event.clientY - dragStartY;

  scroll = dragStartScroll - (dy * dpr) / slot;
  target = scroll;
  sceneDirty = true;

  pointerVelocity =
    (-(event.clientY - lastPointerY) * dpr / slot) /
    (elapsed / 1000);

  lastPointerY = event.clientY;
  lastPointerTime = now;
});

function finishDrag() {
  if (!dragging) return;

  dragging = false;
  sceneDirty = true;
  stage.classList.remove("dragging");

  const projected = scroll + pointerVelocity * 0.16;
  target = Math.round(projected);

  if (Math.abs(pointerVelocity) > 1.1) {
    target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
  }

  velocity = pointerVelocity;
}

stage.addEventListener("pointerup", finishDrag);
stage.addEventListener("pointercancel", finishDrag);

stage.addEventListener("wheel", (event) => {
  if (activeTab !== 0) return;
  event.preventDefault();

  const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
    ? event.deltaY
    : event.deltaX;

  if (!delta) return;

  wheelDelta += delta;
  window.clearTimeout(wheelTimer);

  wheelTimer = window.setTimeout(() => {
    const direction = Math.sign(wheelDelta);
    const steps = Math.min(
      items.length,
      Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
    );

    if (direction) {
      target = Math.round(scroll) + direction * steps;
      velocity = 0;
      sceneDirty = true;
    }

    wheelDelta = 0;
  }, 100);
}, { passive: false });

document.addEventListener("keydown", (event) => {
  if (activeTab !== 0) return;
  if (event.key === "ArrowDown") moveBy(1);
  if (event.key === "ArrowUp") moveBy(-1);
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    previousFrameTime = performance.now();
  }
});

async function init() {
  gl = visibleCanvas.getContext("webgl2", {
    alpha: false,
    antialias: true,
    preserveDrawingBuffer: true
  });

  if (!gl) {
    stage.innerHTML =
      "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
    return;
  }

  try {
    images = await Promise.all(items.map((item) => loadImage(item.image)));

    program = createProgram();
    gl.useProgram(program);
    gl.bindVertexArray(gl.createVertexArray());

    sceneTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    uniforms = {
      scene: gl.getUniformLocation(program, "uScene"),
      resolution: gl.getUniformLocation(program, "uResolution"),
      cardCenter: gl.getUniformLocation(program, "uCardCenter"),
      cardSize: gl.getUniformLocation(program, "uCardSize"),
      time: gl.getUniformLocation(program, "uTime"),
      pillRect: gl.getUniformLocation(program, "uPillRect"),
      pillPress: gl.getUniformLocation(program, "uPillPress")
    };

    resize();
    setTimeout(resize, 100);
    setTimeout(resize, 400);
    requestAnimationFrame(renderFrame);
  } catch (error) {
    console.error(error);
    stage.innerHTML =
      "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
  }
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 150));
window.visualViewport?.addEventListener("resize", resize);

init();
</script>
