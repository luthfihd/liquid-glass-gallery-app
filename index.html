/* =========================================================
   VIEWPORT & RESIZE
   ========================================================= */
function getFullScreenDimensions() {
  const isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia("(display-mode: standalone)").matches ||
    window.matchMedia("(display-mode: fullscreen)").matches;

  let w = Math.max(window.innerWidth, document.documentElement.clientWidth);
  let h = Math.max(window.innerHeight, document.documentElement.clientHeight);

  if (isStandalone && window.screen) {
    const isPortrait = window.innerHeight >= window.innerWidth;
    const screenH = isPortrait
      ? Math.max(window.screen.height, window.screen.width)
      : Math.min(window.screen.height, window.screen.width);

    h = Math.max(h, screenH);
  }

  return { w, h };
}

function updateCachedNavRect() {
  liquidNav.style.transform = "";
  const r = liquidNav.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) {
    cachedNavBaseRect = { left: r.left, top: r.top, width: r.width, height: r.height };
  }
}

function resize() {
  const { w, h } = getFullScreenDimensions();
  if (!w || !h) return;

  document.documentElement.style.height = `${h}px`;
  document.body.style.height = `${h}px`;
  app.style.height = `${h}px`;
  stage.style.height = `${h}px`;
  visibleCanvas.style.height = `${h}px`;

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = w;
  height = h;

  const pixelWidth = Math.max(1, Math.round(width * dpr));
  const pixelHeight = Math.max(1, Math.round(height * dpr));

  visibleCanvas.width = pixelWidth;
  visibleCanvas.height = pixelHeight;
  sceneCanvas.width = pixelWidth;
  sceneCanvas.height = pixelHeight;

  const isMobile = window.matchMedia("(max-width: 600px)").matches;

  const aspectRatio = 0.72;
  cardWidth = pixelWidth * (isMobile ? 0.94 : 0.74);
  cardHeight = cardWidth / aspectRatio;

  const maxCardHeight = pixelHeight * (isMobile ? 0.62 : 0.66);
  if (cardHeight > maxCardHeight) {
    cardHeight = maxCardHeight;
    cardWidth = cardHeight * aspectRatio;
  }

  const cardGap = (isMobile ? 250 : 50) * dpr;
  slot = cardHeight + cardGap;

  cardCenterY = pixelHeight * (isMobile ? 0.45 : 0.53);

  buildItemSnapshots();

  if (gl) {
    gl.viewport(0, 0, pixelWidth, pixelHeight);
  }

  updateCachedNavRect();
  resizeGlassCanvas();
  lastNavRenderSig = "";
  sceneDirty = true;

  if (activeTab === 2) {
    deviceToggleCtrl.sync(currentMockupDevice === "iphone" ? 0 : 1);
    navToggleCtrl.sync(includeNavInSS ? 0 : 1);
    bgSliderCtrl.sync(bgPresetIndex);
    frameSliderCtrl.sync(frameFinishIndex);
  }
}

function resizeGlassCanvas() {
  const baseW = cachedNavBaseRect.width || liquidNav.offsetWidth || Math.min(344, width - 32);
  const baseH = cachedNavBaseRect.height || liquidNav.offsetHeight || 64;
  const newWidth = Math.max(1, Math.round((baseW + 64) * dpr));
  const newHeight = Math.max(1, Math.round((baseH + 88) * dpr));

  if (glassCanvas.width !== newWidth || glassCanvas.height !== newHeight) {
    glassCanvas.width = newWidth;
    glassCanvas.height = newHeight;
    navAccentBuffer.width = newWidth;
    navAccentBuffer.height = newHeight;
    navLensLayer.width = newWidth;
    navLensLayer.height = newHeight;
    glassImageData = navLensCtx.createImageData(newWidth, newHeight);
    lastNavRenderSig = "";
  }
}

/* =========================================================
   DRAW SHARP TAB ICONS & LABELS (ZERO OVERLAP)
   ========================================================= */
function drawTabVectorIcon(octx, tabIdx, cx, cy, s) {
  octx.beginPath();
  if (tabIdx === 0) {
    const box = 7 * s;
    const gap = 3.5 * s;
    const r = 1.8 * s;
    octx.roundRect(cx - box - gap * 0.5, cy - box - gap * 0.5, box, box, r);
    octx.roundRect(cx + gap * 0.5, cy - box - gap * 0.5, box, box, r);
    octx.roundRect(cx + gap * 0.5, cy + gap * 0.5, box, box, r);
    octx.roundRect(cx - box - gap * 0.5, cy + gap * 0.5, box, box, r);
    octx.stroke();
  } else if (tabIdx === 1) {
    const w = 18 * s;
    const h = 13 * s;
    const topY = cy - h * 0.5 + 1.5 * s;
    octx.roundRect(cx - w * 0.5, topY, w, h, 3 * s);
    octx.moveTo(cx - 4.5 * s, topY);
    octx.lineTo(cx - 2.8 * s, topY - 2.6 * s);
    octx.lineTo(cx + 2.8 * s, topY - 2.6 * s);
    octx.lineTo(cx + 4.5 * s, topY);
    octx.stroke();

    octx.beginPath();
    octx.arc(cx, topY + h * 0.52, 3.1 * s, 0, Math.PI * 2);
    octx.stroke();
  } else {
    const w = 13.5 * s;
    const h = 19 * s;
    octx.roundRect(cx - w * 0.5, cy - h * 0.5, w, h, 2.8 * s);
    octx.moveTo(cx - 1.2 * s, cy + h * 0.5 - 3.2 * s);
    octx.lineTo(cx + 1.2 * s, cy + h * 0.5 - 3.2 * s);
    octx.stroke();
  }
}

function drawAllTabsGraphics(targetCtx, padX, padY, insetPx, tabW, navH, color, lineWidth) {
  const labels = ["Explore", "Snap", "Mockup"];
  const iconY = padY + navH * 0.38;
  const textY = padY + navH * 0.75;

  targetCtx.strokeStyle = color;
  targetCtx.fillStyle = color;
  targetCtx.lineWidth = lineWidth;
  targetCtx.lineCap = "round";
  targetCtx.lineJoin = "round";
  targetCtx.font = `660 ${Math.round(10.6 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
  targetCtx.textAlign = "center";
  targetCtx.textBaseline = "middle";

  for (let i = 0; i < 3; i++) {
    const cx = padX + insetPx + (i + 0.5) * tabW;
    drawTabVectorIcon(targetCtx, i, cx, iconY, dpr);
    targetCtx.fillText(labels[i], cx, textY);
  }
}

function drawLiquidNavRefraction() {
  resizeGlassCanvas();

  const lensWidth = glassCanvas.width;
  const lensHeight = glassCanvas.height;
  if (!lensWidth || !lensHeight || !glassImageData) return;

  const padX = 32 * dpr;
  const padY = 44 * dpr;
  const navW = lensWidth - padX * 2;
  const navH = lensHeight - padY * 2;
  const insetPx = 5 * dpr;
  const tabW = (navW - insetPx * 2) / 3;

  const { scaleX, scaleY } = getLiquidPillShape();

  const displayX = asymptoticEdge(pillSpring.x, 0, 2, 0.045);
  const pillHalfW = (tabW * scaleX) * 0.5;
  const pillHalfH = ((navH - insetPx * 2) * scaleY) * 0.5;
  const pillCenterX = padX + insetPx + (displayX + 0.5) * tabW;
  const pillCenterY = lensHeight * 0.5;
  const tiltShear = clamp(lensTiltSpring.x, -0.22, 0.22);

  const pc = clamp(pressSpring.x, 0, 1);
  const glowVal = clamp(touchGlowSpring.x, 0, 1);

  const navSig = `${pillCenterX.toFixed(2)}|${pillHalfW.toFixed(2)}|${pillHalfH.toFixed(2)}|${pc.toFixed(3)}|${glowVal.toFixed(2)}|${touchGlowX.toFixed(2)}|${currentBackdropLuma.toFixed(2)}|${tiltShear.toFixed(3)}|${currentAccentRgb.join(",")}|${lensWidth}x${lensHeight}`;
  if (navSig === lastNavRenderSig) return;
  lastNavRenderSig = navSig;

  navAccentCtx.clearRect(0, 0, lensWidth, lensHeight);
  navAccentCtx.save();
  drawAllTabsGraphics(
    navAccentCtx,
    padX,
    padY,
    insetPx,
    tabW,
    navH,
    `rgb(${currentAccentRgb.join(",")})`,
    2.0 * dpr
  );
  navAccentCtx.restore();

  const source = navAccentCtx.getImageData(0, 0, lensWidth, lensHeight).data;
  const output = glassImageData.data;

  const cornerR = Math.min(pillHalfW, pillHalfH);
  const boxHalfX = Math.max(0, pillHalfW - cornerR);
  const boxHalfY = Math.max(0, pillHalfH - cornerR);

  const edgeRippleAmp = Math.min(2.2, Math.abs(pillSpring.v) * 0.20) * dpr * pc;
  const velSkew = clamp(pillSpring.v * 0.11, -0.45, 0.45);

  const padBound = Math.ceil(4 * dpr);
  const minX = Math.max(0, Math.floor(pillCenterX - pillHalfW - padBound));
  const maxX = Math.min(lensWidth - 1, Math.ceil(pillCenterX + pillHalfW + padBound));
  const minY = Math.max(0, Math.floor(pillCenterY - pillHalfH - padBound));
  const maxY = Math.min(lensHeight - 1, Math.ceil(pillCenterY + pillHalfH + padBound));

  output.fill(0);

  for (let y = minY; y <= maxY; y++) {
    const dyPill = y - pillCenterY;
    const qyPill = Math.abs(dyPill) - boxHalfY;
    const oyPill = qyPill > 0 ? qyPill : 0;
    const oyPill2 = oyPill * oyPill;
    const shearOffset = dyPill * tiltShear;

    for (let x = minX; x <= maxX; x++) {
      const outIndex = (y * lensWidth + x) * 4;
      const dxPill = (x - pillCenterX) - shearOffset;

      const qxPill = Math.abs(dxPill) - boxHalfX;
      const oxPill = qxPill > 0 ? qxPill : 0;
      const ripple = edgeRippleAmp * Math.sin(dxPill * 0.075 + jellyPhase) * Math.cos(dyPill * 0.085 - jellyPhase * 0.8);
      const sdfPill = Math.sqrt(oxPill * oxPill + oyPill2) + Math.min(Math.max(qxPill, qyPill), 0) - cornerR + ripple * 0.35;

      if (sdfPill <= 1.45 * dpr) {
        shadeContentOnlyRefractionPixel(
          source, lensWidth, lensHeight, x, y,
          dxPill, dyPill, pillHalfW, pillHalfH,
          cornerR, sdfPill, pc, dpr,
          output, outIndex, pillSpring.v,
          touchGlowX, touchGlowY, glowVal,
          currentBackdropLuma
        );
      }
    }
  }

  navLensCtx.putImageData(glassImageData, 0, 0);

  glassCtx.clearRect(0, 0, lensWidth, lensHeight);
  glassCtx.save();
  drawAllTabsGraphics(
    glassCtx,
    padX,
    padY,
    insetPx,
    tabW,
    navH,
    "rgba(255, 255, 255, 0.94)",
    1.85 * dpr
  );

  glassCtx.globalCompositeOperation = "destination-out";
  drawRoundedRect(
    glassCtx,
    pillCenterX - pillHalfW,
    pillCenterY - pillHalfH,
    pillHalfW * 2,
    pillHalfH * 2,
    pillHalfH
  );
  glassCtx.fill();

  glassCtx.globalCompositeOperation = "source-over";
  glassCtx.drawImage(navLensLayer, 0, 0);
  glassCtx.restore();
}

function getOffset(index) {
  const count = items.length;
  let offset = index - scroll;
  offset = ((offset + count / 2) % count + count) % count - count / 2;
  return offset;
}

function drawScene() {
  const pixelWidth = sceneCanvas.width;
  const pixelHeight = sceneCanvas.height;

  const background = ctx.createLinearGradient(0, 0, pixelWidth, pixelHeight);
  background.addColorStop(0, "#1d2d3b");
  background.addColorStop(0.52, "#182838");
  background.addColorStop(1, "#07121e");
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, pixelWidth, pixelHeight);

  const activeIndex = wrapIndex(Math.round(scroll));

  if (activeIndex !== lastAppliedPaletteIndex && itemPalettes[activeIndex]) {
    lastAppliedPaletteIndex = activeIndex;
    applyNavMaterialYouPalette(itemPalettes[activeIndex]);
  }

  const activeBackdrop = backdropSnapshots[activeIndex];

  if (activeBackdrop) {
    ctx.save();
    ctx.globalAlpha = 0.90;
    ctx.drawImage(activeBackdrop, 0, 0, pixelWidth, pixelHeight);
    ctx.restore();

    ctx.fillStyle = "rgba(5, 14, 22, 0.18)";
    ctx.fillRect(0, 0, pixelWidth, pixelHeight);
  }

  const centerX = pixelWidth / 2;
  const centerY = cardCenterY;

  const visibleItems = items
    .map((item, index) => ({ index, offset: getOffset(index) }))
    .filter(({ offset }) => Math.abs(offset) <= 2.6)
    .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

  visibleItems.forEach(({ index, offset }) => {
    const distance = Math.abs(offset);
    const scale = 1 - Math.min(distance, 1) * 0.08;
    const w = cardWidth * scale;
    const h = cardHeight * scale;
    const x = centerX - w / 2;
    const y = centerY + offset * slot - h / 2;
    const snapshot = itemSnapshots[index];

    if (!snapshot) return;

    ctx.save();
    ctx.globalAlpha = Math.max(0.55, 1 - distance * 0.14);

    ctx.shadowColor = "rgba(0, 0, 0, 0.36)";
    ctx.shadowBlur = 26 * dpr;
    ctx.shadowOffsetY = 10 * dpr;

    ctx.drawImage(snapshot, x, y, w, h);

    ctx.restore();
  });

  counter.textContent = `${activeIndex + 1} / ${items.length}`;
}

function uploadSceneTexture() {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  gl.texImage2D(
    gl.TEXTURE_2D,
    0,
    gl.RGBA,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    sceneCanvas
  );
}

function renderWebGLScene(now, hidePill = false) {
  const isGalleryMoving = dragging || Math.abs(velocity) > 0.0005 || Math.abs(target - scroll) > 0.0005;
  if (sceneDirty || isGalleryMoving) {
    drawScene();
    uploadSceneTexture();
    sceneDirty = false;
  }

  gl.useProgram(program);
  gl.uniform1i(uniforms.scene, 0);
  gl.uniform2f(
    uniforms.resolution,
    visibleCanvas.width,
    visibleCanvas.height
  );
  gl.uniform2f(
    uniforms.cardCenter,
    0.5,
    1.0 - cardCenterY / visibleCanvas.height
  );
  gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
  gl.uniform1f(uniforms.time, now / 1000);

  if (!hidePill && cachedNavBaseRect.width > 0 && width > 0 && height > 0) {
    const { scaleX, scaleY } = getLiquidPillShape();
    const displayX = asymptoticEdge(pillSpring.x, 0, 2, 0.045);

    const bShift = clamp(barShiftSpring.x, -7, 7);
    const bStretch = clamp(barStretchSpring.x, -0.042, 0.052);
    const touchZoom = pressSpring.x * 0.05;
    const navScaleX = 1 + touchZoom + bStretch;
    const navScaleY = 1 + touchZoom - bStretch * 0.72;

    const navCenterX = cachedNavBaseRect.left + cachedNavBaseRect.width * 0.5 + bShift;
    const navCenterY = cachedNavBaseRect.top + cachedNavBaseRect.height * 0.5;
    const navW = cachedNavBaseRect.width * navScaleX;
    const navH = cachedNavBaseRect.height * navScaleY;

    const insetCss = 5 * navScaleX;
    const tabWCss = (navW - insetCss * 2) / 3;
    const pillHalfWCss = (tabWCss * scaleX) * 0.5;
    const pillHalfHCss = ((navH - 10 * navScaleY) * scaleY) * 0.5;

    const centerXCss = (navCenterX - navW * 0.5) + insetCss + (displayX + 0.5) * tabWCss;
    const centerYCss = navCenterY;

    gl.uniform4f(
      uniforms.pillRect,
      centerXCss / width,
      1.0 - (centerYCss / height),
      pillHalfWCss / width,
      pillHalfHCss / height
    );
    gl.uniform1f(uniforms.pillPress, clamp(pressSpring.x, 0, 1));
  } else {
    gl.uniform4f(uniforms.pillRect, 0, 0, 0, 0);
    gl.uniform1f(uniforms.pillPress, 0);
  }

  gl.clearColor(11 / 255, 24 / 255, 36 / 255, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function renderFrame(time) {
  if (document.hidden) {
    requestAnimationFrame(renderFrame);
    return;
  }

  const now = time || performance.now();

  if (!previousFrameTime) previousFrameTime = now;
  const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
  previousFrameTime = now;

  if (!dragging) {
    const stiffness = 170;
    const damping = 2 * Math.sqrt(stiffness) * 0.92;

    velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
    scroll += velocity * dt;

    if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
      scroll = target;
      velocity = 0;
    }
  }

  updateLiquidPillPhysics(dt);

  if (activeTab === 0) {
    renderWebGLScene(now);
  } else if (activeTab === 2) {
    deviceToggleCtrl.updateSpring(dt);
    navToggleCtrl.updateSpring(dt);
    bgSliderCtrl.updateSpring(dt);
    frameSliderCtrl.updateSpring(dt);

    deviceToggleCtrl.renderOptics();
    navToggleCtrl.renderOptics();
    bgSliderCtrl.renderOptics();
    frameSliderCtrl.renderOptics();
  }

  drawLiquidNavRefraction();

  requestAnimationFrame(renderFrame);
}

function moveBy(direction) {
  target = Math.round(scroll) + direction;
  velocity = 0;
  sceneDirty = true;
}

stage.addEventListener("pointerdown", (event) => {
  if (activeTab !== 0) return;
  if (event.button !== undefined && event.button !== 0) return;

  dragging = true;
  sceneDirty = true;
  stage.classList.add("dragging");
  stage.setPointerCapture(event.pointerId);

  dragStartY = event.clientY;
  dragStartScroll = scroll;
  lastPointerY = event.clientY;
  lastPointerTime = performance.now();
  pointerVelocity = 0;
  velocity = 0;
  target = scroll;
});

stage.addEventListener("pointermove", (event) => {
  if (!dragging) return;

  const now = performance.now();
  const elapsed = Math.max(1, now - lastPointerTime);
  const dy = event.clientY - dragStartY;

  scroll = dragStartScroll - (dy * dpr) / slot;
  target = scroll;
  sceneDirty = true;

  pointerVelocity =
    (-(event.clientY - lastPointerY) * dpr / slot) /
    (elapsed / 1000);

  lastPointerY = event.clientY;
  lastPointerTime = now;
});

function finishDrag() {
  if (!dragging) return;

  dragging = false;
  sceneDirty = true;
  stage.classList.remove("dragging");

  const projected = scroll + pointerVelocity * 0.16;
  target = Math.round(projected);

  if (Math.abs(pointerVelocity) > 1.1) {
    target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
  }

  velocity = pointerVelocity;
}

stage.addEventListener("pointerup", finishDrag);
stage.addEventListener("pointercancel", finishDrag);

stage.addEventListener("wheel", (event) => {
  if (activeTab !== 0) return;
  event.preventDefault();

  const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
    ? event.deltaY
    : event.deltaX;

  if (!delta) return;

  wheelDelta += delta;
  window.clearTimeout(wheelTimer);

  wheelTimer = window.setTimeout(() => {
    const direction = Math.sign(wheelDelta);
    const steps = Math.min(
      items.length,
      Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
    );

    if (direction) {
      target = Math.round(scroll) + direction * steps;
      velocity = 0;
      sceneDirty = true;
    }

    wheelDelta = 0;
  }, 100);
}, { passive: false });

document.addEventListener("keydown", (event) => {
  if (activeTab !== 0) return;
  if (event.key === "ArrowDown") moveBy(1);
  if (event.key === "ArrowUp") moveBy(-1);
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    previousFrameTime = performance.now();
  }
});

async function init() {
  gl = visibleCanvas.getContext("webgl2", {
    alpha: false,
    antialias: true,
    preserveDrawingBuffer: true
  });

  if (!gl) {
    stage.innerHTML =
      "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
    return;
  }

  try {
    images = await Promise.all(items.map((item) => loadImage(item.image)));

    program = createProgram();
    gl.useProgram(program);
    gl.bindVertexArray(gl.createVertexArray());

    sceneTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    uniforms = {
      scene: gl.getUniformLocation(program, "uScene"),
      resolution: gl.getUniformLocation(program, "uResolution"),
      cardCenter: gl.getUniformLocation(program, "uCardCenter"),
      cardSize: gl.getUniformLocation(program, "uCardSize"),
      time: gl.getUniformLocation(program, "uTime"),
      pillRect: gl.getUniformLocation(program, "uPillRect"),
      pillPress: gl.getUniformLocation(program, "uPillPress")
    };

    resize();
    setTimeout(resize, 100);
    setTimeout(resize, 400);
    requestAnimationFrame(renderFrame);
  } catch (error) {
    console.error(error);
    stage.innerHTML =
      "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
  }
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 150));
window.visualViewport?.addEventListener("resize", resize);

init();
</script>
