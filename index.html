<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Liquid Glass Gallery</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="theme-color" content="#141218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liquid Glass Gallery">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: #f3f8ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #07121e;
    }

    .app {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #07121e;
    }

    .stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .stage.dragging {
      cursor: grabbing;
    }

    #gl {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: absolute;
      z-index: 2;
      top: max(58px, env(safe-area-inset-top));
      left: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 650;
      letter-spacing: -0.045em;
    }

    .chevron {
      display: inline-block;
      margin-left: 4px;
      font-size: 0.72em;
      font-weight: 400;
      vertical-align: 0.12em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .add-button,
    .avatar {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
    }

    .add-button {
      display: grid;
      place-items: center;
      padding: 0 0 4px;
      color: white;
      font: inherit;
      font-size: 2rem;
      line-height: 1;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .avatar {
      display: block;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 600px) {
      .topbar {
        top: max(58px, env(safe-area-inset-top));
        left: 28px;
        right: 28px;
      }

      .top-actions {
        gap: 10px;
      }

      .add-button,
      .avatar {
        width: 48px;
        height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <h1>Upcoming <span class="chevron">⌄</span></h1>

      <div class="top-actions">
        <button class="add-button" type="button" aria-label="Tambah acara">+</button>
        <img
          class="avatar"
          src="https://images.unsplash.com/photo-1793605300952-49cbebdc3d49?q=80&w=128&h=128&fit=crop&ixlib=rb-4.1.0"
          alt=""
        >
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Galeri foto vertikal">
      <canvas id="gl"></canvas>
    </section>
  </main>

  <script>
    const items = [
      {
        image: "https://images.unsplash.com/photo-1793605300952-49cbebdc3d49?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://images.unsplash.com/photo-1793363562541-f27fa7e52688?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://images.unsplash.com/photo-1793443196021-12939c7dac83?q=80&w=1365&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://plus.unsplash.com/premium_photo-1792411651238-b1ad8610446b?q=80&w=1285&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://plus.unsplash.com/premium_photo-1792949574922-fc83c916d106?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      }
    ];

    const stage = document.getElementById("stage");
    const visibleCanvas = document.getElementById("gl");

    const sceneCanvas = document.createElement("canvas");
    const ctx = sceneCanvas.getContext("2d");

    let gl;
    let program;
    let sceneTexture;
    let uniforms;
    let images = [];

    let width = 0;
    let height = 0;
    let dpr = 1;
    let cardWidth = 0;
    let cardHeight = 0;
    let slot = 0;

    let scroll = 0;
    let target = 0;
    let velocity = 0;
    let dragging = false;

    let dragStartY = 0;
    let dragStartScroll = 0;
    let lastPointerY = 0;
    let lastPointerTime = 0;
    let pointerVelocity = 0;
    let previousFrameTime = 0;
    let liquidMotion = 0;

    let wheelDelta = 0;
    let wheelTimer = 0;

    const wrapIndex = (index) =>
      ((index % items.length) + items.length) % items.length;

    const vertexSource = `#version 300 es
      precision highp float;

      void main() {
        vec2 point = vec2(
          float((gl_VertexID << 1) & 2),
          float(gl_VertexID & 2)
        );

        gl_Position = vec4(point * 2.0 - 1.0, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      out vec4 outColor;

      uniform sampler2D uScene;
      uniform vec2 uResolution;
      uniform vec2 uCardSize;
      uniform float uTime;
      uniform float uRadius;
      uniform float uMotion;

      float roundedBoxDistance(vec2 point, vec2 halfSize, float radius) {
        vec2 q = abs(point) - halfSize + radius;

        return length(max(q, 0.0))
          + min(max(q.x, q.y), 0.0)
          - radius;
      }

      vec4 sampleScene(vec2 uv) {
        return texture(uScene, clamp(uv, 0.001, 0.999));
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        float aspect = uResolution.x / uResolution.y;

        vec2 offset = uv - vec2(0.5);
        vec2 clearPoint = vec2(offset.x * aspect, offset.y);

        vec2 clearHalfSize = vec2(
          uCardSize.x / (2.0 * uResolution.y),
          uCardSize.y / (2.0 * uResolution.y)
        );

        float clearDistance = roundedBoxDistance(
          clearPoint,
          clearHalfSize,
          uRadius / uResolution.y
        );

        vec4 original = sampleScene(uv);

        // Area kartu tetap jernih; refraksi hanya muncul di luarnya.
        if (clearDistance <= 0.0) {
          outColor = original;
          return;
        }

        float verticalPosition =
          abs(clearPoint.y) / max(clearHalfSize.y, 0.001);

        float horizontalPosition =
          abs(clearPoint.x) / max(clearHalfSize.x, 0.001);

        // Batasi efek pada pita atas dan bawah kartu.
        float topBottomBand =
          smoothstep(0.96, 1.015, verticalPosition) *
          (1.0 - smoothstep(1.16, 1.42, verticalPosition));

        // Kurangi efek di sisi kiri dan kanan kartu.
        float horizontalMask =
          1.0 - smoothstep(0.84, 1.18, horizontalPosition);

        float outsideCard = smoothstep(0.0, 0.035, clearDistance);
        float field = topBottomBand * horizontalMask * outsideCard;

        if (field <= 0.001) {
          outColor = original;
          return;
        }

        float wave =
          sin(clearPoint.x * 17.0 + uTime * 1.7) * 0.58 +
          sin(clearPoint.x * 31.0 - uTime * 1.1) * 0.24 +
          sin(uTime * 0.8) * 0.18;

        float motionBoost = 1.0 + uMotion * 2.8;

        // Perubahan koordinat hanya pada sumbu vertikal.
        float verticalShift =
          -sign(offset.y) *
          field *
          (0.012 + uMotion * 0.028) *
          motionBoost;

        verticalShift +=
          wave *
          field *
          (0.004 + uMotion * 0.012) *
          motionBoost;

        vec2 shift = vec2(0.0, verticalShift);
        vec2 spread = vec2(
          0.0,
          abs(verticalShift) * (0.12 + uMotion * 0.06)
        );

        vec2 redUv = uv + shift + spread;
        vec2 greenUv = uv + shift;
        vec2 blueUv = uv + shift - spread;

        vec4 refracted;
        refracted.r = sampleScene(redUv).r;
        refracted.g = sampleScene(greenUv).g;
        refracted.b = sampleScene(blueUv).b;
        refracted.a = 1.0;

        float rim = exp(-abs(clearDistance * uResolution.y) / 2.2);
        refracted.rgb += vec3(0.18, 0.23, 0.30) * rim * field;

        outColor = vec4(refracted.rgb, 1.0);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || "Shader gagal dikompilasi.");
      }

      return shader;
    }

    function createProgram() {
      const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      const result = gl.createProgram();

      gl.attachShader(result, vertex);
      gl.attachShader(result, fragment);
      gl.linkProgram(result);

      if (!gl.getProgramParameter(result, gl.LINK_STATUS)) {
        throw new Error(
          gl.getProgramInfoLog(result) || "Program WebGL gagal dibuat."
        );
      }

      return result;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(image);
        image.onerror = () =>
          reject(new Error(`Gagal memuat gambar: ${url}`));
        image.src = url;
      });
    }

    function resize() {
      const rect = stage.getBoundingClientRect();

      if (!rect.width || !rect.height) return;

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = rect.width;
      height = rect.height;

      const pixelWidth = Math.max(1, Math.round(width * dpr));
      const pixelHeight = Math.max(1, Math.round(height * dpr));

      visibleCanvas.width = pixelWidth;
      visibleCanvas.height = pixelHeight;
      sceneCanvas.width = pixelWidth;
      sceneCanvas.height = pixelHeight;

      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      // Kartu diperbesar untuk mobile dan tetap berbentuk portrait.
      const widthRatio = isMobile ? 0.94 : 0.68;
      const aspectRatio = isMobile ? 0.68 : 0.72;

      cardWidth = pixelWidth * widthRatio;
      cardHeight = cardWidth / aspectRatio;

      const maxCardHeight = pixelHeight * (isMobile ? 0.78 : 0.76);

      if (cardHeight > maxCardHeight) {
        cardHeight = maxCardHeight;
        cardWidth = cardHeight * aspectRatio;
      }

      // Posisi kartu berikutnya berada di atas/bawah, bukan di samping.
      const cardGap = (isMobile ? 45 : 50) * dpr;
      slot = cardHeight + cardGap;    

      if (gl) {
        gl.viewport(0, 0, pixelWidth, pixelHeight);
      }
    }

    function drawRoundedRect(context, x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);

      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + w, y, x + w, y + h, r);
      context.arcTo(x + w, y + h, x, y + h, r);
      context.arcTo(x, y + h, x, y, r);
      context.arcTo(x, y, x + w, y, r);
      context.closePath();
    }

    function drawImageCover(image, x, y, w, h) {
      const imageAspect = image.width / image.height;
      const boxAspect = w / h;

      let sx = 0;
      let sy = 0;
      let sw = image.width;
      let sh = image.height;

      if (imageAspect > boxAspect) {
        sw = image.height * boxAspect;
        sx = (image.width - sw) / 2;
      } else {
        sh = image.width / boxAspect;
        sy = (image.height - sh) / 2;
      }

      ctx.drawImage(image, sx, sy, sw, sh, x, y, w, h);
    }

    function getOffset(index) {
      const count = items.length;
      let offset = index - scroll;

      offset =
        ((offset + count / 2) % count + count) % count - count / 2;

      return offset;
    }

    function drawScene() {
      const pixelWidth = sceneCanvas.width;
      const pixelHeight = sceneCanvas.height;

      const background = ctx.createLinearGradient(
        0,
        0,
        pixelWidth,
        pixelHeight
      );

      background.addColorStop(0, "#1c3548");
      background.addColorStop(0.52, "#152638");
      background.addColorStop(1, "#07121e");

      ctx.fillStyle = background;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      const activeIndex = wrapIndex(Math.round(scroll));
      const activeImage = images[activeIndex];

      if (activeImage) {
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.filter = `blur(${24 * dpr}px) saturate(1.15)`;

        drawImageCover(
          activeImage,
          -20 * dpr,
          -20 * dpr,
          pixelWidth + 40 * dpr,
          pixelHeight + 40 * dpr
        );

        ctx.restore();

        ctx.fillStyle = "rgba(5, 14, 24, 0.42)";
        ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      }

      const centerX = pixelWidth / 2;
      const centerY = pixelHeight / 2;
      const radius = 35 * dpr;

      // Gambar kartu tetangga lebih dahulu agar kartu aktif berada di depan.
      const orderedItems = items
        .map((item, index) => ({
          item,
          index,
          offset: getOffset(index)
        }))
        .filter(({ offset }) => Math.abs(offset) <= 2.6)
        .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

      orderedItems.forEach(({ index, offset }) => {
        const distance = Math.abs(offset);
        const scale = 1 - Math.min(distance, 1) * 0.035;
        const w = cardWidth * scale;
        const h = cardHeight * scale;
        const x = centerX - w / 2;
        const y = centerY + offset * slot - h / 2;
        const image = images[index];

        ctx.save();

        // Kartu sekitar sedikit lebih redup daripada kartu aktif.
        ctx.globalAlpha = Math.max(0.72, 1 - distance * 0.12);

        ctx.shadowColor = "rgba(0, 0, 0, 0.42)";
        ctx.shadowBlur = 28 * dpr;
        ctx.shadowOffsetY = 12 * dpr;

        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.fillStyle = "#263646";
        ctx.fill();

        ctx.shadowColor = "transparent";
        ctx.save();

        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.clip();

        if (image) {
          drawImageCover(image, x, y, w, h);
        }

        // Gradasi lembut di bagian bawah foto.
        const bottomShade = ctx.createLinearGradient(
          0,
          y + h * 0.56,
          0,
          y + h
        );

        bottomShade.addColorStop(0, "rgba(0, 0, 0, 0)");
        bottomShade.addColorStop(1, "rgba(0, 0, 0, 0.2)");

        ctx.fillStyle = bottomShade;
        ctx.fillRect(x, y, w, h);

        ctx.restore();

        // Kilau dan garis pinggir Liquid Glass.
        const gloss = ctx.createLinearGradient(
          x,
          y,
          x + w,
          y + h * 0.55
        );

        gloss.addColorStop(0, "rgba(255, 255, 255, 0.18)");
        gloss.addColorStop(0.38, "rgba(255, 255, 255, 0.035)");
        gloss.addColorStop(1, "rgba(255, 255, 255, 0)");

        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.fillStyle = gloss;
        ctx.fill();

        drawRoundedRect(ctx, x, y, w, h, radius);
        ctx.lineWidth = 1.2 * dpr;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.38)";
        ctx.stroke();

        ctx.restore();
      });
    }

    function uploadSceneTexture() {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        sceneCanvas
      );
    }

    function renderFrame(time) {
      const now = time || performance.now();

      if (!previousFrameTime) previousFrameTime = now;

      const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
      previousFrameTime = now;

      if (!dragging) {
        const stiffness = 170;
        const damping = 2 * Math.sqrt(stiffness) * 0.92;

        velocity +=
          (-stiffness * (scroll - target) - damping * velocity) * dt;

        scroll += velocity * dt;

        if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
          scroll = target;
          velocity = 0;
        }
      }

      const movementSpeed = dragging
        ? Math.abs(pointerVelocity)
        : Math.abs(velocity);

      const motionTarget = Math.min(1, movementSpeed * 0.35);
      const motionBlend = 1 - Math.exp(-dt * 9);

      liquidMotion += (motionTarget - liquidMotion) * motionBlend;

      drawScene();
      uploadSceneTexture();

      gl.useProgram(program);
      gl.uniform1i(uniforms.scene, 0);
      gl.uniform2f(
        uniforms.resolution,
        visibleCanvas.width,
        visibleCanvas.height
      );
      gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
      gl.uniform1f(uniforms.time, now / 1000);
      gl.uniform1f(uniforms.radius, 35 * dpr);
      gl.uniform1f(uniforms.motion, liquidMotion);

      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      requestAnimationFrame(renderFrame);
    }

    function moveBy(direction) {
      target = Math.round(scroll) + direction;
      velocity = 0;
    }

    stage.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;

      dragging = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);

      dragStartY = event.clientY;
      dragStartScroll = scroll;
      lastPointerY = event.clientY;
      lastPointerTime = performance.now();

      pointerVelocity = 0;
      velocity = 0;
      target = scroll;
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const now = performance.now();
      const elapsed = Math.max(1, now - lastPointerTime);
      const dy = event.clientY - dragStartY;

      scroll = dragStartScroll - (dy * dpr) / slot;
      target = scroll;

      pointerVelocity =
        (-(event.clientY - lastPointerY) * dpr / slot) /
        (elapsed / 1000);

      lastPointerY = event.clientY;
      lastPointerTime = now;
    });

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      stage.classList.remove("dragging");

      const projected = scroll + pointerVelocity * 0.16;
      target = Math.round(projected);

      if (Math.abs(pointerVelocity) > 1.1) {
        target = Math.round(
          target + Math.sign(pointerVelocity) * 0.15
        );
      }

      velocity = pointerVelocity;
    }

    stage.addEventListener("pointerup", finishDrag);
    stage.addEventListener("pointercancel", finishDrag);

    // Scroll mouse/trackpad menggeser carousel secara vertikal.
    stage.addEventListener("wheel", (event) => {
      event.preventDefault();

      const delta =
        Math.abs(event.deltaY) >= Math.abs(event.deltaX)
          ? event.deltaY
          : event.deltaX;

      if (!delta) return;

      wheelDelta += delta;
      window.clearTimeout(wheelTimer);

      wheelTimer = window.setTimeout(() => {
        const direction = Math.sign(wheelDelta);
        const steps = Math.min(
          items.length,
          Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
        );

        if (direction) {
          target = Math.round(scroll) + direction * steps;
          velocity = 0;
        }

        wheelDelta = 0;
      }, 100);
    }, { passive: false });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown") moveBy(1);
      if (event.key === "ArrowUp") moveBy(-1);
    });

    async function init() {
      gl = visibleCanvas.getContext("webgl2", {
        alpha: false,
        antialias: true
      });

      if (!gl) {
        stage.innerHTML =
          "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
        return;
      }

      try {
        images = await Promise.all(
          items.map((item) => loadImage(item.image))
        );

        program = createProgram();
        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());

        sceneTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);

        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        uniforms = {
          scene: gl.getUniformLocation(program, "uScene"),
          resolution: gl.getUniformLocation(program, "uResolution"),
          cardSize: gl.getUniformLocation(program, "uCardSize"),
          time: gl.getUniformLocation(program, "uTime"),
          radius: gl.getUniformLocation(program, "uRadius"),
          motion: gl.getUniformLocation(program, "uMotion")
        };

        resize();
        requestAnimationFrame(renderFrame);
      } catch (error) {
        console.error(error);
        stage.innerHTML =
          "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
      }
    }

    window.addEventListener("resize", resize);
    init();
  </script>
</body>
</html>
