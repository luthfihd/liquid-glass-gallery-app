    }

    /* =========================================================
       WEBGL SHADERS (EXACT REPO CONCAVE LENS FRAME)
       ========================================================= */
    const vertexSource = `#version 300 es
      precision highp float;

      void main() {
        vec2 point = vec2(
          float((gl_VertexID << 1) & 2),
          float(gl_VertexID & 2)
        );
        gl_Position = vec4(point * 2.0 - 1.0, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      out vec4 outColor;

      uniform sampler2D uScene;
      uniform vec2 uResolution;
      uniform vec2 uCardCenter;
      uniform vec2 uCardSize;
      uniform float uTime;

      float roundedBoxDistance(vec2 point, vec2 halfSize, float radius) {
        vec2 q = abs(point) - halfSize + radius;
        return length(max(q, 0.0))
          + min(max(q.x, q.y), 0.0)
          - radius;
      }

      vec4 sampleScene(vec2 uv) {
        return texture(uScene, clamp(uv, 0.002, 0.998));
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        float aspect = uResolution.x / uResolution.y;

        vec2 offset = uv - uCardCenter;
        vec2 p = vec2(offset.x * aspect, offset.y);

        vec2 clearHalfSize = vec2(
          (uCardSize.x * 0.56) / uResolution.y,
          (uCardSize.y * 0.52) / uResolution.y
        );
        float cornerRadius = (uCardSize.x * 0.24) / uResolution.y;

        float clearDistance = roundedBoxDistance(p, clearHalfSize, cornerRadius);

        vec4 original = sampleScene(uv);
        if (clearDistance <= 0.0) {
          outColor = original;
          return;
        }

        float field = smoothstep(0.0, 0.16, clearDistance);

        float vertMask = smoothstep(
          clearHalfSize.y * 0.55,
          clearHalfSize.y * 1.05,
          abs(p.y)
        );
        field *= vertMask;

        float edgeGuard = smoothstep(0.0, 0.045, uv.y) * smoothstep(0.0, 0.045, 1.0 - uv.y);
        field *= edgeGuard;

        if (field <= 0.0005) {
          outColor = original;
          return;
        }

        float angle = atan(p.y, p.x);
        float fluidWave =
          sin(angle * 2.0 + uTime * 0.55) * 0.45 +
          sin(angle * 3.0 - uTime * 0.35) * 0.25;

        vec2 radialDir = normalize(offset + vec2(0.00001));
        vec2 tangentDir = vec2(-radialDir.y, radialDir.x);

        vec2 shift =
          offset * 0.24 * field +
          tangentDir * fluidWave * field * field * 0.008;

        vec2 spread = shift * 0.14;
        vec2 redUv = uv + shift + spread;
        vec2 greenUv = uv + shift;
        vec2 blueUv = uv + shift - spread;

        vec4 refracted;
        refracted.r = sampleScene(redUv).r;
        refracted.g = sampleScene(greenUv).g;
        refracted.b = sampleScene(blueUv).b;
        refracted.a = 1.0;

        float rim = exp(-abs(clearDistance * uResolution.y) / 3.0) * vertMask;
        refracted.rgb += vec3(0.08, 0.10, 0.13) * rim * field;

        outColor = refracted;
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || "Shader gagal dikompilasi.");
      }

      return shader;
    }

    function createProgram() {
      const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      const result = gl.createProgram();

      gl.attachShader(result, vertex);
      gl.attachShader(result, fragment);
      gl.linkProgram(result);

      if (!gl.getProgramParameter(result, gl.LINK_STATUS)) {
        throw new Error(
          gl.getProgramInfoLog(result) || "Program WebGL gagal dibuat."
        );
      }

      return result;
    }

    function loadImage(url, isBlob = false) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        if (!isBlob) {
          image.crossOrigin = "anonymous";
        }
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Gagal memuat gambar: ${url}`));
        image.src = url;
      });
    }

    function drawRoundedRect(context, x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);

      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + w, y, x + w, y + h, r);
      context.arcTo(x + w, y + h, x, y + h, r);
      context.arcTo(x, y + h, x, y, r);
      context.arcTo(x, y, x + w, y, r);
      context.closePath();
    }

    function drawImageToContext(context, image, x, y, w, h) {
      const imageAspect = image.width / image.height;
      const boxAspect = w / h;

      let sx = 0;
      let sy = 0;
      let sw = image.width;
      let sh = image.height;

      if (imageAspect > boxAspect) {
        sw = image.height * boxAspect;
        sx = (image.width - sw) / 2;
      } else {
        sh = image.width / boxAspect;
        sy = (image.height - sh) / 2;
      }

      context.drawImage(image, sx, sy, sw, sh, x, y, w, h);
    }

    function createBlurredCanvas(image, targetW, targetH, passes = 5) {
      const smallW = Math.max(16, Math.round(targetW / 18));
      const smallH = Math.max(16, Math.round(targetH / 18));

      const tempA = document.createElement("canvas");
      tempA.width = smallW;
      tempA.height = smallH;
      const ctxA = tempA.getContext("2d");
      ctxA.imageSmoothingEnabled = true;
      ctxA.imageSmoothingQuality = "high";
      drawImageToContext(ctxA, image, 0, 0, smallW, smallH);

      const tempB = document.createElement("canvas");
      tempB.width = Math.max(12, Math.round(smallW * 0.65));
      tempB.height = Math.max(12, Math.round(smallH * 0.65));
      const ctxB = tempB.getContext("2d");
      ctxB.imageSmoothingEnabled = true;
      ctxB.imageSmoothingQuality = "high";

      for (let i = 0; i < passes; i++) {
        ctxB.clearRect(0, 0, tempB.width, tempB.height);
        ctxB.drawImage(tempA, 0, 0, tempB.width, tempB.height);
        ctxA.clearRect(0, 0, tempA.width, tempA.height);
        ctxA.drawImage(tempB, 0, 0, tempA.width, tempA.height);
      }

      const out = document.createElement("canvas");
      out.width = targetW;
      out.height = targetH;
      const outCtx = out.getContext("2d");
      outCtx.imageSmoothingEnabled = true;
      outCtx.imageSmoothingQuality = "high";
      outCtx.drawImage(tempA, 0, 0, targetW, targetH);

      return out;
    }

    function createSnapshotForImage(image) {
      const w = Math.max(1, Math.round(cardWidth));
      const h = Math.max(1, Math.round(cardHeight));
      const radius = 35 * dpr;

      const snap = document.createElement("canvas");
      snap.width = w;
      snap.height = h;
      const sctx = snap.getContext("2d");

      sctx.save();
      drawRoundedRect(sctx, 0, 0, w, h, radius);
      sctx.clip();

      drawImageToContext(sctx, image, 0, 0, w, h);

      const shade = sctx.createLinearGradient(0, h * 0.60, 0, h);
      shade.addColorStop(0, "rgba(0, 0, 0, 0)");
      shade.addColorStop(1, "rgba(0, 0, 0, 0.18)");
      sctx.fillStyle = shade;
      sctx.fillRect(0, 0, w, h);

      sctx.restore();

      return snap;
    }

    function createBackdropForImage(image) {
      const w = Math.max(1, Math.round(sceneCanvas.width / 2));
      const h = Math.max(1, Math.round(sceneCanvas.height / 2));
      return createBlurredCanvas(image, w, h, 5);
    }

    function buildItemSnapshots() {
      if (!images.length || !cardWidth || !cardHeight) return;
      itemSnapshots = images.map((image) => createSnapshotForImage(image));
      backdropSnapshots = images.map((image) => createBackdropForImage(image));
      itemPalettes = images.map((image) => extractMaterialYouPalette(image));
      lastAppliedPaletteIndex = -1;
    }

    /* =========================================================
       HELPER: TAMBAH FOTO BARU & KEMBALI KE EXPLORE
       ========================================================= */
    async function addNewPhotosAndFocus(sources) {
      if (!sources.length) return;
      const firstNewIndex = items.length;

      for (const src of sources) {
        try {
          const loadedImg = await loadImage(src, true);
          items.push({ image: src, isSession: true });
          images.push(loadedImg);
          itemSnapshots.push(createSnapshotForImage(loadedImg));
          backdropSnapshots.push(createBackdropForImage(loadedImg));
          itemPalettes.push(extractMaterialYouPalette(loadedImg));
        } catch (err) {
          console.error("Gagal memuat foto baru:", err);
        }
      }

      switchTab(0, { skipCapture: true });

      if (items.length > firstNewIndex) {
        const currentRound = Math.round(scroll);
        const currentWrapped = wrapIndex(currentRound);
        let diff = firstNewIndex - currentWrapped;
        if (diff <= 0) diff += items.length;
        target = currentRound + diff;
      }
    }

    /* =========================================================
       CAMERA & SNAP VIEW LOGIC
       ========================================================= */
    async function startCamera() {
      cameraFallback.classList.remove("visible");
      stopCamera();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        cameraFallback.classList.add("visible");
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.classList.toggle("mirrored", facingMode === "user");
      } catch (err) {
        console.warn("Akses kamera tidak tersedia:", err);
        cameraFallback.classList.add("visible");
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
      cameraVideo.srcObject = null;
    }

    closeSnapBtn.addEventListener("click", () => {
      switchTab(0, { skipCapture: true });
    });

    flipCameraBtn.addEventListener("click", () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    photoPickBtn.addEventListener("click", () => {
      photoInput.click();
    });

    photoInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []).filter((file) =>
        file.type.startsWith("image/")
      );
      photoInput.value = "";
      if (!files.length) return;

      const urls = files.map((file) => {
        const url = URL.createObjectURL(file);
        sessionObjectUrls.push(url);
        return url;
      });

      await addNewPhotosAndFocus(urls);
    });

    shotBtn.addEventListener("click", () => {
      if (!cameraStream || !cameraVideo.videoWidth || !cameraVideo.videoHeight) {
        photoInput.click();
        return;
      }

      triggerFlashEffect();

      const snapCanvas = document.createElement("canvas");
      snapCanvas.width = cameraVideo.videoWidth;
      snapCanvas.height = cameraVideo.videoHeight;
      const sctx = snapCanvas.getContext("2d");

      if (facingMode === "user") {
        sctx.translate(snapCanvas.width, 0);
        sctx.scale(-1, 1);
      }
      sctx.drawImage(cameraVideo, 0, 0, snapCanvas.width, snapCanvas.height);

      snapCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        sessionObjectUrls.push(url);
        await addNewPhotosAndFocus([url]);
      }, "image/jpeg", 0.94);
    });

    /* =========================================================
       MOCKUP CAPTURE & COMPOSITOR
       ========================================================= */
    function triggerFlashEffect() {
      captureFlash.classList.remove("flash-anim");
      void captureFlash.offsetWidth;
      captureFlash.classList.add("flash-anim");
      if (navigator.vibrate) {
        navigator.vibrate(18);
      }
    }

    function captureCurrentExploreScreen() {
      const activeIndex = wrapIndex(Math.round(scroll));
      capturedPalette = itemPalettes[activeIndex] || {
        primary: [24, 42, 62],
        accent: [45, 168, 255],
        muted: [222, 232, 245],
        pill: [255, 255, 255],
        vibrant: [56, 118, 178],
        deepDark: [12, 22, 34],
        softPastel: [224, 236, 248],
        secondary: [100, 175, 235]
      };
      capturedImageUrl = items[activeIndex]?.image || "";

      if (gl && program) {
        renderWebGLScene(performance.now());
      } else {
        drawScene();
      }

      const w = Math.max(1, visibleCanvas.width || sceneCanvas.width);
      const h = Math.max(1, visibleCanvas.height || sceneCanvas.height);
      const shot = document.createElement("canvas");
      shot.width = w;
      shot.height = h;
      const sctx = shot.getContext("2d");

      try {
        if (gl && visibleCanvas.width > 0) {
          sctx.drawImage(visibleCanvas, 0, 0, w, h);
        } else {
          sctx.drawImage(sceneCanvas, 0, 0, w, h);
        }
      } catch (e) {
        sctx.drawImage(sceneCanvas, 0, 0, w, h);
      }

      capturedRawScene = shot;

      updateMockupBackgroundDOM();
      renderDeviceMockup();
    }

    function getBackgroundPresets(pal) {
      const p = pal || {
        vibrant: [56, 118, 178],
        secondary: [100, 175, 235],
        deepDark: [12, 22, 34],
        softPastel: [224, 236, 248],
        muted: [222, 232, 245],
        primary: [24, 42, 62]
      };
      return [
        { name: "Photo Blur", type: "photo" },
        {
          name: "Vibrant You",
          type: "gradient",
          c1: `rgb(${p.vibrant.join(",")})`,
          c2: `rgb(${p.secondary.join(",")})`,
          c3: `rgb(${p.deepDark.join(",")})`
        },
        {
          name: "Deep Tonal",
          type: "gradient",
          c1: `rgb(${p.deepDark.join(",")})`,
          c2: `rgb(${p.primary.join(",")})`,
          c3: "#070b10"
        },
        {
          name: "Soft Pastel",
          type: "gradient",
          c1: `rgb(${p.softPastel.join(",")})`,
          c2: "#f7f9fc",
          c3: `rgb(${p.muted.join(",")})`
        },
        {
          name: "Studio Dark",
          type: "gradient",
          c1: "#1f242b",
          c2: "#101318",
          c3: "#07090c"
        }
      ];
    }

    function updateMockupBackgroundDOM() {
      const presets = getBackgroundPresets(capturedPalette);
      const preset = presets[bgPresetIndex] || presets[0];
      const text = `BG: ${preset.name}`;
      bgSliderLabelBase.textContent = text;
      bgSliderLabelLens.textContent = text;

      if (preset.type === "photo" && capturedImageUrl) {
        mockupBg.style.backgroundImage = `url("${capturedImageUrl}")`;
        mockupBg.style.filter = "blur(36px) saturate(1.25) brightness(0.62)";
      } else {
        mockupBg.style.backgroundImage = `radial-gradient(circle at 22% 18%, ${preset.c1} 0%, ${preset.c2} 52%, ${preset.c3} 100%)`;
        mockupBg.style.filter = "none";
      }
    }

    function formatCurrentTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    function drawBackgroundOnExportCanvas(mctx, outW, outH) {
      const presets = getBackgroundPresets(capturedPalette);
      const preset = presets[bgPresetIndex] || presets[0];

      if (preset.type === "photo" && images.length) {
        const activeIndex = wrapIndex(Math.round(scroll));
        const blurSnap = backdropSnapshots[activeIndex];
        if (blurSnap) {
          drawImageToContext(mctx, blurSnap, 0, 0, outW, outH);
          mctx.fillStyle = "rgba(6, 12, 20, 0.28)";
          mctx.fillRect(0, 0, outW, outH);
          return;
        }
      }

      const grad = mctx.createLinearGradient(0, 0, outW, outH);
      grad.addColorStop(0, preset.c1 || "#1d2d3b");
      grad.addColorStop(0.52, preset.c2 || "#121e2b");
      grad.addColorStop(1, preset.c3 || "#071019");
      mctx.fillStyle = grad;
      mctx.fillRect(0, 0, outW, outH);
    }

    function updateSegmentedLensClip(thumbEl, lensLayerEl, base0El, base1El, ratio, morphing) {
      const xPct = ratio * 100;
      const scaleX = morphing ? 1.12 : 1;
      const scaleY = morphing ? 1.24 : 1;
      thumbEl.style.transform = `translate3d(${xPct}%, 0, 0) scale(${scaleX}, ${scaleY})`;

      const leftPct = Math.max(0, Math.min(50, ratio * 50));
      const rightPct = Math.max(0, Math.min(50, 50 - leftPct));
      lensLayerEl.style.clipPath = `inset(-8px ${rightPct}% -8px ${leftPct}% round 999px)`;

      base0El.style.opacity = Math.max(0, Math.min(1, ratio * 1.4));
      base1El.style.opacity = Math.max(0, Math.min(1, (1 - ratio) * 1.4));
    }

    function syncSegmentedToggles() {
      const isIphone = currentMockupDevice === "iphone";
      updateSegmentedLensClip(deviceToggleThumb, deviceToggleLensLayer, devBase0, devBase1, isIphone ? 0 : 1, false);
      updateSegmentedLensClip(navToggleThumb, navToggleLensLayer, navBase0, navBase1, includeNavInSS ? 0 : 1, false);
    }

    function renderDeviceMockup() {
      if (!capturedRawScene) return;

      syncSegmentedToggles();

      const finish = frameFinishes[frameFinishIndex] || frameFinishes[0];
      const frameText = `Frame: ${finish.name}`;
      frameSliderLabelBase.textContent = frameText;
      frameSliderLabelLens.textContent = frameText;

      const outW = 1200;
      const outH = 2400;
      mockupPreviewCanvas.width = outW;
      mockupPreviewCanvas.height = outH;
      const mctx = mockupPreviewCanvas.getContext("2d");

      drawBackgroundOnExportCanvas(mctx, outW, outH);

      const isIphone = currentMockupDevice === "iphone";
      const bodyW = 940;
      const bodyH = isIphone ? 2020 : 2060;
      const bodyX = (outW - bodyW) / 2;
      const bodyY = (outH - bodyH) / 2;
      const outerRadius = isIphone ? 148 : 112;
      const bezel = isIphone ? 28 : 22;
      const screenX = bodyX + bezel;
      const screenY = bodyY + bezel;
      const screenW = bodyW - bezel * 2;
      const screenH = bodyH - bezel * 2;
      const screenRadius = outerRadius - bezel;

      mctx.save();
      mctx.shadowColor = "rgba(0, 0, 0, 0.55)";
      mctx.shadowBlur = 70;
      mctx.shadowOffsetY = 34;
      drawRoundedRect(mctx, bodyX, bodyY, bodyW, bodyH, outerRadius);
      mctx.fillStyle = "#111317";
      mctx.fill();
      mctx.restore();

      mctx.fillStyle = finish.stops[1];
      if (isIphone) {
        drawRoundedRect(mctx, bodyX - 7, bodyY + 340, 7, 68, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX - 7, bodyY + 455, 7, 130, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX - 7, bodyY + 615, 7, 130, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX + bodyW, bodyY + 495, 7, 190, 3);
        mctx.fill();
      } else {
        drawRoundedRect(mctx, bodyX + bodyW, bodyY + 380, 7, 180, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX + bodyW, bodyY + 610, 7, 105, 3);
        mctx.fill();
      }

      const frameGrad = mctx.createLinearGradient(bodyX, bodyY, bodyX + bodyW, bodyY + bodyH);
      frameGrad.addColorStop(0, finish.stops[0]);
      frameGrad.addColorStop(0.25, finish.stops[1]);
      frameGrad.addColorStop(0.5, finish.stops[2]);
      frameGrad.addColorStop(0.8, finish.stops[3]);
      frameGrad.addColorStop(1, finish.stops[4]);

      drawRoundedRect(mctx, bodyX, bodyY, bodyW, bodyH, outerRadius);
      mctx.fillStyle = frameGrad;
      mctx.fill();

      drawRoundedRect(mctx, bodyX + 8, bodyY + 8, bodyW - 16, bodyH - 16, outerRadius - 6);
      mctx.fillStyle = "#07090c";
      mctx.fill();

      mctx.save();
      drawRoundedRect(mctx, screenX, screenY, screenW, screenH, screenRadius);
      mctx.clip();

      drawImageToContext(mctx, capturedRawScene, screenX, screenY, screenW, screenH);

      if (includeNavInSS) {
        const navW = screenW * 0.82;
        const navH = 110;
        const navX = screenX + (screenW - navW) / 2;
        const navY = screenY + screenH - navH - 54;

        mctx.save();
        drawRoundedRect(mctx, navX, navY, navW, navH, navH / 2);
        mctx.fillStyle = "rgba(255, 255, 255, 0.06)";
        mctx.fill();
        mctx.lineWidth = 1.5;
        mctx.strokeStyle = "rgba(255, 255, 255, 0.42)";
        mctx.stroke();

        const tabW = (navW - 16) / 3;
        drawRoundedRect(mctx, navX + 8, navY + 6, tabW, navH - 12, (navH - 12) / 2);
        mctx.lineWidth = 1.5;
        mctx.strokeStyle = "rgba(255, 255, 255, 0.56)";
        mctx.stroke();

        const acc = capturedPalette ? capturedPalette.accent : [45, 168, 255];
        const labels = ["Explore", "Snap", "Mockup"];
        mctx.font = "680 22px -apple-system, system-ui, sans-serif";
        mctx.textAlign = "center";
        mctx.textBaseline = "middle";
        labels.forEach((label, idx) => {
          mctx.fillStyle = idx === 0 ? `rgb(${acc.join(",")})` : "rgba(255, 255, 255, 0.88)";
          mctx.fillText(label, navX + 8 + tabW * (idx + 0.5), navY + navH * 0.52);
        });
        mctx.restore();
      }

      const topStatusGrad = mctx.createLinearGradient(0, screenY, 0, screenY + 130);
      topStatusGrad.addColorStop(0, "rgba(0, 0, 0, 0.34)");
      topStatusGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
      mctx.fillStyle = topStatusGrad;
      mctx.fillRect(screenX, screenY, screenW, 130);

      const timeStr = formatCurrentTime();
      mctx.fillStyle = "#ffffff";
      mctx.textBaseline = "middle";

      if (isIphone) {
        mctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
        mctx.textAlign = "left";
        mctx.fillText(timeStr, screenX + 68, screenY + 66);

        const islandW = 246;
        const islandH = 72;
        const islandX = screenX + (screenW - islandW) / 2;
        const islandY = screenY + 28;
        drawRoundedRect(mctx, islandX, islandY, islandW, islandH, islandH / 2);
        mctx.fillStyle = "#000000";
        mctx.fill();

        mctx.beginPath();
        mctx.arc(islandX + islandW - 44, islandY + islandH / 2, 13, 0, Math.PI * 2);
        mctx.fillStyle = "#111927";
        mctx.fill();
        mctx.beginPath();
        mctx.arc(islandX + islandW - 41, islandY + islandH / 2 - 3, 5, 0, Math.PI * 2);
        mctx.fillStyle = "rgba(95, 155, 255, 0.45)";
        mctx.fill();

        const rightBaseX = screenX + screenW - 64;
        const statusCenterY = screenY + 66;

        drawRoundedRect(mctx, rightBaseX - 52, statusCenterY - 12, 46, 24, 6);
        mctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        mctx.lineWidth = 2.5;
        mctx.stroke();
        drawRoundedRect(mctx, rightBaseX - 48, statusCenterY - 8, 36, 16, 4);
        mctx.fillStyle = "#ffffff";
        mctx.fill();
        mctx.fillRect(rightBaseX - 3, statusCenterY - 4, 3, 8);

        for (let b = 0; b < 4; b++) {
          const bh = 9 + b * 4.2;
          drawRoundedRect(mctx, rightBaseX - 110 + b * 9.5, statusCenterY + 11 - bh, 6, bh, 2);
          mctx.fill();
        }

        drawRoundedRect(
          mctx,
          screenX + (screenW - 310) / 2,
          screenY + screenH - 32,
          310,
          10,
          5
        );
        mctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        mctx.fill();
      } else {
        mctx.font = "600 31px 'Segoe UI', Roboto, sans-serif";
        mctx.textAlign = "left";
        mctx.fillText(timeStr, screenX + 54, screenY + 58);

        const holeX = screenX + screenW / 2;
        const holeY = screenY + 56;
        mctx.beginPath();
        mctx.arc(holeX, holeY, 20, 0, Math.PI * 2);
        mctx.fillStyle = "#000000";
        mctx.fill();
        mctx.beginPath();
        mctx.arc(holeX - 4, holeY - 4, 5.5, 0, Math.PI * 2);
        mctx.fillStyle = "rgba(100, 170, 255, 0.35)";
        mctx.fill();

        const rightBaseX = screenX + screenW - 52;
        const statusCenterY = screenY + 58;

        drawRoundedRect(mctx, rightBaseX - 22, statusCenterY - 13, 20, 26, 4);
        mctx.fillStyle = "#ffffff";
        mctx.fill();
        mctx.fillRect(rightBaseX - 16, statusCenterY - 17, 8, 4);

        mctx.beginPath();
        mctx.moveTo(rightBaseX - 60, statusCenterY + 12);
        mctx.lineTo(rightBaseX - 36, statusCenterY + 12);
        mctx.lineTo(rightBaseX - 36, statusCenterY - 12);
        mctx.closePath();
        mctx.fill();

        drawRoundedRect(
          mctx,
          screenX + (screenW - 240) / 2,
          screenY + screenH - 25,
          240,
          8,
          4
        );
        mctx.fillStyle = "rgba(255, 255, 255, 0.78)";
        mctx.fill();
      }

      const glassSheen = mctx.createLinearGradient(screenX, screenY, screenX + screenW * 0.7, screenY + screenH * 0.45);
      glassSheen.addColorStop(0, "rgba(255, 255, 255, 0.10)");
      glassSheen.addColorStop(0.45, "rgba(255, 255, 255, 0.02)");
      glassSheen.addColorStop(1, "rgba(255, 255, 255, 0)");
      mctx.fillStyle = glassSheen;
      mctx.fillRect(screenX, screenY, screenW, screenH);

      mctx.restore();
    }

    /* =========================================================
       SEGMENTED TOGGLES
       ========================================================= */
    function bindSegmentedToggle(containerEl, thumbEl, lensLayerEl, base0El, base1El, getCurrentIdx, onSelectIndex) {
      let draggingSeg = false;
      let startX = 0;
      let startRatio = 0;
      let currentRatio = 0;
      let moved = false;

      containerEl.addEventListener("pointerdown", (e) => {
        draggingSeg = true;
        moved = false;
        startX = e.clientX;
        startRatio = getCurrentIdx();
        currentRatio = startRatio;
        containerEl.classList.add("is-morphing");
        try { containerEl.setPointerCapture(e.pointerId); } catch (_) {}
        updateSegmentedLensClip(thumbEl, lensLayerEl, base0El, base1El, currentRatio, true);
      });

      containerEl.addEventListener("pointermove", (e) => {
        if (!draggingSeg) return;
        const rect = containerEl.getBoundingClientRect();
        const halfW = (rect.width - 6) / 2;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) moved = true;

        currentRatio = Math.max(-0.08, Math.min(1.08, startRatio + dx / halfW));
        updateSegmentedLensClip(thumbEl, lensLayerEl, base0El, base1El, currentRatio, true);
      });

      function endSeg(e) {
        if (!draggingSeg) return;
        draggingSeg = false;
        containerEl.classList.remove("is-morphing");

        let targetIdx;
        if (!moved && e && e.clientX !== undefined) {
          const rect = containerEl.getBoundingClientRect();
          const relX = e.clientX - rect.left;
          targetIdx = relX < rect.width / 2 ? 0 : 1;
        } else {
          targetIdx = currentRatio >= 0.5 ? 1 : 0;
        }
        onSelectIndex(targetIdx);
      }

      containerEl.addEventListener("pointerup", endSeg);
      containerEl.addEventListener("pointercancel", () => {
        draggingSeg = false;
        containerEl.classList.remove("is-morphing");
        onSelectIndex(getCurrentIdx());
      });
    }

    bindSegmentedToggle(
      deviceToggle,
      deviceToggleThumb,
      deviceToggleLensLayer,
      devBase0,
      devBase1,
      () => (currentMockupDevice === "iphone" ? 0 : 1),
      (idx) => {
        currentMockupDevice = idx === 0 ? "iphone" : "android";
        renderDeviceMockup();
      }
    );

    bindSegmentedToggle(
      navToggle,
      navToggleThumb,
      navToggleLensLayer,
      navBase0,
      navBase1,
      () => (includeNavInSS ? 0 : 1),
      (idx) => {
        includeNavInSS = idx === 0;
        renderDeviceMockup();
      }
    );

    /* =========================================================
       BUG-FREE PILL-SHAPED SLIDERS (TAP ANYWHERE OR DRAG)
       ========================================================= */
    function bindLiquidSlider(sliderEl, thumbEl, baseLabelEl, lensLabelEl, getStepsCount, onStepChange) {
      let isSliding = false;
      let startX = 0;
      let startRatio = 0;
      let currentRatio = 0;
      let moved = false;

      const THUMB_W = 64;
      const THUMB_H = 34;

      function positionThumb(ratio, morphing = false) {
        const clampedRatio = Math.max(0, Math.min(1, ratio));
        const rect = sliderEl.getBoundingClientRect();
        const cardW = rect.width || 180;
        const cardH = rect.height || 42;
        const maxTravel = Math.max(1, cardW - THUMB_W - 6);
        const x = clampedRatio * maxTravel;
        const sx = morphing ? 1.12 : 1;
        const sy = morphing ? 1.22 : 1;

        thumbEl.style.transform = `translate3d(${x}px, 0, 0) scale(${sx}, ${sy})`;

        const effW = THUMB_W * sx;
        const effH = THUMB_H * sy;
        const centerX = 3 + x + THUMB_W * 0.5;
        const centerY = cardH * 0.5;

        const left = Math.max(0, centerX - effW * 0.5);
        const right = Math.max(0, cardW - (centerX + effW * 0.5));
        const top = Math.max(0, centerY - effH * 0.5);
        const bottom = Math.max(0, cardH - (centerY + effH * 0.5));

        lensLabelEl.style.clipPath = `inset(${top.toFixed(1)}px ${right.toFixed(1)}px ${bottom.toFixed(1)}px ${left.toFixed(1)}px round 999px)`;
        baseLabelEl.style.clipPath = `polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, ${left.toFixed(1)}px ${top.toFixed(1)}px, ${left.toFixed(1)}px ${(cardH - bottom).toFixed(1)}px, ${(cardW - right).toFixed(1)}px ${(cardH - bottom).toFixed(1)}px, ${(cardW - right).toFixed(1)}px ${top.toFixed(1)}px, ${left.toFixed(1)}px ${top.toFixed(1)}px)`;
      }

      sliderEl.addEventListener("pointerdown", (e) => {
        isSliding = true;
        moved = false;
        startX = e.clientX;
        startRatio = currentRatio;
        sliderEl.classList.add("is-morphing");
        try { sliderEl.setPointerCapture(e.pointerId); } catch (_) {}
        positionThumb(currentRatio, true);
      });

      sliderEl.addEventListener("pointermove", (e) => {
        if (!isSliding) return;
        const rect = sliderEl.getBoundingClientRect();
        const maxTravel = Math.max(1, rect.width - THUMB_W - 6);
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) moved = true;

        currentRatio = Math.max(0, Math.min(1, startRatio + dx / maxTravel));
        positionThumb(currentRatio, true);

        const steps = getStepsCount();
        const idx = Math.min(steps - 1, Math.round(currentRatio * (steps - 1)));
        onStepChange(idx);
      });

      function endSlide(e) {
        if (!isSliding) return;
        isSliding = false;
        sliderEl.classList.remove("is-morphing");
        const steps = getStepsCount();

        if (!moved && e && typeof e.clientX === "number") {
          const rect = sliderEl.getBoundingClientRect();
          const relRatio = Math.max(0, Math.min(1, (e.clientX - rect.left - THUMB_W * 0.5) / Math.max(1, rect.width - THUMB_W)));
          const tappedIdx = Math.min(steps - 1, Math.round(relRatio * (steps - 1)));
          const curIdx = Math.min(steps - 1, Math.round(currentRatio * (steps - 1)));
          const nextIdx = tappedIdx === curIdx ? (curIdx + 1) % steps : tappedIdx;
          currentRatio = steps > 1 ? nextIdx / (steps - 1) : 0;
          onStepChange(nextIdx);
        } else {
          const snapIdx = Math.min(steps - 1, Math.round(currentRatio * (steps - 1)));
          currentRatio = steps > 1 ? snapIdx / (steps - 1) : 0;
          onStepChange(snapIdx);
        }
        positionThumb(currentRatio, false);
      }

      sliderEl.addEventListener("pointerup", endSlide);
      sliderEl.addEventListener("pointercancel", () => {
        isSliding = false;
        sliderEl.classList.remove("is-morphing");
        positionThumb(currentRatio, false);
      });

      return {
        sync(idx) {
          const steps = getStepsCount();
          currentRatio = steps > 1 ? idx / (steps - 1) : 0;
          positionThumb(currentRatio, false);
        }
      };
    }

    const bgSliderCtrl = bindLiquidSlider(
      bgSlider,
      bgSliderThumb,
      bgSliderLabelBase,
      bgSliderLabelLens,
      () => 5,
      (idx) => {
        if (bgPresetIndex !== idx) {
          bgPresetIndex = idx;
          updateMockupBackgroundDOM();
          renderDeviceMockup();
        }
      }
    );

    const frameSliderCtrl = bindLiquidSlider(
      frameSlider,
      frameSliderThumb,
      frameSliderLabelBase,
      frameSliderLabelLens,
      () => frameFinishes.length,
      (idx) => {
        if (frameFinishIndex !== idx) {
          frameFinishIndex = idx;
          renderDeviceMockup();
        }
      }
    );

    saveMockupBtn.addEventListener("click", () => {
      if (!mockupPreviewCanvas.width) return;
      mockupPreviewCanvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `LiquidGlass-Mockup-${currentMockupDevice}-${Date.now()}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
      }, "image/png");
    });

    /* =========================================================
       TAB SWITCHING & APPLE iOS 26 LIQUID GLASS NAVBAR PHYSICS
       ========================================================= */
    function switchTab(tabIndex, options = {}) {
      const clamped = Math.max(0, Math.min(2, tabIndex));
      const prevTab = activeTab;

      if (clamped === 2 && !options.skipCapture && (prevTab === 0 || !capturedRawScene)) {
        triggerFlashEffect();
        captureCurrentExploreScreen();
      }

      activeTab = clamped;
      pillTarget = clamped;

      if (clamped === 0) {
        stopCamera();
        snapView.classList.remove("active");
        mockupView.classList.remove("active");
        stage.classList.remove("is-hidden");
      } else if (clamped === 1) {
        mockupView.classList.remove("active");
        stage.classList.add("is-hidden");
        snapView.classList.add("active");
        startCamera();
      } else if (clamped === 2) {
        stopCamera();
        snapView.classList.remove("active");
        stage.classList.add("is-hidden");
        mockupView.classList.add("active");
        requestAnimationFrame(() => {
          bgSliderCtrl.sync(bgPresetIndex);
          frameSliderCtrl.sync(frameFinishIndex);
        });
      }
    }

    liquidNav.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      pillDragging = true;
      pillPressing = true;
      pillMoved = false;
      pillDragStartX = event.clientX;
      pillDragStartPos = pillPos;
      pillVel = 0;
      try {
        liquidNav.setPointerCapture(event.pointerId);
      } catch (_) {}
    });

    liquidNav.addEventListener("pointermove", (event) => {
      if (!pillDragging) return;
      const rect = liquidNav.getBoundingClientRect();
      const tabWidth = (rect.width - 10) / 3;
      const dx = event.clientX - pillDragStartX;

      if (Math.abs(dx) > 5) {
        pillMoved = true;
      }

      const rawPos = pillDragStartPos + dx / tabWidth;
      if (rawPos < 0) {
        pillPos = rawPos * 0.25;
      } else if (rawPos > 2) {
        pillPos = 2 + (rawPos - 2) * 0.25;
      } else {
        pillPos = rawPos;
      }
    });

    function finishPillDrag(event) {
      if (!pillDragging) return;
      pillDragging = false;
      pillPressing = false;

      const targetTab = (!pillMoved && event && typeof event.clientX === "number")
        ? Math.max(0, Math.min(2, Math.floor(((event.clientX - liquidNav.getBoundingClientRect().left) / liquidNav.getBoundingClientRect().width) * 3)))
        : Math.max(0, Math.min(2, Math.round(pillPos)));

      pillMoved = false;
      switchTab(targetTab);
    }

    liquidNav.addEventListener("pointerup", finishPillDrag);
    liquidNav.addEventListener("pointercancel", () => {
      pillDragging = false;
      pillPressing = false;
      pillMoved = false;
      switchTab(Math.max(0, Math.min(2, Math.round(pillPos))));
    });

    function getDropletScale() {
      const speed = pillDragging ? 0.55 : Math.min(1.4, Math.abs(pillVel) * 0.14);
      const pressBoostX = pillPressing ? 1.12 : 1.0;
      const pressBoostY = pillPressing ? 1.30 : 1.0;
      return {
        scaleX: (1 + speed * 0.10) * pressBoostX,
        scaleY: (1 + speed * 0.04) * pressBoostY
      };
    }

    function updateLiquidPillPhysics(dt) {
      if (!pillDragging) {
        const stiffness = 240;
        const damping = 2 * Math.sqrt(stiffness) * 0.84;
        pillVel += (-stiffness * (pillPos - pillTarget) - damping * pillVel) * dt;
        pillPos += pillVel * dt;

        if (Math.abs(pillTarget - pillPos) < 0.001 && Math.abs(pillVel) < 0.005) {
          pillPos = pillTarget;
          pillVel = 0;
        }
      }

      // Smooth Spring Zoom untuk seluruh Navbar (Tidak Patah-patah!)
      const zoomTarget = pillPressing ? 1.045 : 1.0;
      const zStiff = 260;
      const zDamp = 2 * Math.sqrt(zStiff) * 0.88;
      navZoomVel += (-zStiff * (navZoom - zoomTarget) - zDamp * navZoomVel) * dt;
      navZoom += navZoomVel * dt;
      if (Math.abs(zoomTarget - navZoom) < 0.0005 && Math.abs(navZoomVel) < 0.002) {
        navZoom = zoomTarget;
        navZoomVel = 0;
      }
      liquidNav.style.transform = `scale(${navZoom.toFixed(4)})`;

      const navRect = liquidNav.getBoundingClientRect();
      const unscaledW = (navRect.width || 344) / navZoom;
      const innerW = unscaledW - 10;
      const baseTabW = innerW / 3;
      const translateX = pillPos * baseTabW;

      const { scaleX, scaleY } = getDropletScale();
      activePill.style.transform = `translate3d(${translateX}px, 0, 0) scale(${scaleX.toFixed(4)}, ${scaleY.toFixed(4)})`;
    }

    window.addEventListener("beforeunload", () => {
      stopCamera();
      sessionObjectUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    /* =========================================================
       VIEWPORT & RESIZE (EXACT REPO DIMENSIONS)
       ========================================================= */
    function getFullScreenDimensions() {
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;

      let w = Math.max(window.innerWidth, document.documentElement.clientWidth);
      let h = Math.max(window.innerHeight, document.documentElement.clientHeight);

      if (isStandalone && window.screen) {
        const isPortrait = window.innerHeight >= window.innerWidth;
        const screenH = isPortrait
          ? Math.max(window.screen.height, window.screen.width)
          : Math.min(window.screen.height, window.screen.width);

        h = Math.max(h, screenH);
      }

      return { w, h };
    }

    function resize() {
      const { w, h } = getFullScreenDimensions();
      if (!w || !h) return;

      document.documentElement.style.height = `${h}px`;
      document.body.style.height = `${h}px`;
      app.style.height = `${h}px`;
      stage.style.height = `${h}px`;
      visibleCanvas.style.height = `${h}px`;

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = w;
      height = h;

      const pixelWidth = Math.max(1, Math.round(width * dpr));
      const pixelHeight = Math.max(1, Math.round(height * dpr));

      visibleCanvas.width = pixelWidth;
      visibleCanvas.height = pixelHeight;
      sceneCanvas.width = pixelWidth;
      sceneCanvas.height = pixelHeight;

      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      const aspectRatio = 0.72;
      cardWidth = pixelWidth * (isMobile ? 0.94 : 0.74);
      cardHeight = cardWidth / aspectRatio;

      const maxCardHeight = pixelHeight * (isMobile ? 0.62 : 0.66);
      if (cardHeight > maxCardHeight) {
        cardHeight = maxCardHeight;
        cardWidth = cardHeight * aspectRatio;
      }

      const cardGap = (isMobile ? 250 : 50) * dpr;
      slot = cardHeight + cardGap;

      cardCenterY = pixelHeight * (isMobile ? 0.45 : 0.53);

      buildItemSnapshots();

      if (gl) {
        gl.viewport(0, 0, pixelWidth, pixelHeight);
      }

      resizeGlassCanvas();
    }

    function resizeGlassCanvas() {
      const rect = glassCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const newWidth = Math.max(1, Math.round((rect.width / navZoom) * dpr));
      const newHeight = Math.max(1, Math.round((rect.height / navZoom) * dpr));

      if (glassCanvas.width !== newWidth || glassCanvas.height !== newHeight) {
        glassCanvas.width = newWidth;
        glassCanvas.height = newHeight;
        navOpticsBuffer.width = newWidth;
        navOpticsBuffer.height = newHeight;
        glassImageData = glassCtx.createImageData(newWidth, newHeight);
      }
    }

    /* =========================================================
       DRAW SHARP TAB ICONS & LABELS INTO OPTICAL BUFFER
       (Agar Ikon & Teks Ikut Membelok & Melengkung di Pinggir Lensa!)
       ========================================================= */
    function drawTabVectorIcon(octx, tabIdx, cx, cy, s) {
      octx.beginPath();
      if (tabIdx === 0) {
        // Explore 2x2 Grid
        const box = 7 * s;
        const gap = 3.5 * s;
        const r = 1.8 * s;
        octx.roundRect(cx - box - gap * 0.5, cy - box - gap * 0.5, box, box, r);
        octx.roundRect(cx + gap * 0.5, cy - box - gap * 0.5, box, box, r);
        octx.roundRect(cx + gap * 0.5, cy + gap * 0.5, box, box, r);
        octx.roundRect(cx - box - gap * 0.5, cy + gap * 0.5, box, box, r);
        octx.stroke();
      } else if (tabIdx === 1) {
        // Snap Camera
        const w = 18 * s;
        const h = 13 * s;
        const topY = cy - h * 0.5 + 1.5 * s;
        octx.roundRect(cx - w * 0.5, topY, w, h, 3 * s);
        octx.moveTo(cx - 4.5 * s, topY);
        octx.lineTo(cx - 2.8 * s, topY - 2.6 * s);
        octx.lineTo(cx + 2.8 * s, topY - 2.6 * s);
        octx.lineTo(cx + 4.5 * s, topY);
        octx.stroke();

        octx.beginPath();
        octx.arc(cx, topY + h * 0.52, 3.1 * s, 0, Math.PI * 2);
        octx.stroke();
      } else {
        // Mockup Device
        const w = 13.5 * s;
        const h = 19 * s;
        octx.roundRect(cx - w * 0.5, cy - h * 0.5, w, h, 2.8 * s);
        octx.moveTo(cx - 1.2 * s, cy + h * 0.5 - 3.2 * s);
        octx.lineTo(cx + 1.2 * s, cy + h * 0.5 - 3.2 * s);
        octx.stroke();
      }
    }

    function renderOpticalNavSource(
      sourceLeft,
      sourceTop,
      sourceWidth,
      sourceHeight,
      lensWidth,
      lensHeight,
      padX,
      padY,
      navW,
      navH,
      pillCenterX,
      pillHalfW,
      pillHalfH
    ) {
      // 1. Gambar latar belakang scene di balik navbar
      navOpticsCtx.clearRect(0, 0, lensWidth, lensHeight);
      navOpticsCtx.drawImage(
        sceneCanvas,
        sourceLeft,
        sourceTop,
        sourceWidth,
        sourceHeight,
        0,
        0,
        lensWidth,
        lensHeight
      );

      const insetPx = 5 * dpr;
      const tabW = (navW - insetPx * 2) / 3;
      const labels = ["Explore", "Snap", "Mockup"];
      const iconY = padY + navH * 0.38;
      const textY = padY + navH * 0.75;

      // 2. Gambar Ikon & Teks Putih (Lapisan Luar Lensa)
      navOpticsCtx.save();
      navOpticsCtx.strokeStyle = "rgba(255, 255, 255, 0.94)";
      navOpticsCtx.fillStyle = "rgba(255, 255, 255, 0.94)";
      navOpticsCtx.lineWidth = 1.9 * dpr;
      navOpticsCtx.lineCap = "round";
      navOpticsCtx.lineJoin = "round";
      navOpticsCtx.font = `600 ${Math.round(10.5 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      navOpticsCtx.textAlign = "center";
      navOpticsCtx.textBaseline = "middle";
      navOpticsCtx.shadowColor = "rgba(0, 0, 0, 0.38)";
      navOpticsCtx.shadowBlur = 4 * dpr;

      for (let i = 0; i < 3; i++) {
        const cx = padX + insetPx + (i + 0.5) * tabW;
        drawTabVectorIcon(navOpticsCtx, i, cx, iconY, dpr);
        navOpticsCtx.fillText(labels[i], cx, textY);
      }
      navOpticsCtx.restore();

      // 3. Gambar Ikon & Teks Berwarna Ekstraksi Foto (Material You Accent) di dalam Area Pill
      // Sebelum dibiaskan oleh lensa cembung sehingga warna + huruf ikut melengkung sempurna!
      navOpticsCtx.save();
      drawRoundedRect(
        navOpticsCtx,
        pillCenterX - pillHalfW * 0.86,
        lensHeight * 0.5 - pillHalfH * 0.86,
        pillHalfW * 1.72,
        pillHalfH * 1.72,
        pillHalfH * 0.86
      );
      navOpticsCtx.clip();

      // Redraw clean background inside pill clip so white icon doesn't bleed underneath colored icon
      navOpticsCtx.drawImage(
        sceneCanvas,
        sourceLeft,
        sourceTop,
        sourceWidth,
        sourceHeight,
        0,
        0,
        lensWidth,
        lensHeight
      );

      const accentColor = `rgb(${currentAccentRgb.join(",")})`;
      navOpticsCtx.strokeStyle = accentColor;
      navOpticsCtx.fillStyle = accentColor;
      navOpticsCtx.lineWidth = 2.15 * dpr;
      navOpticsCtx.lineCap = "round";
      navOpticsCtx.lineJoin = "round";
      navOpticsCtx.font = `700 ${Math.round(10.8 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      navOpticsCtx.textAlign = "center";
      navOpticsCtx.textBaseline = "middle";
      navOpticsCtx.shadowColor = "rgba(0, 0, 0, 0.30)";
      navOpticsCtx.shadowBlur = 3 * dpr;

      for (let i = 0; i < 3; i++) {
        const cx = padX + insetPx + (i + 0.5) * tabW;
        drawTabVectorIcon(navOpticsCtx, i, cx, iconY, dpr * 1.04);
        navOpticsCtx.fillText(labels[i], cx, textY);
      }
      navOpticsCtx.restore();
    }

    /* =========================================================
       REAL-TIME OPTICAL REFRACTION + MAGNIFIER LENS (APPLE iOS 26)
       ========================================================= */
    function drawLiquidNavRefraction(now) {
      if (now - lastGlassDraw < 16) return;
      lastGlassDraw = now;

      const rect = glassCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height || !sceneCanvas.width) return;

      resizeGlassCanvas();

      const lensWidth = glassCanvas.width;
      const lensHeight = glassCanvas.height;
      if (!lensWidth || !lensHeight || !glassImageData) return;

      const left = Math.round(rect.left * dpr);
      const top = Math.round(rect.top * dpr);
      const dispW = Math.round(rect.width * dpr);
      const dispH = Math.round(rect.height * dpr);

      const sourceLeft = Math.max(0, Math.min(sceneCanvas.width - 1, left));
      const sourceTop = Math.max(0, Math.min(sceneCanvas.height - 1, top));
      const sourceWidth = Math.max(1, Math.min(sceneCanvas.width - sourceLeft, dispW));
      const sourceHeight = Math.max(1, Math.min(sceneCanvas.height - sourceTop, dispH));

      const padX = 10 * dpr;
      const padY = 18 * dpr;
      const navW = lensWidth - padX * 2;
      const navH = lensHeight - padY * 2;
      const insetPx = 5 * dpr;
      const tabW = (navW - insetPx * 2) / 3;

      const { scaleX, scaleY } = getDropletScale();

      const barHalfW = navW * 0.5;
      const barHalfH = navH * 0.5;
      const barCornerR = barHalfH;
      const barBoxX = barHalfW - barCornerR;
      const barBoxY = 0;

      const pillHalfW = (tabW * scaleX) * 0.5;
      const pillHalfH = ((navH - insetPx * 2) * scaleY) * 0.5;
      const pillCenterX = padX + insetPx + (pillPos + 0.5) * tabW;
      const pillCenterY = lensHeight * 0.5;

      const cornerR = Math.min(pillHalfW, pillHalfH);
      const boxHalfX = pillHalfW - cornerR;
      const boxHalfY = pillHalfH - cornerR;

      // Render Latar + Ikon Putih + Ikon Warna Ekstraksi ke Buffer Optik sebelum pembiasan
      renderOpticalNavSource(
        sourceLeft,
        sourceTop,
        sourceWidth,
        sourceHeight,
        lensWidth,
        lensHeight,
        padX,
        padY,
        navW,
        navH,
        pillCenterX,
        pillHalfW,
        pillHalfH
      );

      let source;
      try {
        source = navOpticsCtx.getImageData(0, 0, lensWidth, lensHeight).data;
      } catch (error) {
        glassCtx.clearRect(0, 0, lensWidth, lensHeight);
        return;
      }

      const output = glassImageData.data;

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function readChannel(x, y, channel) {
        const sx = Math.max(0, Math.min(lensWidth - 1, x));
        const sy = Math.max(0, Math.min(lensHeight - 1, y));
        return source[(sy * lensWidth + sx) * 4 + channel];
      }

      for (let y = 0; y < lensHeight; y++) {
        const dyBar = y - pillCenterY;
        const qyBar = Math.abs(dyBar) - barBoxY;

        const dyPill = y - pillCenterY;
        const qyPill = Math.abs(dyPill) - boxHalfY;

        for (let x = 0; x < lensWidth; x++) {
          const outIndex = (y * lensWidth + x) * 4;

          const dxBar = x - lensWidth * 0.5;
          const qxBar = Math.abs(dxBar) - barBoxX;
          const oxBar = Math.max(qxBar, 0);
          const oyBar = Math.max(qyBar, 0);
          const sdfBar = Math.sqrt(oxBar * oxBar + oyBar * oyBar) + Math.min(Math.max(qxBar, qyBar), 0) - barCornerR;

          const dxPill = x - pillCenterX;
          const qxPill = Math.abs(dxPill) - boxHalfX;
          const oxPill = Math.max(qxPill, 0);
          const oyPill = Math.max(qyPill, 0);
          const sdfPill = Math.sqrt(oxPill * oxPill + oyPill * oyPill) + Math.min(Math.max(qxPill, qyPill), 0) - cornerR;

          const unionSdf = Math.min(sdfBar, sdfPill);
          if (unionSdf > 1.5 * dpr) {
            output[outIndex + 3] = 0;
            continue;
          }

          const alphaMask = 1.0 - smoothstep(-1.0 * dpr, 1.5 * dpr, unionSdf);

          const barDepth = Math.max(0, Math.min(1, -sdfBar / barCornerR));
          const barRim = Math.pow(1.0 - barDepth, 2.5);
          const nxBar = dxBar / barHalfW;
          const nyBar = dyBar / barHalfH;

          let shiftX = nxBar * barRim * 16 * dpr;
          let shiftY = nyBar * barRim * 14 * dpr;
          let dispX = nxBar * barRim * 2.5 * dpr;
          let dispY = nyBar * barRim * 2.5 * dpr;

          // Lensa Cembung Pill: Membelokkan Ikon, Huruf & Latar secara Organik seperti Gambar 1
          if (sdfPill <= 1.5 * dpr) {
            const normDepth = Math.max(0, Math.min(1, -sdfPill / cornerR));
            // Profil tepi kaca cembung tebal hanya di rim luar (22% tepi), tengah jernih & sedikit zoom
            const edgeRim = Math.pow(1.0 - normDepth, 2.8);
            const centerZoom = smoothstep(0.15, 0.85, normDepth);

            const nx = dxPill / pillHalfW;
            const ny = dyPill / pillHalfH;

            // Tepi menarik & melengkungkan ikon ke dalam rim, tengah memperbesar halus (1.12x)
            shiftX = nx * (edgeRim * 28 * dpr - centerZoom * 7.5 * dpr);
            shiftY = ny * (edgeRim * 22 * dpr - centerZoom * 5.5 * dpr);

            // Dispersi RGB alami tepat di lengkungan rim kaca (persis Gambar 1)
            dispX = nx * edgeRim * 5.2 * dpr;
            dispY = ny * edgeRim * 4.2 * dpr;
          }

          const baseX = x + shiftX;
          const baseY = y + shiftY;

          const rVal = readChannel(Math.round(baseX + dispX), Math.round(baseY + dispY), 0);
          const gVal = readChannel(Math.round(baseX), Math.round(baseY), 1);
          const bVal = readChannel(Math.round(baseX - dispX), Math.round(baseY - dispY), 2);

          output[outIndex] = rVal;
          output[outIndex + 1] = gVal;
          output[outIndex + 2] = bVal;
          output[outIndex + 3] = Math.round(alphaMask * 255);
        }
      }

      glassCtx.putImageData(glassImageData, 0, 0);
    }

    function getOffset(index) {
      const count = items.length;
      let offset = index - scroll;
      offset = ((offset + count / 2) % count + count) % count - count / 2;
      return offset;
    }

    function drawScene() {
      const pixelWidth = sceneCanvas.width;
      const pixelHeight = sceneCanvas.height;

      const background = ctx.createLinearGradient(0, 0, pixelWidth, pixelHeight);
      background.addColorStop(0, "#1d2d3b");
      background.addColorStop(0.52, "#182838");
      background.addColorStop(1, "#07121e");
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      const activeIndex = wrapIndex(Math.round(scroll));

      if (activeIndex !== lastAppliedPaletteIndex && itemPalettes[activeIndex]) {
        lastAppliedPaletteIndex = activeIndex;
        applyNavMaterialYouPalette(itemPalettes[activeIndex]);
      }

      const activeBackdrop = backdropSnapshots[activeIndex];

      if (activeBackdrop) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.drawImage(activeBackdrop, 0, 0, pixelWidth, pixelHeight);
        ctx.restore();

        ctx.fillStyle = "rgba(5, 14, 22, 0.22)";
        ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      }

      const centerX = pixelWidth / 2;
      const centerY = cardCenterY;

      const visibleItems = items
        .map((item, index) => ({ index, offset: getOffset(index) }))
        .filter(({ offset }) => Math.abs(offset) <= 2.6)
        .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

      visibleItems.forEach(({ index, offset }) => {
        const distance = Math.abs(offset);
        const scale = 1 - Math.min(distance, 1) * 0.08;
        const w = cardWidth * scale;
        const h = cardHeight * scale;
        const x = centerX - w / 2;
        const y = centerY + offset * slot - h / 2;
        const snapshot = itemSnapshots[index];

        if (!snapshot) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0.55, 1 - distance * 0.14);

        ctx.shadowColor = "rgba(0, 0, 0, 0.36)";
        ctx.shadowBlur = 26 * dpr;
        ctx.shadowOffsetY = 10 * dpr;

        ctx.drawImage(snapshot, x, y, w, h);

        ctx.restore();
      });

      counter.textContent = `${activeIndex + 1} / ${items.length}`;
    }

    function uploadSceneTexture() {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        sceneCanvas
      );
    }

    function renderWebGLScene(now) {
      drawScene();
      if (activeTab === 0) {
        drawLiquidNavRefraction(now);
      }
      uploadSceneTexture();

      gl.useProgram(program);
      gl.uniform1i(uniforms.scene, 0);
      gl.uniform2f(
        uniforms.resolution,
        visibleCanvas.width,
        visibleCanvas.height
      );
      gl.uniform2f(
        uniforms.cardCenter,
        0.5,
        1.0 - cardCenterY / visibleCanvas.height
      );
      gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
      gl.uniform1f(uniforms.time, now / 1000);

      gl.clearColor(11 / 255, 24 / 255, 36 / 255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function renderFrame(time) {
      const now = time || performance.now();

      if (!previousFrameTime) previousFrameTime = now;
      const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
      previousFrameTime = now;

      if (!dragging) {
        const stiffness = 170;
        const damping = 2 * Math.sqrt(stiffness) * 0.92;

        velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
        scroll += velocity * dt;

        if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
          scroll = target;
          velocity = 0;
        }
      }

      updateLiquidPillPhysics(dt);

      if (activeTab === 0) {
        renderWebGLScene(now);
      }

      requestAnimationFrame(renderFrame);
    }

    function moveBy(direction) {
      target = Math.round(scroll) + direction;
      velocity = 0;
    }

    stage.addEventListener("pointerdown", (event) => {
      if (activeTab !== 0) return;
      if (event.button !== undefined && event.button !== 0) return;

      dragging = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);

      dragStartY = event.clientY;
      dragStartScroll = scroll;
      lastPointerY = event.clientY;
      lastPointerTime = performance.now();
      pointerVelocity = 0;
      velocity = 0;
      target = scroll;
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const now = performance.now();
      const elapsed = Math.max(1, now - lastPointerTime);
      const dy = event.clientY - dragStartY;

      scroll = dragStartScroll - (dy * dpr) / slot;
      target = scroll;

      pointerVelocity =
        (-(event.clientY - lastPointerY) * dpr / slot) /
        (elapsed / 1000);

      lastPointerY = event.clientY;
      lastPointerTime = now;
    });

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      stage.classList.remove("dragging");

      const projected = scroll + pointerVelocity * 0.16;
      target = Math.round(projected);

      if (Math.abs(pointerVelocity) > 1.1) {
        target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
      }

      velocity = pointerVelocity;
    }

    stage.addEventListener("pointerup", finishDrag);
    stage.addEventListener("pointercancel", finishDrag);

    stage.addEventListener("wheel", (event) => {
      if (activeTab !== 0) return;
      event.preventDefault();

      const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
        ? event.deltaY
        : event.deltaX;

      if (!delta) return;

      wheelDelta += delta;
      window.clearTimeout(wheelTimer);

      wheelTimer = window.setTimeout(() => {
        const direction = Math.sign(wheelDelta);
        const steps = Math.min(
          items.length,
          Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
        );

        if (direction) {
          target = Math.round(scroll) + direction * steps;
          velocity = 0;
        }

        wheelDelta = 0;
      }, 100);
    }, { passive: false });

    document.addEventListener("keydown", (event) => {
      if (activeTab !== 0) return;
      if (event.key === "ArrowDown") moveBy(1);
      if (event.key === "ArrowUp") moveBy(-1);
    });

    async function init() {
      gl = visibleCanvas.getContext("webgl2", {
        alpha: false,
        antialias: true,
        preserveDrawingBuffer: true
      });

      if (!gl) {
        stage.innerHTML =
          "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
        return;
      }

      try {
        images = await Promise.all(items.map((item) => loadImage(item.image)));

        program = createProgram();
        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());

        sceneTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        uniforms = {
          scene: gl.getUniformLocation(program, "uScene"),
          resolution: gl.getUniformLocation(program, "uResolution"),
          cardCenter: gl.getUniformLocation(program, "uCardCenter"),
          cardSize: gl.getUniformLocation(program, "uCardSize"),
          time: gl.getUniformLocation(program, "uTime")
        };

        resize();
        setTimeout(resize, 100);
        setTimeout(resize, 400);
        requestAnimationFrame(renderFrame);
      } catch (error) {
        console.error(error);
        stage.innerHTML =
          "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
      }
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    window.visualViewport?.addEventListener("resize", resize);

    init();
  </script>
</body>
</html>
