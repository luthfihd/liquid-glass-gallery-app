<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1824">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiquidGlass Gallery">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href='data:application/manifest+json,{"name":"LiquidGlass%20Gallery","short_name":"Gallery","display":"fullscreen","background_color":"%230b1824","theme_color":"%230b1824"}'>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>LiquidGlass Gallery</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1824;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100lvh;
      background-color: #0b1824;
      color: #f3f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100lvh;
      overflow: hidden;
      background: #0b1824;
    }

    /* VIEW 1: EXPLORE (GALLERY UTAMA) */
    .stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      transition: opacity 0.32s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .stage.dragging {
      cursor: grabbing;
    }

    .stage.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    #gl {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* VIEW 2: SNAP (KAMERA MINIMALIS) */
    .snap-view {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: #050a10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px) scale(0.98);
      transition: opacity 0.3s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .snap-view.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    #cameraVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #08111a;
    }

    #cameraVideo.mirrored {
      transform: scaleX(-1);
    }

    .camera-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 32px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.92rem;
      line-height: 1.5;
      background: radial-gradient(circle at center, #162636 0%, #070e16 100%);
    }

    .camera-fallback.visible {
      display: grid;
    }

    .snap-top {
      position: relative;
      z-index: 2;
      padding: max(18px, calc(12px + env(safe-area-inset-top, 0px))) 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .glass-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: rgba(20, 28, 38, 0.38);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      backdrop-filter: blur(16px) saturate(1.4);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .glass-circle-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.22);
    }

    .snap-controls {
      position: relative;
      z-index: 2;
      padding: 20px 28px max(116px, calc(104px + env(safe-area-inset-bottom, 0px)));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: linear-gradient(to top, rgba(4, 9, 15, 0.72) 0%, rgba(4, 9, 15, 0) 100%);
    }

    .snap-gallery-wrap {
      justify-self: start;
    }

    .photo-pick-btn {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.48);
      background: rgba(255, 255, 255, 0.14);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      backdrop-filter: blur(16px) saturate(1.4);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.16s ease;
    }

    .photo-pick-btn:active {
      transform: scale(0.92);
    }

    .shot-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 3.5px solid rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      padding: 5px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .shot-btn-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .shot-btn:active {
      transform: scale(0.92);
    }

    .shot-btn:active .shot-btn-inner {
      transform: scale(0.88);
      background: #e2ecff;
    }

    /* VIEW 3: MOCKUP STUDIO */
    .mockup-view {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(16px, calc(10px + env(safe-area-inset-top, 0px))) 18px max(106px, calc(96px + env(safe-area-inset-bottom, 0px)));
      background: #0c1722;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.03);
      transition: opacity 0.32s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .mockup-view.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .mockup-bg {
      position: absolute;
      inset: -24px;
      background-size: cover;
      background-position: center;
      filter: blur(36px) saturate(1.25) brightness(0.62);
      z-index: 0;
      transition: background-image 0.35s ease;
    }

    .mockup-top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .device-switch {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(15, 24, 34, 0.42);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      backdrop-filter: blur(16px) saturate(1.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .device-chip {
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.68);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .device-chip.active {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .save-mockup-btn {
      border: 1px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      backdrop-filter: blur(16px) saturate(1.4);
      color: #fff;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .save-mockup-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.28);
    }

    .mockup-stage {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 8px 0;
      min-height: 0;
    }

    #mockupPreviewCanvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 24px 42px rgba(0, 0, 0, 0.52));
    }

    /* CAPTURE FLASH OVERLAY */
    .capture-flash {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
    }

    .capture-flash.flash-anim {
      animation: shutterFlash 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes shutterFlash {
      0% { opacity: 0.88; }
      100% { opacity: 0; }
    }

    /* =========================================================
       FLOATING 3-TAB LIQUID GLASS NAVIGATION BAR
       Multi-layer optical refraction + specular rim + squish pill
       ========================================================= */
    .nav-dock-wrap {
      position: fixed;
      z-index: 10;
      bottom: max(16px, calc(10px + env(safe-area-inset-bottom, 0px)));
      left: 50%;
      transform: translateX(-50%);
      width: min(356px, calc(100vw - 28px));
      height: 70px;
      pointer-events: auto;
    }

    .liquid-nav {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      touch-action: none;
      user-select: none;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.06) 55%,
        rgba(255, 255, 255, 0.12) 100%
      );
      -webkit-backdrop-filter: blur(18px) saturate(1.45);
      backdrop-filter: blur(18px) saturate(1.45);
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.32),
        0 2px 8px rgba(0, 0, 0, 0.18),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.55),
        inset 0 -1.5px 2px rgba(255, 255, 255, 0.16);
    }

    /* Layer 1: Real-time pixel edge refraction & chromatic dispersion canvas */
    #glassLens {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      opacity: 0.78;
      pointer-events: none;
    }

    /* Layer 2: Specular Fresnel rim highlight */
    .liquid-nav::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.12) 40%,
        rgba(170, 220, 255, 0.18) 70%,
        rgba(255, 255, 255, 0.55) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 3;
    }

    /* Layer 3: Morphing / Sliding Active Liquid Glass Pill */
    .active-pill {
      position: absolute;
      z-index: 1;
      top: 6px;
      left: 6px;
      width: calc((100% - 12px) / 3);
      height: calc(100% - 12px);
      border-radius: 999px;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform;
      background: radial-gradient(
        120% 100% at 50% 0%,
        rgba(255, 255, 255, 0.36) 0%,
        rgba(255, 255, 255, 0.14) 55%,
        rgba(255, 255, 255, 0.22) 100%
      );
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.82),
        inset 0 -1px 1.5px rgba(255, 255, 255, 0.26),
        inset 2px 0 3px rgba(130, 210, 255, 0.22),
        inset -2px 0 3px rgba(255, 190, 210, 0.20);
    }

    /* Layer 4: Tab Items */
    .nav-item {
      position: relative;
      z-index: 2;
      height: 100%;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.66);
      font: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px 2px;
      cursor: pointer;
      transition: color 0.22s ease, transform 0.18s ease;
    }

    .nav-item svg {
      width: 21px;
      height: 21px;
      stroke-width: 2;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-item span {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .nav-item.active {
      color: #ffffff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.28);
    }

    .nav-item.active svg {
      transform: translateY(-1px) scale(1.06);
    }

    #photoInput,
    #counter {
      display: none;
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <!-- 1. EXPLORE VIEW (GALLERY UTAMA) -->
    <section class="stage" id="stage" aria-label="Galeri foto vertikal">
      <canvas id="gl"></canvas>
    </section>

    <!-- 2. SNAP VIEW (HALAMAN KAMERA & GALERI) -->
    <section class="snap-view" id="snapView" aria-label="Kamera dan tambah foto">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="camera-fallback" id="cameraFallback">
        <div>
          <p style="margin:0 0 6px;font-weight:600;color:#fff;">Kamera tidak tersedia</p>
          <p style="margin:0;">Ketuk ikon galeri di kiri bawah untuk memilih foto dari perangkatmu.</p>
        </div>
      </div>

      <div class="snap-top">
        <button class="glass-circle-btn" id="closeSnapBtn" type="button" aria-label="Kembali ke Explore">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>

        <button class="glass-circle-btn" id="flipCameraBtn" type="button" aria-label="Balik kamera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
        </button>
      </div>

      <div class="snap-controls">
        <div class="snap-gallery-wrap">
          <button class="photo-pick-btn" id="photoPickBtn" type="button" aria-label="Pilih foto dari galeri">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="3" ry="3"/>
              <circle cx="9" cy="9" r="2"/>
              <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
          </button>
        </div>

        <button class="shot-btn" id="shotBtn" type="button" aria-label="Ambil foto">
          <span class="shot-btn-inner"></span>
        </button>

        <div></div>
      </div>
    </section>

    <!-- 3. MOCKUP STUDIO VIEW -->
    <section class="mockup-view" id="mockupView" aria-label="Pratinjau Mockup Perangkat">
      <div class="mockup-bg" id="mockupBg"></div>

      <div class="mockup-top-bar">
        <div class="device-switch" role="group" aria-label="Pilih frame perangkat">
          <button class="device-chip" id="chipIphone" type="button" data-device="iphone">iPhone</button>
          <button class="device-chip" id="chipAndroid" type="button" data-device="android">Android</button>
        </div>

        <button class="save-mockup-btn" id="saveMockupBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" x2="12" y1="15" y2="3"/>
          </svg>
          <span>Simpan</span>
        </button>
      </div>

      <div class="mockup-stage">
        <canvas id="mockupPreviewCanvas"></canvas>
      </div>
    </section>

    <div class="capture-flash" id="captureFlash"></div>

    <!-- FLOATING 3-TAB LIQUID GLASS BAR -->
    <div class="nav-dock-wrap">
      <nav class="liquid-nav" id="liquidNav" aria-label="Navigasi utama">
        <canvas id="glassLens" aria-hidden="true"></canvas>
        <div class="active-pill" id="activePill"></div>

        <button class="nav-item active" type="button" data-tab="0" aria-label="Explore">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="7" x="3" y="3" rx="1.5"/>
            <rect width="7" height="7" x="14" y="3" rx="1.5"/>
            <rect width="7" height="7" x="14" y="14" rx="1.5"/>
            <rect width="7" height="7" x="3" y="14" rx="1.5"/>
          </svg>
          <span>Explore</span>
        </button>

        <button class="nav-item" type="button" data-tab="1" aria-label="Snap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          <span>Snap</span>
        </button>

        <button class="nav-item" type="button" data-tab="2" aria-label="Mockup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="20" x="5" y="2" rx="2.5" ry="2.5"/>
            <path d="M12 18h.01"/>
          </svg>
          <span>Mockup</span>
        </button>
      </nav>
    </div>

    <input type="file" id="photoInput" accept="image/*" multiple>
    <span id="counter" aria-live="polite">1 / 5</span>
  </main>

  <script>
    const items = [
      {
        image: "https://images.unsplash.com/photo-1793605300952-49cbebdc3d49?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://images.unsplash.com/photo-1793363562541-f27fa7e52688?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://images.unsplash.com/photo-1793443196021-12939c7dac83?q=80&w=1365&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://plus.unsplash.com/premium_photo-1792411651238-b1ad8610446b?q=80&w=1285&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://plus.unsplash.com/premium_photo-1792949574922-fc83c916d106?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      }
    ];

    const app = document.getElementById("app");
    const stage = document.getElementById("stage");
    const visibleCanvas = document.getElementById("gl");
    const counter = document.getElementById("counter");

    // Navigation elements
    const liquidNav = document.getElementById("liquidNav");
    const glassCanvas = document.getElementById("glassLens");
    const activePill = document.getElementById("activePill");
    const navButtons = Array.from(document.querySelectorAll(".nav-item"));
    const captureFlash = document.getElementById("captureFlash");

    // Snap elements
    const snapView = document.getElementById("snapView");
    const cameraVideo = document.getElementById("cameraVideo");
    const cameraFallback = document.getElementById("cameraFallback");
    const closeSnapBtn = document.getElementById("closeSnapBtn");
    const flipCameraBtn = document.getElementById("flipCameraBtn");
    const photoPickBtn = document.getElementById("photoPickBtn");
    const shotBtn = document.getElementById("shotBtn");
    const photoInput = document.getElementById("photoInput");

    // Mockup elements
    const mockupView = document.getElementById("mockupView");
    const mockupBg = document.getElementById("mockupBg");
    const mockupPreviewCanvas = document.getElementById("mockupPreviewCanvas");
    const chipIphone = document.getElementById("chipIphone");
    const chipAndroid = document.getElementById("chipAndroid");
    const saveMockupBtn = document.getElementById("saveMockupBtn");

    const sceneCanvas = document.createElement("canvas");
    const ctx = sceneCanvas.getContext("2d");
    const glassCtx = glassCanvas.getContext("2d", { willReadFrequently: true });

    let gl;
    let program;
    let sceneTexture;
    let uniforms;
    let images = [];
    let itemSnapshots = [];
    let backdropSnapshots = [];
    const sessionObjectUrls = [];

    let width = 0;
    let height = 0;
    let dpr = 1;

    let cardWidth = 0;
    let cardHeight = 0;
    let slot = 0;
    let cardCenterY = 0;

    let scroll = 0;
    let target = 0;
    let velocity = 0;
    let dragging = false;

    let dragStartY = 0;
    let dragStartScroll = 0;
    let lastPointerY = 0;
    let lastPointerTime = 0;
    let pointerVelocity = 0;
    let previousFrameTime = 0;

    let wheelDelta = 0;
    let wheelTimer = 0;
    let lastGlassDraw = 0;
    let glassImageData = null;

    // Navigation & Pill Spring Physics
    let activeTab = 0; // 0: Explore, 1: Snap, 2: Mockup
    let pillPos = 0;
    let pillTarget = 0;
    let pillVel = 0;
    let pillDragging = false;

    let pillDragStartPos = 0;

    // Camera state

    // Mockup state
    let detectedDevice = /Android/i.test(navigator.userAgent) ? "android" : "iphone";
    let currentMockupDevice = detectedDevice;
    let capturedGalleryImage = null;

    const wrapIndex = (index) =>
      ((index % items.length) + items.length) % items.length;

    const vertexSource = `#version 300 es
      precision highp float;

      void main() {
        vec2 point = vec2(
          float((gl_VertexID << 1) & 2),
          float(gl_VertexID & 2)
        );
        gl_Position = vec4(point * 2.0 - 1.0, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      out vec4 outColor;

      uniform sampler2D uScene;
      uniform vec2 uResolution;
      uniform vec2 uCardCenter;
      uniform vec2 uCardSize;
      uniform float uTime;

      float roundedBoxDistance(vec2 point, vec2 halfSize, float radius) {
        vec2 q = abs(point) - halfSize + radius;
        return length(max(q, 0.0))
          + min(max(q.x, q.y), 0.0)
          - radius;
      }

      vec4 sampleScene(vec2 uv) {
        return texture(uScene, clamp(uv, 0.002, 0.998));
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        float aspect = uResolution.x / uResolution.y;

        vec2 offset = uv - uCardCenter;
        vec2 p = vec2(offset.x * aspect, offset.y);

        vec2 clearHalfSize = vec2(
          (uCardSize.x * 0.56) / uResolution.y,
          (uCardSize.y * 0.52) / uResolution.y
        );
        float cornerRadius = (uCardSize.x * 0.24) / uResolution.y;

        float clearDistance = roundedBoxDistance(p, clearHalfSize, cornerRadius);

        vec4 original = sampleScene(uv);
        if (clearDistance <= 0.0) {
          outColor = original;
          return;
        }

        float field = smoothstep(0.0, 0.16, clearDistance);

        float vertMask = smoothstep(
          clearHalfSize.y * 0.55,
          clearHalfSize.y * 1.05,
          abs(p.y)
        );
        field *= vertMask;

        float edgeGuard = smoothstep(0.0, 0.045, uv.y) * smoothstep(0.0, 0.045, 1.0 - uv.y);
        field *= edgeGuard;

        if (field <= 0.0005) {
          outColor = original;
          return;
        }

        float angle = atan(p.y, p.x);
        float fluidWave =
          sin(angle * 2.0 + uTime * 0.55) * 0.45 +
          sin(angle * 3.0 - uTime * 0.35) * 0.25;

        vec2 radialDir = normalize(offset + vec2(0.00001));
        vec2 tangentDir = vec2(-radialDir.y, radialDir.x);

        vec2 shift =
          offset * 0.24 * field +
          tangentDir * fluidWave * field * field * 0.008;

        vec2 spread = shift * 0.14;
        vec2 redUv = uv + shift + spread;
        vec2 greenUv = uv + shift;
        vec2 blueUv = uv + shift - spread;

        vec4 refracted;
        refracted.r = sampleScene(redUv).r;
        refracted.g = sampleScene(greenUv).g;
        refracted.b = sampleScene(blueUv).b;
        refracted.a = 1.0;

        float rim = exp(-abs(clearDistance * uResolution.y) / 3.0) * vertMask;
        refracted.rgb += vec3(0.08, 0.10, 0.13) * rim * field;

        outColor = refracted;
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || "Shader gagal dikompilasi.");
      }

      return shader;
    }

    function createProgram() {
      const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      const result = gl.createProgram();

      gl.attachShader(result, vertex);
      gl.attachShader(result, fragment);
      gl.linkProgram(result);

      if (!gl.getProgramParameter(result, gl.LINK_STATUS)) {
        throw new Error(
          gl.getProgramInfoLog(result) || "Program WebGL gagal dibuat."
        );
      }

      return result;
    }

    function loadImage(url, isBlob = false) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        if (!isBlob) {
          image.crossOrigin = "anonymous";
        }
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Gagal memuat gambar: ${url}`));
        image.src = url;
      });
    }

    function drawRoundedRect(context, x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);

      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + w, y, x + w, y + h, r);
      context.arcTo(x + w, y + h, x, y + h, r);
      context.arcTo(x, y + h, x, y, r);
      context.arcTo(x, y, x + w, y, r);
      context.closePath();
    }

    function drawImageToContext(context, image, x, y, w, h) {
      const imageAspect = image.width / image.height;
      const boxAspect = w / h;

      let sx = 0;
      let sy = 0;
      let sw = image.width;
      let sh = image.height;

      if (imageAspect > boxAspect) {
        sw = image.height * boxAspect;
        sx = (image.width - sw) / 2;
      } else {
        sh = image.width / boxAspect;
        sy = (image.height - sh) / 2;
      }

      context.drawImage(image, sx, sy, sw, sh, x, y, w, h);
    }

    function createBlurredCanvas(image, targetW, targetH, passes = 5) {
      const smallW = Math.max(16, Math.round(targetW / 18));
      const smallH = Math.max(16, Math.round(targetH / 18));

      const tempA = document.createElement("canvas");
      tempA.width = smallW;
      tempA.height = smallH;
      const ctxA = tempA.getContext("2d");
      ctxA.imageSmoothingEnabled = true;
      ctxA.imageSmoothingQuality = "high";
      drawImageToContext(ctxA, image, 0, 0, smallW, smallH);

      const tempB = document.createElement("canvas");
      tempB.width = Math.max(12, Math.round(smallW * 0.65));
      tempB.height = Math.max(12, Math.round(smallH * 0.65));
      const ctxB = tempB.getContext("2d");
      ctxB.imageSmoothingEnabled = true;
      ctxB.imageSmoothingQuality = "high";

      for (let i = 0; i < passes; i++) {
        ctxB.clearRect(0, 0, tempB.width, tempB.height);
        ctxB.drawImage(tempA, 0, 0, tempB.width, tempB.height);
        ctxA.clearRect(0, 0, tempA.width, tempA.height);
        ctxA.drawImage(tempB, 0, 0, tempA.width, tempA.height);
      }

      const out = document.createElement("canvas");
      out.width = targetW;
      out.height = targetH;
      const outCtx = out.getContext("2d");
      outCtx.imageSmoothingEnabled = true;
      outCtx.imageSmoothingQuality = "high";
      outCtx.drawImage(tempA, 0, 0, targetW, targetH);

      return out;
    }

    function createSnapshotForImage(image) {
      const w = Math.max(1, Math.round(cardWidth));
      const h = Math.max(1, Math.round(cardHeight));
      const radius = 35 * dpr;

      const snap = document.createElement("canvas");
      snap.width = w;
      snap.height = h;
      const sctx = snap.getContext("2d");

      sctx.save();
      drawRoundedRect(sctx, 0, 0, w, h, radius);
      sctx.clip();

      drawImageToContext(sctx, image, 0, 0, w, h);

      const shade = sctx.createLinearGradient(0, h * 0.60, 0, h);
      shade.addColorStop(0, "rgba(0, 0, 0, 0)");
      shade.addColorStop(1, "rgba(0, 0, 0, 0.18)");
      sctx.fillStyle = shade;
      sctx.fillRect(0, 0, w, h);

      sctx.restore();

      return snap;
    }

    function createBackdropForImage(image) {
      const w = Math.max(1, Math.round(sceneCanvas.width / 2));
      const h = Math.max(1, Math.round(sceneCanvas.height / 2));
      return createBlurredCanvas(image, w, h, 5);
    }

    function buildItemSnapshots() {
      if (!images.length || !cardWidth || !cardHeight) return;
      itemSnapshots = images.map((image) => createSnapshotForImage(image));
      backdropSnapshots = images.map((image) => createBackdropForImage(image));
    }

    /* =========================================================
       HELPER: TAMBAH FOTO BARU & KEMBALI KE EXPLORE
       ========================================================= */
    async function addNewPhotosAndFocus(sources) {
      if (!sources.length) return;
      const firstNewIndex = items.length;

      for (const src of sources) {
        try {
          const loadedImg = await loadImage(src, true);
          items.push({ image: src, isSession: true });
          images.push(loadedImg);
          itemSnapshots.push(createSnapshotForImage(loadedImg));
          backdropSnapshots.push(createBackdropForImage(loadedImg));
        } catch (err) {
          console.error("Gagal memuat foto baru:", err);
        }
      }

      switchTab(0, { skipCapture: true });

      if (items.length > firstNewIndex) {
        const currentRound = Math.round(scroll);
        const currentWrapped = wrapIndex(currentRound);
        let diff = firstNewIndex - currentWrapped;
        if (diff <= 0) diff += items.length;
        target = currentRound + diff;
      }
    }

    /* =========================================================
       CAMERA & SNAP VIEW LOGIC
       ========================================================= */
    async function startCamera() {
      cameraFallback.classList.remove("visible");
      stopCamera();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        cameraFallback.classList.add("visible");
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.classList.toggle("mirrored", facingMode === "user");
      } catch (err) {
        console.warn("Akses kamera tidak tersedia:", err);
        cameraFallback.classList.add("visible");
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
      cameraVideo.srcObject = null;
    }

    closeSnapBtn.addEventListener("click", () => {
      switchTab(0, { skipCapture: true });
    });

    flipCameraBtn.addEventListener("click", () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    photoPickBtn.addEventListener("click", () => {
      photoInput.click();
    });

    photoInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []).filter((file) =>
        file.type.startsWith("image/")
      );
      photoInput.value = "";
      if (!files.length) return;

      const urls = files.map((file) => {
        const url = URL.createObjectURL(file);
        sessionObjectUrls.push(url);
        return url;
      });

      await addNewPhotosAndFocus(urls);
    });

    shotBtn.addEventListener("click", () => {
      if (!cameraStream || !cameraVideo.videoWidth || !cameraVideo.videoHeight) {
        photoInput.click();
        return;
      }

      triggerFlashEffect();

      const snapCanvas = document.createElement("canvas");
      snapCanvas.width = cameraVideo.videoWidth;
      snapCanvas.height = cameraVideo.videoHeight;
      const sctx = snapCanvas.getContext("2d");

      if (facingMode === "user") {
        sctx.translate(snapCanvas.width, 0);
        sctx.scale(-1, 1);
      }
      sctx.drawImage(cameraVideo, 0, 0, snapCanvas.width, snapCanvas.height);

      snapCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        sessionObjectUrls.push(url);
        await addNewPhotosAndFocus([url]);
      }, "image/jpeg", 0.94);
    });

    /* =========================================================
       MOCKUP CAPTURE & COMPOSITOR (STATUS BAR + DEVICE FRAME)
       ========================================================= */
    function triggerFlashEffect() {
      captureFlash.classList.remove("flash-anim");
      void captureFlash.offsetWidth;
      captureFlash.classList.add("flash-anim");
      if (navigator.vibrate) {
        navigator.vibrate(18);
      }
    }

    function captureCurrentExploreScreen() {
      // Pastikan frame WebGL terbaru ter-render ke visibleCanvas sebelum diambil
      renderWebGLScene(performance.now());

      const w = visibleCanvas.width;
      const h = visibleCanvas.height;
      const shot = document.createElement("canvas");
      shot.width = w;
      shot.height = h;
      const sctx = shot.getContext("2d");

      // 1. Gambar penuh scene WebGL (backdrop blur + kartu aktif + efek lensa)
      sctx.drawImage(visibleCanvas, 0, 0, w, h);

      // 2. Gambar mini floating navigation pill di bagian bawah layar SS
      const pillW = Math.min(w * 0.84, 340 * dpr);
      const pillH = 54 * dpr;
      const pillX = (w - pillW) / 2;
      const pillY = h - pillH - 22 * dpr;

      sctx.save();
      drawRoundedRect(sctx, pillX, pillY, pillW, pillH, pillH / 2);
      sctx.fillStyle = "rgba(255, 255, 255, 0.16)";
      sctx.fill();
      sctx.lineWidth = 1.2 * dpr;
      sctx.strokeStyle = "rgba(255, 255, 255, 0.36)";
      sctx.stroke();

      // Active capsule di Explore
      const tabW = (pillW - 10 * dpr) / 3;
      drawRoundedRect(sctx, pillX + 5 * dpr, pillY + 5 * dpr, tabW, pillH - 10 * dpr, (pillH - 10 * dpr) / 2);
      sctx.fillStyle = "rgba(255, 255, 255, 0.24)";
      sctx.fill();

      const labels = ["Explore", "Snap", "Mockup"];
      sctx.font = `600 ${11 * dpr}px -apple-system, system-ui, sans-serif`;
      sctx.textAlign = "center";
      sctx.textBaseline = "middle";
      labels.forEach((label, idx) => {
        sctx.fillStyle = idx === 0 ? "#ffffff" : "rgba(255, 255, 255, 0.65)";
        sctx.fillText(label, pillX + 5 * dpr + tabW * (idx + 0.5), pillY + pillH * 0.52);
      });
      sctx.restore();

      capturedGalleryImage = shot;

      const activeIndex = wrapIndex(Math.round(scroll));
      if (items[activeIndex]) {
        mockupBg.style.backgroundImage = `url("${items[activeIndex].image}")`;
      }

      renderDeviceMockup();
    }

    function formatCurrentTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    function renderDeviceMockup() {
      if (!capturedGalleryImage) return;

      chipIphone.classList.toggle("active", currentMockupDevice === "iphone");
      chipAndroid.classList.toggle("active", currentMockupDevice === "android");

      // Ukuran kanvas ekspor resolusi tinggi (1200 x 2400)
      const outW = 1200;
      const outH = 2400;
      mockupPreviewCanvas.width = outW;
      mockupPreviewCanvas.height = outH;
      const mctx = mockupPreviewCanvas.getContext("2d");
      mctx.clearRect(0, 0, outW, outH);

      const isIphone = currentMockupDevice === "iphone";
      const bodyW = 920;
      const bodyH = isIphone ? 1980 : 2020;
      const bodyX = (outW - bodyW) / 2;
      const bodyY = (outH - bodyH) / 2;
      const outerRadius = isIphone ? 148 : 112;
      const bezel = isIphone ? 30 : 24;
      const screenX = bodyX + bezel;
      const screenY = bodyY + bezel;
      const screenW = bodyW - bezel * 2;
      const screenH = bodyH - bezel * 2;
      const screenRadius = outerRadius - bezel;

      // 1. Tombol samping hardware
      mctx.fillStyle = isIphone ? "#3a3f47" : "#2f343b";
      if (isIphone) {
        // Volume & Power buttons iPhone
        drawRoundedRect(mctx, bodyX - 7, bodyY + 340, 7, 70, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX - 7, bodyY + 450, 7, 130, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX - 7, bodyY + 610, 7, 130, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX + bodyW, bodyY + 490, 7, 190, 3);
        mctx.fill();
      } else {
        // Volume & Power buttons Android (kanan)
        drawRoundedRect(mctx, bodyX + bodyW, bodyY + 380, 7, 180, 3);
        mctx.fill();
        drawRoundedRect(mctx, bodyX + bodyW, bodyY + 610, 7, 105, 3);
        mctx.fill();
      }

      // 2. Bodi luar Titanium / Aluminium Frame
      const frameGrad = mctx.createLinearGradient(bodyX, bodyY, bodyX + bodyW, bodyY + bodyH);
      if (isIphone) {
        frameGrad.addColorStop(0, "#5b616b");
        frameGrad.addColorStop(0.25, "#2b2f36");
        frameGrad.addColorStop(0.5, "#4a4f58");
        frameGrad.addColorStop(0.8, "#1e2126");
        frameGrad.addColorStop(1, "#484d56");
      } else {
        frameGrad.addColorStop(0, "#434850");
        frameGrad.addColorStop(0.5, "#1f2328");
        frameGrad.addColorStop(1, "#393e46");
      }

      drawRoundedRect(mctx, bodyX, bodyY, bodyW, bodyH, outerRadius);
      mctx.fillStyle = frameGrad;
      mctx.fill();

      // Bezel hitam bagian dalam
      drawRoundedRect(mctx, bodyX + 8, bodyY + 8, bodyW - 16, bodyH - 16, outerRadius - 6);
      mctx.fillStyle = "#080a0d";
      mctx.fill();

      // 3. Clipping area layar HP & gambar hasil SS galeri
      mctx.save();
      drawRoundedRect(mctx, screenX, screenY, screenW, screenH, screenRadius);
      mctx.clip();

      drawImageToContext(mctx, capturedGalleryImage, screenX, screenY, screenW, screenH);

      // Gradasi gelap tipis di puncak status bar agar ikon selalu terbaca jelas
      const topStatusGrad = mctx.createLinearGradient(0, screenY, 0, screenY + 130);
      topStatusGrad.addColorStop(0, "rgba(0, 0, 0, 0.34)");
      topStatusGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
      mctx.fillStyle = topStatusGrad;
      mctx.fillRect(screenX, screenY, screenW, 130);

      // 4. Simulasi Status Bar Asli (Jam, Sinyal, Wi-Fi, Baterai) & Notch/Punch-hole
      const timeStr = formatCurrentTime();
      mctx.fillStyle = "#ffffff";
      mctx.textBaseline = "middle";

      if (isIphone) {
        // Jam di kiri atas
        mctx.font = "700 34px -apple-system, BlinkMacSystemFont, sans-serif";
        mctx.textAlign = "left";
        mctx.fillText(timeStr, screenX + 68, screenY + 66);

        // Dynamic Island
        const islandW = 246;
        const islandH = 72;
        const islandX = screenX + (screenW - islandW) / 2;
        const islandY = screenY + 28;
        drawRoundedRect(mctx, islandX, islandY, islandW, islandH, islandH / 2);
        mctx.fillStyle = "#000000";
        mctx.fill();

        // Lensa kamera depan di dalam Dynamic Island
        mctx.beginPath();
        mctx.arc(islandX + islandW - 44, islandY + islandH / 2, 14, 0, Math.PI * 2);
        mctx.fillStyle = "#111927";
        mctx.fill();
        mctx.beginPath();
        mctx.arc(islandX + islandW - 41, islandY + islandH / 2 - 3, 5, 0, Math.PI * 2);
        mctx.fillStyle = "rgba(95, 155, 255, 0.45)";
        mctx.fill();

        // Ikon Sinyal + 5G/WiFi + Baterai iOS di kanan atas
        const rightBaseX = screenX + screenW - 64;
        const statusCenterY = screenY + 66;

        // Baterai
        drawRoundedRect(mctx, rightBaseX - 54, statusCenterY - 13, 48, 26, 7);
        mctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        mctx.lineWidth = 2.5;
        mctx.stroke();
        drawRoundedRect(mctx, rightBaseX - 50, statusCenterY - 9, 38, 18, 4);
        mctx.fillStyle = "#ffffff";
        mctx.fill();
        mctx.fillRect(rightBaseX - 3, statusCenterY - 5, 3, 10);

        // Bar Sinyal
        for (let b = 0; b < 4; b++) {
          const bh = 9 + b * 4.5;
          drawRoundedRect(mctx, rightBaseX - 115 + b * 10, statusCenterY + 12 - bh, 6.5, bh, 2);
          mctx.fill();
        }

        // Home Indicator iOS di bawah
        drawRoundedRect(
          mctx,
          screenX + (screenW - 310) / 2,
          screenY + screenH - 34,
          310,
          11,
          5.5
        );
        mctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        mctx.fill();
      } else {
        // Android Status Bar (Jam di kiri, Punch-hole tengah, Sinyal & Baterai di kanan)
        mctx.font = "600 31px 'Segoe UI', Roboto, sans-serif";
        mctx.textAlign = "left";
        mctx.fillText(timeStr, screenX + 54, screenY + 58);

        // Punch-hole camera tengah atas
        const holeX = screenX + screenW / 2;
        const holeY = screenY + 56;
        mctx.beginPath();
        mctx.arc(holeX, holeY, 21, 0, Math.PI * 2);
        mctx.fillStyle = "#000000";
        mctx.fill();
        mctx.beginPath();
        mctx.arc(holeX - 4, holeY - 4, 6, 0, Math.PI * 2);
        mctx.fillStyle = "rgba(100, 170, 255, 0.35)";
        mctx.fill();

        // Baterai & Sinyal Android di kanan atas
        const rightBaseX = screenX + screenW - 52;
        const statusCenterY = screenY + 58;

        drawRoundedRect(mctx, rightBaseX - 24, statusCenterY - 14, 22, 28, 4);
        mctx.fillStyle = "#ffffff";
        mctx.fill();
        mctx.fillRect(rightBaseX - 17, statusCenterY - 18, 8, 4);

        // Segitiga sinyal seluler
        mctx.beginPath();
        mctx.moveTo(rightBaseX - 64, statusCenterY + 13);
        mctx.lineTo(rightBaseX - 38, statusCenterY + 13);
        mctx.lineTo(rightBaseX - 38, statusCenterY - 13);
        mctx.closePath();
        mctx.fill();

        // Gesture pill Android di bawah
        drawRoundedRect(
          mctx,
          screenX + (screenW - 240) / 2,
          screenY + screenH - 26,
          240,
          8,
          4
        );
        mctx.fillStyle = "rgba(255, 255, 255, 0.78)";
        mctx.fill();
      }

      // 5. Pantulan kilau kaca layar halus
      const glassSheen = mctx.createLinearGradient(screenX, screenY, screenX + screenW * 0.7, screenY + screenH * 0.45);
      glassSheen.addColorStop(0, "rgba(255, 255, 255, 0.11)");
      glassSheen.addColorStop(0.45, "rgba(255, 255, 255, 0.02)");
      glassSheen.addColorStop(1, "rgba(255, 255, 255, 0)");
      mctx.fillStyle = glassSheen;
      mctx.fillRect(screenX, screenY, screenW, screenH);

      mctx.restore();
    }

    chipIphone.addEventListener("click", () => {
      currentMockupDevice = "iphone";
      renderDeviceMockup();
    });

    chipAndroid.addEventListener("click", () => {
      currentMockupDevice = "android";
      renderDeviceMockup();
    });

    saveMockupBtn.addEventListener("click", () => {
      if (!mockupPreviewCanvas.width) return;
      mockupPreviewCanvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `LiquidGlass-Mockup-${currentMockupDevice}-${Date.now()}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
      }, "image/png");
    });

    /* =========================================================
       TAB SWITCHING & INTERACTIVE LIQUID GLASS PILL
       ========================================================= */
    function switchTab(tabIndex, options = {}) {
      const clamped = Math.max(0, Math.min(2, tabIndex));
      const prevTab = activeTab;
      activeTab = clamped;
      pillTarget = clamped;

      navButtons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === clamped);
      });

      if (clamped === 0) {
        stopCamera();
        snapView.classList.remove("active");
        mockupView.classList.remove("active");
        stage.classList.remove("is-hidden");
      } else if (clamped === 1) {
        mockupView.classList.remove("active");
        stage.classList.add("is-hidden");
        snapView.classList.add("active");
        startCamera();
      } else if (clamped === 2) {
        // Jika datang dari Explore (atau belum pernah capture), langsung SS layar galeri
        if (!options.skipCapture && (prevTab === 0 || !capturedGalleryImage)) {
          triggerFlashEffect();
          captureCurrentExploreScreen();
        }
        stopCamera();
        snapView.classList.remove("active");
        stage.classList.add("is-hidden");
        mockupView.classList.add("active");
      }
    }

    navButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (pillMoved) return;
        const tab = Number(btn.dataset.tab);
        switchTab(tab);
      });
    });

    // Gesture geser pada Floating Liquid Glass Bar (termasuk Slide-to-Mockup)
    liquidNav.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      pillDragging = true;
      pillMoved = false;
      pillDragStartX = event.clientX;
      pillDragStartPos = pillPos;
      pillVel = 0;
      liquidNav.setPointerCapture(event.pointerId);
    });

    liquidNav.addEventListener("pointermove", (event) => {
      if (!pillDragging) return;
      const rect = liquidNav.getBoundingClientRect();
      const tabWidth = (rect.width - 12) / 3;
      const dx = event.clientX - pillDragStartX;

      if (Math.abs(dx) > 6) {
        pillMoved = true;
      }

      const rawPos = pillDragStartPos + dx / tabWidth;
      // Rubber-band resistance di ujung kiri/kanan
      if (rawPos < 0) {
        pillPos = rawPos * 0.25;
      } else if (rawPos > 2) {
        pillPos = 2 + (rawPos - 2) * 0.25;
      } else {
        pillPos = rawPos;
      }

      const nearest = Math.max(0, Math.min(2, Math.round(pillPos)));
      navButtons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === nearest);
      });
    });

    function finishPillDrag() {
      if (!pillDragging) return;
      pillDragging = false;

      if (pillMoved) {
        const targetTab = Math.max(0, Math.min(2, Math.round(pillPos)));
        switchTab(targetTab);
        setTimeout(() => {
          pillMoved = false;
        }, 40);
      }
    }

    liquidNav.addEventListener("pointerup", finishPillDrag);
    liquidNav.addEventListener("pointercancel", finishPillDrag);

    function updateLiquidPillPhysics(dt) {
      if (!pillDragging) {
        const stiffness = 240;
        const damping = 2 * Math.sqrt(stiffness) * 0.84;
        pillVel += (-stiffness * (pillPos - pillTarget) - damping * pillVel) * dt;
        pillPos += pillVel * dt;

        if (Math.abs(pillTarget - pillPos) < 0.001 && Math.abs(pillVel) < 0.005) {
          pillPos = pillTarget;
          pillVel = 0;
        }
      }

      const navRect = liquidNav.getBoundingClientRect();
      const tabW = (navRect.width - 12) / 3;
      const translateX = pillPos * tabW;

      // Efek elastis (squish & stretch) saat kapsul bergerak cepat atau ditarik
      const speed = pillDragging ? 0.35 : Math.min(1.5, Math.abs(pillVel) * 0.14);
      const scaleX = 1 + speed * 0.11;
      const scaleY = 1 - speed * 0.05;

      activePill.style.transform = `translate3d(${translateX}px, 0, 0) scale(${scaleX}, ${scaleY})`;
    }

    window.addEventListener("beforeunload", () => {
      stopCamera();
      sessionObjectUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    /* =========================================================
       VIEWPORT & RESIZE
       ========================================================= */
    function getFullScreenDimensions() {
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;

      let w = Math.max(window.innerWidth, document.documentElement.clientWidth);
      let h = Math.max(window.innerHeight, document.documentElement.clientHeight);

      if (isStandalone && window.screen) {
        const isPortrait = window.innerHeight >= window.innerWidth;
        const screenH = isPortrait
          ? Math.max(window.screen.height, window.screen.width)
          : Math.min(window.screen.height, window.screen.width);

        h = Math.max(h, screenH);
      }

      return { w, h };
    }

    function resize() {
      const { w, h } = getFullScreenDimensions();
      if (!w || !h) return;

      document.documentElement.style.height = `${h}px`;
      document.body.style.height = `${h}px`;
      app.style.height = `${h}px`;
      stage.style.height = `${h}px`;
      visibleCanvas.style.height = `${h}px`;

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = w;
      height = h;

      const pixelWidth = Math.max(1, Math.round(width * dpr));
      const pixelHeight = Math.max(1, Math.round(height * dpr));

      visibleCanvas.width = pixelWidth;
      visibleCanvas.height = pixelHeight;
      sceneCanvas.width = pixelWidth;
      sceneCanvas.height = pixelHeight;

      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      const aspectRatio = 0.72;
      cardWidth = pixelWidth * (isMobile ? 0.94 : 0.74);
      cardHeight = cardWidth / aspectRatio;

      const maxCardHeight = pixelHeight * (isMobile ? 0.62 : 0.66);
      if (cardHeight > maxCardHeight) {
        cardHeight = maxCardHeight;
        cardWidth = cardHeight * aspectRatio;
      }

      const cardGap = (isMobile ? 150 : 50) * dpr;
      slot = cardHeight + cardGap;

      cardCenterY = pixelHeight * (isMobile ? 0.45 : 0.53);

      buildItemSnapshots();

      if (gl) {
        gl.viewport(0, 0, pixelWidth, pixelHeight);
      }

      resizeGlassCanvas();
    }

    function resizeGlassCanvas() {
      const rect = liquidNav.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const newWidth = Math.max(1, Math.round(rect.width * dpr));
      const newHeight = Math.max(1, Math.round(rect.height * dpr));

      if (glassCanvas.width !== newWidth || glassCanvas.height !== newHeight) {
        glassCanvas.width = newWidth;
        glassCanvas.height = newHeight;
        glassImageData = glassCtx.createImageData(newWidth, newHeight);
      }
    }

    /* =========================================================
       REAL-TIME EDGE REFRACTION & CHROMATIC DISPERSION FOR NAV BAR
       ========================================================= */
    function drawLiquidNavRefraction(now) {
      if (now - lastGlassDraw < 32) return;
      lastGlassDraw = now;

      const rect = liquidNav.getBoundingClientRect();
      if (!rect.width || !rect.height || !sceneCanvas.width) return;

      resizeGlassCanvas();

      const lensWidth = glassCanvas.width;
      const lensHeight = glassCanvas.height;
      if (!lensWidth || !lensHeight || !glassImageData) return;

      const left = Math.round(rect.left * dpr);
      const top = Math.round(rect.top * dpr);

      const pad = Math.round(16 * dpr);
      const sourceLeft = Math.max(0, left - pad);
      const sourceTop = Math.max(0, top - pad);
      const sourceRight = Math.min(sceneCanvas.width, left + lensWidth + pad);
      const sourceBottom = Math.min(sceneCanvas.height, top + lensHeight + pad);

      const sourceWidth = sourceRight - sourceLeft;
      const sourceHeight = sourceBottom - sourceTop;
      if (sourceWidth <= 0 || sourceHeight <= 0) return;

      let source;
      try {
        source = ctx.getImageData(
          sourceLeft,
          sourceTop,
          sourceWidth,
          sourceHeight
        ).data;
      } catch (error) {
        glassCtx.clearRect(0, 0, lensWidth, lensHeight);
        return;
      }

      const output = glassImageData.data;
      const centerX = lensWidth * 0.5;
      const centerY = lensHeight * 0.5;
      const halfW = Math.max(1, centerX);
      const halfH = Math.max(1, centerY);
      const maxOffset = 12 * dpr;

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function readChannel(x, y, channel) {
        const sx = Math.max(0, Math.min(sourceWidth - 1, x));
        const sy = Math.max(0, Math.min(sourceHeight - 1, y));
        return source[(sy * sourceWidth + sx) * 4 + channel];
      }

      for (let y = 0; y < lensHeight; y++) {
        const ny = (y - centerY) / halfH;

        for (let x = 0; x < lensWidth; x++) {
          const nx = (x - centerX) / halfW;
          const radius = Math.sqrt(nx * nx * 0.35 + ny * ny * 0.85);

          const outIndex = (y * lensWidth + x) * 4;
          const edge = smoothstep(0.32, 1.05, radius);
          const displacement = edge * maxOffset;
          const dispersion = edge * 2.4 * dpr;

          const baseX = left + x + nx * displacement - sourceLeft;
          const baseY = top + y + ny * displacement - sourceTop;

          output[outIndex] = readChannel(Math.round(baseX + nx * dispersion), Math.round(baseY + ny * dispersion), 0);
          output[outIndex + 1] = readChannel(Math.round(baseX), Math.round(baseY), 1);
          output[outIndex + 2] = readChannel(Math.round(baseX - nx * dispersion), Math.round(baseY - ny * dispersion), 2);
          output[outIndex + 3] = 255;
        }
      }

      glassCtx.putImageData(glassImageData, 0, 0);
    }

    function getOffset(index) {
      const count = items.length;
      let offset = index - scroll;
      offset = ((offset + count / 2) % count + count) % count - count / 2;
      return offset;
    }

    function drawScene() {
      const pixelWidth = sceneCanvas.width;
      const pixelHeight = sceneCanvas.height;

      const background = ctx.createLinearGradient(0, 0, pixelWidth, pixelHeight);
      background.addColorStop(0, "#1d2d3b");
      background.addColorStop(0.52, "#182838");
      background.addColorStop(1, "#07121e");
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      const activeIndex = wrapIndex(Math.round(scroll));
      const activeBackdrop = backdropSnapshots[activeIndex];

      if (activeBackdrop) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.drawImage(activeBackdrop, 0, 0, pixelWidth, pixelHeight);
        ctx.restore();

        ctx.fillStyle = "rgba(5, 14, 22, 0.22)";
        ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      }

      const centerX = pixelWidth / 2;
      const centerY = cardCenterY;

      const visibleItems = items
        .map((item, index) => ({ index, offset: getOffset(index) }))
        .filter(({ offset }) => Math.abs(offset) <= 2.6)
        .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

      visibleItems.forEach(({ index, offset }) => {
        const distance = Math.abs(offset);
        const scale = 1 - Math.min(distance, 1) * 0.08;
        const w = cardWidth * scale;
        const h = cardHeight * scale;
        const x = centerX - w / 2;
        const y = centerY + offset * slot - h / 2;
        const snapshot = itemSnapshots[index];

        if (!snapshot) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0.55, 1 - distance * 0.14);

        ctx.shadowColor = "rgba(0, 0, 0, 0.36)";
        ctx.shadowBlur = 26 * dpr;
        ctx.shadowOffsetY = 10 * dpr;

        ctx.drawImage(snapshot, x, y, w, h);

        ctx.restore();
      });

      counter.textContent = `${activeIndex + 1} / ${items.length}`;
    }

    function uploadSceneTexture() {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        sceneCanvas
      );
    }

    function renderWebGLScene(now) {
      drawScene();
      if (activeTab === 0) {
        drawLiquidNavRefraction(now);
      }
      uploadSceneTexture();

      gl.useProgram(program);
      gl.uniform1i(uniforms.scene, 0);
      gl.uniform2f(
        uniforms.resolution,
        visibleCanvas.width,
        visibleCanvas.height
      );
      gl.uniform2f(
        uniforms.cardCenter,
        0.5,
        1.0 - cardCenterY / visibleCanvas.height
      );
      gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
      gl.uniform1f(uniforms.time, now / 1000);

      gl.clearColor(11 / 255, 24 / 255, 36 / 255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function renderFrame(time) {
      const now = time || performance.now();

      if (!previousFrameTime) previousFrameTime = now;
      const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
      previousFrameTime = now;

      if (!dragging) {
        const stiffness = 170;
        const damping = 2 * Math.sqrt(stiffness) * 0.92;

        velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
        scroll += velocity * dt;

        if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
          scroll = target;
          velocity = 0;
        }
      }

      updateLiquidPillPhysics(dt);

      if (activeTab === 0) {
        renderWebGLScene(now);
      }

      requestAnimationFrame(renderFrame);
    }

    function moveBy(direction) {
      target = Math.round(scroll) + direction;
      velocity = 0;
    }

    stage.addEventListener("pointerdown", (event) => {
      if (activeTab !== 0) return;
      if (event.button !== undefined && event.button !== 0) return;

      dragging = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);

      dragStartY = event.clientY;
      dragStartScroll = scroll;
      lastPointerY = event.clientY;
      lastPointerTime = performance.now();
      pointerVelocity = 0;
      velocity = 0;
      target = scroll;
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const now = performance.now();
      const elapsed = Math.max(1, now - lastPointerTime);
      const dy = event.clientY - dragStartY;

      scroll = dragStartScroll - (dy * dpr) / slot;
      target = scroll;

      pointerVelocity =
        (-(event.clientY - lastPointerY) * dpr / slot) /
        (elapsed / 1000);

      lastPointerY = event.clientY;
      lastPointerTime = now;
    });

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      stage.classList.remove("dragging");

      const projected = scroll + pointerVelocity * 0.16;
      target = Math.round(projected);

      if (Math.abs(pointerVelocity) > 1.1) {
        target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
      }

      velocity = pointerVelocity;
    }

    stage.addEventListener("pointerup", finishDrag);
    stage.addEventListener("pointercancel", finishDrag);

    stage.addEventListener("wheel", (event) => {
      if (activeTab !== 0) return;
      event.preventDefault();

      const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
        ? event.deltaY
        : event.deltaX;

      if (!delta) return;

      wheelDelta += delta;
      window.clearTimeout(wheelTimer);

      wheelTimer = window.setTimeout(() => {
        const direction = Math.sign(wheelDelta);
        const steps = Math.min(
          items.length,
          Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
        );

        if (direction) {
          target = Math.round(scroll) + direction * steps;
          velocity = 0;
        }

        wheelDelta = 0;
      }, 100);
    }, { passive: false });

    document.addEventListener("keydown", (event) => {
      if (activeTab !== 0) return;
      if (event.key === "ArrowDown") moveBy(1);
      if (event.key === "ArrowUp") moveBy(-1);
    });

    async function init() {
      gl = visibleCanvas.getContext("webgl2", {
        alpha: false,
        antialias: true
      });

      if (!gl) {
        stage.innerHTML =
          "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
        return;
      }

      try {
        images = await Promise.all(items.map((item) => loadImage(item.image)));

        program = createProgram();
        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());

        sceneTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        uniforms = {
          scene: gl.getUniformLocation(program, "uScene"),
          resolution: gl.getUniformLocation(program, "uResolution"),
          cardCenter: gl.getUniformLocation(program, "uCardCenter"),
          cardSize: gl.getUniformLocation(program, "uCardSize"),
          time: gl.getUniformLocation(program, "uTime")
        };

        resize();
        setTimeout(resize, 100);
        setTimeout(resize, 400);
        requestAnimationFrame(renderFrame);
      } catch (error) {
        console.error(error);
        stage.innerHTML =
          "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
      }
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    window.visualViewport?.addEventListener("resize", resize);

    init();
  </script>
</body>
</html>
