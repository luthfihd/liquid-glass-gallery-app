        const statusCenterY = screenY + 66;

        drawRoundedRect(mctx, rightBaseX - 52, statusCenterY - 12, 46, 24, 6);
        mctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        mctx.lineWidth = 2.5;
        mctx.stroke();
        drawRoundedRect(mctx, rightBaseX - 48, statusCenterY - 8, 36, 16, 4);
        mctx.fillStyle = "#ffffff";
        mctx.fill();
        mctx.fillRect(rightBaseX - 3, statusCenterY - 4, 3, 8);

        for (let b = 0; b < 4; b++) {
          const bh = 9 + b * 4.2;
          drawRoundedRect(mctx, rightBaseX - 110 + b * 9.5, statusCenterY + 11 - bh, 6, bh, 2);
          mctx.fill();
        }

        drawRoundedRect(
          mctx,
          screenX + (screenW - 310) / 2,
          screenY + screenH - 32,
          310,
          10,
          5
        );
        mctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        mctx.fill();
      } else {
        mctx.font = "600 31px 'Segoe UI', Roboto, sans-serif";
        mctx.textAlign = "left";
        mctx.fillText(timeStr, screenX + 54, screenY + 58);

        const holeX = screenX + screenW / 2;
        const holeY = screenY + 56;
        mctx.beginPath();
        mctx.arc(holeX, holeY, 20, 0, Math.PI * 2);
        mctx.fillStyle = "#000000";
        mctx.fill();
        mctx.beginPath();
        mctx.arc(holeX - 4, holeY - 4, 5.5, 0, Math.PI * 2);
        mctx.fillStyle = "rgba(100, 170, 255, 0.35)";
        mctx.fill();

        const rightBaseX = screenX + screenW - 52;
        const statusCenterY = screenY + 58;

        drawRoundedRect(mctx, rightBaseX - 22, statusCenterY - 13, 20, 26, 4);
        mctx.fillStyle = "#ffffff";
        mctx.fill();
        mctx.fillRect(rightBaseX - 16, statusCenterY - 17, 8, 4);

        mctx.beginPath();
        mctx.moveTo(rightBaseX - 60, statusCenterY + 12);
        mctx.lineTo(rightBaseX - 36, statusCenterY + 12);
        mctx.lineTo(rightBaseX - 36, statusCenterY - 12);
        mctx.closePath();
        mctx.fill();

        drawRoundedRect(
          mctx,
          screenX + (screenW - 240) / 2,
          screenY + screenH - 25,
          240,
          8,
          4
        );
        mctx.fillStyle = "rgba(255, 255, 255, 0.78)";
        mctx.fill();
      }

      const glassSheen = mctx.createLinearGradient(screenX, screenY, screenX + screenW * 0.7, screenY + screenH * 0.45);
      glassSheen.addColorStop(0, "rgba(255, 255, 255, 0.10)");
      glassSheen.addColorStop(0.45, "rgba(255, 255, 255, 0.02)");
      glassSheen.addColorStop(1, "rgba(255, 255, 255, 0)");
      mctx.fillStyle = glassSheen;
      mctx.fillRect(screenX, screenY, screenW, screenH);

      mctx.restore();
    }

    /* =========================================================
       SEGMENTED TOGGLES
       ========================================================= */
    function bindSegmentedToggle(containerEl, thumbEl, lensLayerEl, base0El, base1El, getCurrentIdx, onSelectIndex) {
      let draggingSeg = false;
      let startX = 0;
      let startRatio = 0;
      let currentRatio = 0;
      let moved = false;

      containerEl.addEventListener("pointerdown", (e) => {
        draggingSeg = true;
        moved = false;
        startX = e.clientX;
        startRatio = getCurrentIdx();
        currentRatio = startRatio;
        containerEl.classList.add("is-morphing");
        try { containerEl.setPointerCapture(e.pointerId); } catch (_) {}
        updateSegmentedLensClip(thumbEl, lensLayerEl, base0El, base1El, currentRatio, true);
      });

      containerEl.addEventListener("pointermove", (e) => {
        if (!draggingSeg) return;
        const rect = containerEl.getBoundingClientRect();
        const halfW = (rect.width - 6) / 2;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) moved = true;

        currentRatio = Math.max(-0.08, Math.min(1.08, startRatio + dx / halfW));
        updateSegmentedLensClip(thumbEl, lensLayerEl, base0El, base1El, currentRatio, true);
      });

      function endSeg(e) {
        if (!draggingSeg) return;
        draggingSeg = false;
        containerEl.classList.remove("is-morphing");

        let targetIdx;
        if (!moved && e && e.clientX !== undefined) {
          const rect = containerEl.getBoundingClientRect();
          const relX = e.clientX - rect.left;
          targetIdx = relX < rect.width / 2 ? 0 : 1;
        } else {
          targetIdx = currentRatio >= 0.5 ? 1 : 0;
        }
        onSelectIndex(targetIdx);
      }

      containerEl.addEventListener("pointerup", endSeg);
      containerEl.addEventListener("pointercancel", () => {
        draggingSeg = false;
        containerEl.classList.remove("is-morphing");
        onSelectIndex(getCurrentIdx());
      });
    }

    bindSegmentedToggle(
      deviceToggle,
      deviceToggleThumb,
      deviceToggleLensLayer,
      devBase0,
      devBase1,
      () => (currentMockupDevice === "iphone" ? 0 : 1),
      (idx) => {
        currentMockupDevice = idx === 0 ? "iphone" : "android";
        renderDeviceMockup();
      }
    );

    bindSegmentedToggle(
      navToggle,
      navToggleThumb,
      navToggleLensLayer,
      navBase0,
      navBase1,
      () => (includeNavInSS ? 0 : 1),
      (idx) => {
        includeNavInSS = idx === 0;
        renderDeviceMockup();
      }
    );

    /* =========================================================
       SUB-PIXEL BILINEAR SAMPLER (ZERO PIXEL JITTER)
       ========================================================= */
    function sampleBilinearChannel(source, w, h, fx, fy, ch) {
      const x = fx < 0 ? 0 : (fx > w - 1 ? w - 1 : fx);
      const y = fy < 0 ? 0 : (fy > h - 1 ? h - 1 : fy);
      const x0 = x | 0;
      const y0 = y | 0;
      const x1 = x0 + 1 < w ? x0 + 1 : x0;
      const y1 = y0 + 1 < h ? y0 + 1 : y0;
      const tx = x - x0;
      const ty = y - y0;
      const itx = 1 - tx;
      const ity = 1 - ty;

      const row0 = y0 * w;
      const row1 = y1 * w;
      const c00 = source[(row0 + x0) * 4 + ch];
      const c10 = source[(row0 + x1) * 4 + ch];
      const c01 = source[(row1 + x0) * 4 + ch];
      const c11 = source[(row1 + x1) * 4 + ch];

      return ((c00 * itx + c10 * tx) * ity + (c01 * itx + c11 * tx) * ty + 0.5) | 0;
    }

    /* =========================================================
       REAL-TIME OPTICAL REFRACTION SLIDERS
       ========================================================= */
    function createOpticalSlider(sliderEl, canvasEl, thumbEl, getLabelText, getStepsCount, onStepChange) {
      const sctx = canvasEl.getContext("2d", { willReadFrequently: true });
      const buf = document.createElement("canvas");
      const bctx = buf.getContext("2d", { willReadFrequently: true });
      let imgData = null;

      let isSliding = false;
      let startX = 0;
      let startRatio = 0;
      let currentRatio = 0;
      let moved = false;

      const THUMB_W = 84;
      const THUMB_H = 36;

      function positionThumb(ratio, morphing = false) {
        const clampedRatio = Math.max(0, Math.min(1, ratio));
        const cardW = sliderEl.offsetWidth || 180;
        const maxTravel = Math.max(1, cardW - THUMB_W - 6);
        const x = clampedRatio * maxTravel;
        const sx = morphing ? 1.14 : 1;
        const sy = morphing ? 1.24 : 1;

        thumbEl.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0) scale(${sx}, ${sy})`;
      }

      function renderOptics() {
        const unscaledW = sliderEl.offsetWidth + 16;
        const unscaledH = sliderEl.offsetHeight + 20;
        if (!unscaledW || !unscaledH) return;

        const w = Math.max(1, Math.round(unscaledW * dpr));
        const h = Math.max(1, Math.round(unscaledH * dpr));

        if (canvasEl.width !== w || canvasEl.height !== h) {
          canvasEl.width = w;
          canvasEl.height = h;
          buf.width = w;
          buf.height = h;
          imgData = sctx.createImageData(w, h);
        }

        const padX = 8 * dpr;
        const padY = 10 * dpr;
        const cardW = w - padX * 2;
        const insetPx = 3 * dpr;
        const thumbW = THUMB_W * dpr;
        const thumbH = THUMB_H * dpr;
        const maxTravel = Math.max(1, cardW - thumbW - insetPx * 2);

        const sx = isSliding ? 1.14 : 1.0;
        const sy = isSliding ? 1.24 : 1.0;
        const pillHalfW = (thumbW * sx) * 0.5;
        const pillHalfH = (thumbH * sy) * 0.5;
        const pillCenterX = padX + insetPx + currentRatio * maxTravel + thumbW * 0.5;
        const pillCenterY = h * 0.5;

        bctx.clearRect(0, 0, w, h);

        bctx.save();
        bctx.font = `600 ${Math.round(11.2 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
        bctx.fillStyle = "rgba(255, 255, 255, 0.92)";
        bctx.textAlign = "center";
        bctx.textBaseline = "middle";
        bctx.fillText(getLabelText(), w * 0.5, h * 0.5);
        bctx.restore();

        bctx.save();
        drawRoundedRect(
          bctx,
          pillCenterX - pillHalfW * 0.94,
          pillCenterY - pillHalfH * 0.94,
          pillHalfW * 1.88,
          pillHalfH * 1.88,
          pillHalfH * 0.94
        );
        bctx.clip();
        bctx.clearRect(0, 0, w, h);
        bctx.font = `650 ${Math.round(11.2 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
        bctx.fillStyle = `rgb(${currentAccentRgb.join(",")})`;
        bctx.textAlign = "center";
        bctx.textBaseline = "middle";
        bctx.fillText(getLabelText(), w * 0.5, h * 0.5);
        bctx.restore();

        // Idle = Lens Off (100% crisp tanpa distorsi)
        if (!isSliding) {
          sctx.clearRect(0, 0, w, h);
          sctx.drawImage(buf, 0, 0);
          return;
        }

        const source = bctx.getImageData(0, 0, w, h).data;
        const output = imgData.data;
        const cornerR = Math.min(pillHalfW, pillHalfH);
        const boxHalfX = Math.max(0, pillHalfW - cornerR);
        const boxHalfY = Math.max(0, pillHalfH - cornerR);

        for (let y = 0; y < h; y++) {
          const dy = y - pillCenterY;
          const qy = Math.abs(dy) - boxHalfY;
          const oy = qy > 0 ? qy : 0;
          const oy2 = oy * oy;

          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const dx = x - pillCenterX;
            const qx = Math.abs(dx) - boxHalfX;
            const ox = qx > 0 ? qx : 0;
            const sdf = Math.sqrt(ox * ox + oy2) + Math.min(Math.max(qx, qy), 0) - cornerR;

            if (sdf <= 1.0 * dpr) {
              const u = Math.max(0, Math.min(1, 1.0 + sdf / cornerR));
              const lipBend = Math.pow(u, 4.2);
              const nx = dx / pillHalfW;
              const ny = dy / pillHalfH;

              const shiftX = -dx * 0.14 * (1.0 - lipBend) - nx * lipBend * 7.5 * dpr;
              const shiftY = -dy * 0.14 * (1.0 - lipBend) - ny * lipBend * 6.0 * dpr;
              const dispX = nx * lipBend * 1.6 * dpr;
              const dispY = ny * lipBend * 1.2 * dpr;

              const bx = x + shiftX;
              const by = y + shiftY;
              output[idx] = sampleBilinearChannel(source, w, h, bx + dispX, by + dispY, 0);
              output[idx + 1] = sampleBilinearChannel(source, w, h, bx, by, 1);
              output[idx + 2] = sampleBilinearChannel(source, w, h, bx - dispX, by - dispY, 2);
              output[idx + 3] = sampleBilinearChannel(source, w, h, bx, by, 3);
            } else {
              output[idx] = source[idx];
              output[idx + 1] = source[idx + 1];
              output[idx + 2] = source[idx + 2];
              output[idx + 3] = source[idx + 3];
            }
          }
        }
        sctx.putImageData(imgData, 0, 0);
      }

      sliderEl.addEventListener("pointerdown", (e) => {
        isSliding = true;
        moved = false;
        startX = e.clientX;
        startRatio = currentRatio;
        sliderEl.classList.add("is-morphing");
        try { sliderEl.setPointerCapture(e.pointerId); } catch (_) {}
        positionThumb(currentRatio, true);
      });

      sliderEl.addEventListener("pointermove", (e) => {
        if (!isSliding) return;
        const cardW = sliderEl.offsetWidth || 180;
        const maxTravel = Math.max(1, cardW - THUMB_W - 6);
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) moved = true;

        currentRatio = Math.max(0, Math.min(1, startRatio + dx / maxTravel));
        positionThumb(currentRatio, true);

        const steps = getStepsCount();
        const idx = Math.min(steps - 1, Math.round(currentRatio * (steps - 1)));
        onStepChange(idx);
      });

      function endSlide(e) {
        if (!isSliding) return;
        isSliding = false;
        sliderEl.classList.remove("is-morphing");
        const steps = getStepsCount();

        if (!moved && e && typeof e.clientX === "number") {
          const rect = sliderEl.getBoundingClientRect();
          const relRatio = Math.max(0, Math.min(1, (e.clientX - rect.left - THUMB_W * 0.5) / Math.max(1, rect.width - THUMB_W)));
          const tappedIdx = Math.min(steps - 1, Math.round(relRatio * (steps - 1)));
          const curIdx = Math.min(steps - 1, Math.round(currentRatio * (steps - 1)));
          const nextIdx = tappedIdx === curIdx ? (curIdx + 1) % steps : tappedIdx;
          currentRatio = steps > 1 ? nextIdx / (steps - 1) : 0;
          onStepChange(nextIdx);
        } else {
          const snapIdx = Math.min(steps - 1, Math.round(currentRatio * (steps - 1)));
          currentRatio = steps > 1 ? snapIdx / (steps - 1) : 0;
          onStepChange(snapIdx);
        }
        positionThumb(currentRatio, false);
      }

      sliderEl.addEventListener("pointerup", endSlide);
      sliderEl.addEventListener("pointercancel", () => {
        isSliding = false;
        sliderEl.classList.remove("is-morphing");
        positionThumb(currentRatio, false);
      });

      return {
        sync(idx) {
          const steps = getStepsCount();
          currentRatio = steps > 1 ? idx / (steps - 1) : 0;
          positionThumb(currentRatio, false);
        },
        renderOptics
      };
    }

    const bgSliderCtrl = createOpticalSlider(
      bgSlider,
      bgSliderCanvas,
      bgSliderThumb,
      () => currentBgLabel,
      () => 5,
      (idx) => {
        if (bgPresetIndex !== idx) {
          bgPresetIndex = idx;
          updateMockupBackgroundDOM();
          renderDeviceMockup();
        }
      }
    );

    const frameSliderCtrl = createOpticalSlider(
      frameSlider,
      frameSliderCanvas,
      frameSliderThumb,
      () => currentFrameLabel,
      () => frameFinishes.length,
      (idx) => {
        if (frameFinishIndex !== idx) {
          frameFinishIndex = idx;
          renderDeviceMockup();
        }
      }
    );

    saveMockupBtn.addEventListener("click", () => {
      if (!mockupPreviewCanvas.width) return;
      mockupPreviewCanvas.toBlob((blob) => {
        if (!blob) return;
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `LiquidGlass-Mockup-${currentMockupDevice}-${Date.now()}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
      }, "image/png");
    });

    /* =========================================================
       TAB SWITCHING & LIQUID WATER WIGGLE NAVBAR PHYSICS
       - Idle: 100% Lensa Off (Zero Distortion, Static & Crisp)
       - Slide / Upward Pull: Fast Snap + Liquid Water Wiggle (Not Bubble)
       ========================================================= */
    function switchTab(tabIndex, options = {}) {
      const clamped = Math.max(0, Math.min(2, tabIndex));
      const prevTab = activeTab;

      if (clamped === 2 && !options.skipCapture && (prevTab === 0 || !capturedRawScene)) {
        triggerFlashEffect();
        captureCurrentExploreScreen();
      }

      activeTab = clamped;
      pillTarget = clamped;
      lastIdleDrawnKey = "";

      if (clamped === 0) {
        stopCamera();
        snapView.classList.remove("active");
        mockupView.classList.remove("active");
        stage.classList.remove("is-hidden");
      } else if (clamped === 1) {
        mockupView.classList.remove("active");
        stage.classList.add("is-hidden");
        snapView.classList.add("active");
        startCamera();
      } else if (clamped === 2) {
        stopCamera();
        snapView.classList.remove("active");
        stage.classList.add("is-hidden");
        mockupView.classList.add("active");
        requestAnimationFrame(() => {
          bgSliderCtrl.sync(bgPresetIndex);
          frameSliderCtrl.sync(frameFinishIndex);
        });
      }
    }

    liquidNav.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      pillDragging = true;
      pillPressing = true;
      pillMoved = false;
      pillDragStartX = event.clientX;
      pillDragStartY = event.clientY;
      pillDragStartPos = pillPos;
      pillVel = 0;
      navPullTargetY = 0;
      navWobbleVel += 4.5;
      try {
        liquidNav.setPointerCapture(event.pointerId);
      } catch (_) {}
    });

    liquidNav.addEventListener("pointermove", (event) => {
      if (!pillDragging) return;
      const baseW = liquidNav.offsetWidth || 344;
      const tabWidth = (baseW - 10) / 3;
      const dx = event.clientX - pillDragStartX;
      const dy = event.clientY - pillDragStartY;

      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
        pillMoved = true;
      }

      const prevPos = pillPos;
      const rawPos = pillDragStartPos + dx / tabWidth;
      if (rawPos < 0) {
        pillPos = rawPos * 0.22;
      } else if (rawPos > 2) {
        pillPos = 2 + (rawPos - 2) * 0.22;
      } else {
        pillPos = rawPos;
      }

      // Kecepatan instan mengikuti jari untuk riak air
      const instantVel = (pillPos - prevPos) * 45;
      pillVel = pillVel * 0.45 + instantVel * 0.55;

      // Tarikan ke atas / bawah (rubber-band liquid tension seperti iOS 26/27)
      const clampedDy = Math.max(-72, Math.min(36, dy));
      navPullTargetY = clampedDy * 0.34;
    });

    function finishPillDrag(event) {
      if (!pillDragging) return;
      pillDragging = false;
      pillPressing = false;

      // Lepas tarikan ke atas memicu gelombang air (water surface wiggle)
      const releaseEnergy = Math.min(1.6, Math.abs(navPullTargetY) * 0.08 + Math.abs(pillVel) * 0.14);
      navWobbleVel += (pillVel >= 0 ? 1 : -1) * (6.5 + releaseEnergy * 8.0);
      navPullTargetY = 0;

      const navRect = liquidNav.getBoundingClientRect();
      const targetTab = (!pillMoved && event && typeof event.clientX === "number")
        ? Math.max(0, Math.min(2, Math.floor(((event.clientX - navRect.left) / navRect.width) * 3)))
        : Math.max(0, Math.min(2, Math.round(pillPos)));

      pillMoved = false;
      switchTab(targetTab);
    }

    liquidNav.addEventListener("pointerup", finishPillDrag);
    liquidNav.addEventListener("pointercancel", () => {
      pillDragging = false;
      pillPressing = false;
      pillMoved = false;
      navPullTargetY = 0;
      switchTab(Math.max(0, Math.min(2, Math.round(pillPos))));
    });

    /* =========================================================
       LIQUID WATER SHAPE (DYNAMIC FLUID SQUASH-STRETCH, NOT BUBBLE)
       ========================================================= */
    function getLiquidPillShape() {
      const a = lensActivity;
      // Air memanjang searah aliran gerak (flow stretch) dan pipih mengikuti tegangan permukaan,
      // tidak membulat menggembung seperti gelembung sabun.
      const flowSpeed = Math.min(1.2, Math.abs(pillVel) * 0.085);
      const liftStretch = Math.min(0.14, Math.abs(navLiftY) * 0.008);
      const ripple = navWobble * 0.022;

      return {
        scaleX: 1 + a * (0.11 + flowSpeed * 0.13 + ripple - liftStretch * 0.35),
        scaleY: 1 + a * (0.20 + liftStretch - flowSpeed * 0.03 - ripple * 0.85),
        skewX: (pillVel * 0.55 + navWobble * 0.9) * a
      };
    }

    function updateLiquidPillPhysics(dt) {
      // Sub-stepping 2x agar pegas sangat cepat, responsif, dan bebas osilasi liar
      const steps = 2;
      const h = dt / steps;

      for (let s = 0; s < steps; s++) {
        // 1. Pegas perpindahan pill antar tab (cepat & tegas)
        if (!pillDragging) {
          const stiffness = 680;
          const damping = 2 * Math.sqrt(stiffness) * 0.86;
          pillVel += (-stiffness * (pillPos - pillTarget) - damping * pillVel) * h;
          pillPos += pillVel * h;

          if (Math.abs(pillTarget - pillPos) < 0.0015 && Math.abs(pillVel) < 0.008) {
            pillPos = pillTarget;
            pillVel = 0;
          }
        }

        // 2. Aktivasi lensa: 0 saat idle (lensa OFF), naik cepat saat slide/sentuh
        const isMoving =
          Math.abs(pillPos - pillTarget) > 0.015 ||
          Math.abs(pillVel) > 0.08 ||
          Math.abs(navLiftY) > 0.35;
        const activityTarget = (pillPressing || pillDragging || isMoving) ? 1.0 : 0.0;
        const aStiff = activityTarget > lensActivity ? 1400 : 720;
        const aDamp = 2 * Math.sqrt(aStiff) * 0.95;
        lensActivityVel += (-aStiff * (lensActivity - activityTarget) - aDamp * lensActivityVel) * h;
        lensActivity += lensActivityVel * h;
        if (Math.abs(activityTarget - lensActivity) < 0.002 && Math.abs(lensActivityVel) < 0.008) {
          lensActivity = activityTarget;
          lensActivityVel = 0;
        }

        // 3. Pegas tarikan vertikal navbar ke atas (Upward Water Lift)
        const liftStiff = pillDragging ? 520 : 340;
        const liftDamp = pillDragging
          ? 2 * Math.sqrt(liftStiff) * 0.85
          : 2 * Math.sqrt(liftStiff) * 0.44; // Underdamped saat dilepas -> memantul cair seperti air!
        navLiftVelY += (-liftStiff * (navLiftY - navPullTargetY) - liftDamp * navLiftVelY) * h;
        navLiftY += navLiftVelY * h;
        if (!pillDragging && Math.abs(navLiftY) < 0.03 && Math.abs(navLiftVelY) < 0.08) {
          navLiftY = 0;
          navLiftVelY = 0;
        }

        // 4. Pegas kemiringan air (Liquid Tilt) mengikuti posisi tab & tarikan ke atas
        const leverage = (pillPos - 1.0); // -1 di kiri, 0 di tengah, +1 di kanan
        const targetTilt = leverage * (-navLiftY * 0.24) + pillVel * 0.18;
        const tiltStiff = 280;
        const tiltDamp = 2 * Math.sqrt(tiltStiff) * 0.42; // Underdamped wiggle
        navTiltVel += (-tiltStiff * (navTilt - targetTilt) - tiltDamp * navTiltVel) * h;
        navTilt += navTiltVel * h;
        if (!pillDragging && Math.abs(navTilt) < 0.02 && Math.abs(navTiltVel) < 0.05) {
          navTilt = 0;
          navTiltVel = 0;
        }

        // 5. Gelombang riak permukaan air (Surface Tension Wiggle)
        const wobbleStiff = 260;
        const wobbleDamp = 2 * Math.sqrt(wobbleStiff) * 0.34;
        navWobbleVel += (-wobbleStiff * navWobble - wobbleDamp * navWobbleVel) * h;
        navWobble += navWobbleVel * h;
        if (!pillDragging && Math.abs(navWobble) < 0.005 && Math.abs(navWobbleVel) < 0.02) {
          navWobble = 0;
          navWobbleVel = 0;
        }

        // 6. Pegas ketinggian pill di dalam air (ikuti tarikan ke atas dengan sedikit inersia cair)
        const targetPillLift = navLiftY * 0.28;
        const pLiftStiff = 420;
        const pLiftDamp = 2 * Math.sqrt(pLiftStiff) * 0.46;
        pillLiftVelY += (-pLiftStiff * (pillLiftY - targetPillLift) - pLiftDamp * pillLiftVelY) * h;
        pillLiftY += pillLiftVelY * h;
      }

      waterPhase += dt * (9.5 + Math.abs(pillVel) * 3.0 + Math.abs(navWobble) * 4.0);

      // Terapkan transformasi Liquid Wiggle pada kontainer Navbar
      const liftRatio = Math.min(1, Math.abs(navLiftY) / 18);
      const navScaleX = 1 + lensActivity * 0.028 - liftRatio * 0.018 + navWobble * 0.006;
      const navScaleY = 1 + lensActivity * 0.032 + liftRatio * 0.034 - navWobble * 0.008;

      if (lensActivity <= 0.001 && Math.abs(navLiftY) < 0.03 && Math.abs(navTilt) < 0.02 && Math.abs(navWobble) < 0.005) {
        liquidNav.style.transform = "translate3d(0px, 0px, 0) rotate(0deg) scale(1, 1)";
      } else {
        liquidNav.style.transform =
          `translate3d(0px, ${navLiftY.toFixed(2)}px, 0) ` +
          `rotate(${navTilt.toFixed(2)}deg) ` +
          `scale(${navScaleX.toFixed(4)}, ${navScaleY.toFixed(4)})`;
      }

      const unscaledW = liquidNav.offsetWidth || 344;
      const innerW = unscaledW - 10;
      const baseTabW = innerW / 3;
      const translateX = pillPos * baseTabW;

      const { scaleX, scaleY, skewX } = getLiquidPillShape();
      activePill.style.transform =
        `translate3d(${translateX.toFixed(2)}px, ${pillLiftY.toFixed(2)}px, 0) ` +
        `skewX(${skewX.toFixed(2)}deg) ` +
        `scale(${scaleX.toFixed(4)}, ${scaleY.toFixed(4)})`;
    }

    window.addEventListener("beforeunload", () => {
      stopCamera();
      sessionObjectUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    /* =========================================================
       VIEWPORT & RESIZE (EXACT REPO DIMENSIONS)
       ========================================================= */
    function getFullScreenDimensions() {
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;

      let w = Math.max(window.innerWidth, document.documentElement.clientWidth);
      let h = Math.max(window.innerHeight, document.documentElement.clientHeight);

      if (isStandalone && window.screen) {
        const isPortrait = window.innerHeight >= window.innerWidth;
        const screenH = isPortrait
          ? Math.max(window.screen.height, window.screen.width)
          : Math.min(window.screen.height, window.screen.width);

        h = Math.max(h, screenH);
      }

      return { w, h };
    }

    function resize() {
      const { w, h } = getFullScreenDimensions();
      if (!w || !h) return;

      document.documentElement.style.height = `${h}px`;
      document.body.style.height = `${h}px`;
      app.style.height = `${h}px`;
      stage.style.height = `${h}px`;
      visibleCanvas.style.height = `${h}px`;

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = w;
      height = h;

      const pixelWidth = Math.max(1, Math.round(width * dpr));
      const pixelHeight = Math.max(1, Math.round(height * dpr));

      visibleCanvas.width = pixelWidth;
      visibleCanvas.height = pixelHeight;
      sceneCanvas.width = pixelWidth;
      sceneCanvas.height = pixelHeight;

      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      const aspectRatio = 0.72;
      cardWidth = pixelWidth * (isMobile ? 0.94 : 0.74);
      cardHeight = cardWidth / aspectRatio;

      const maxCardHeight = pixelHeight * (isMobile ? 0.62 : 0.66);
      if (cardHeight > maxCardHeight) {
        cardHeight = maxCardHeight;
        cardWidth = cardHeight * aspectRatio;
      }

      const cardGap = (isMobile ? 250 : 50) * dpr;
      slot = cardHeight + cardGap;

      cardCenterY = pixelHeight * (isMobile ? 0.45 : 0.53);

      buildItemSnapshots();

      if (gl) {
        gl.viewport(0, 0, pixelWidth, pixelHeight);
      }

      resizeGlassCanvas();
      lastIdleDrawnKey = "";
      if (activeTab === 2) {
        bgSliderCtrl.sync(bgPresetIndex);
        frameSliderCtrl.sync(frameFinishIndex);
      }
    }

    function resizeGlassCanvas() {
      const baseW = liquidNav.offsetWidth || Math.min(344, width - 32);
      const baseH = liquidNav.offsetHeight || 64;
      const newWidth = Math.max(1, Math.round((baseW + 28) * dpr));
      const newHeight = Math.max(1, Math.round((baseH + 52) * dpr));

      if (glassCanvas.width !== newWidth || glassCanvas.height !== newHeight) {
        glassCanvas.width = newWidth;
        glassCanvas.height = newHeight;
        navOpticsBuffer.width = newWidth;
        navOpticsBuffer.height = newHeight;
        glassImageData = glassCtx.createImageData(newWidth, newHeight);
        lastIdleDrawnKey = "";
      }
    }

    /* =========================================================
       DYNAMIC BACKGROUND SAMPLING FOR NAVBAR (ONLY WHEN LENS IS ACTIVE)
       ========================================================= */
    function drawDynamicNavBackdrop(
      octx,
      sourceLeft,
      sourceTop,
      sourceWidth,
      sourceHeight,
      lensWidth,
      lensHeight
    ) {
      if (activeTab === 0) {
        octx.drawImage(
          sceneCanvas,
          sourceLeft,
          sourceTop,
          sourceWidth,
          sourceHeight,
          0,
          0,
          lensWidth,
          lensHeight
        );
      } else if (activeTab === 1) {
        if (cameraStream && cameraVideo.videoWidth > 0 && cameraVideo.videoHeight > 0) {
          const vw = cameraVideo.videoWidth;
          const vh = cameraVideo.videoHeight;
          const screenW = sceneCanvas.width;
          const screenH = sceneCanvas.height;
          const videoAspect = vw / vh;
          const screenAspect = screenW / screenH;

          let drawW = screenW;
          let drawH = screenH;
          let offX = 0;
          let offY = 0;

          if (videoAspect > screenAspect) {
            drawW = screenH * videoAspect;
            offX = (screenW - drawW) / 2;
          } else {
            drawH = screenW / videoAspect;
            offY = (screenH - drawH) / 2;
          }

          const sx = ((sourceLeft - offX) / drawW) * vw;
          const sy = ((sourceTop - offY) / drawH) * vh;
          const sw = (sourceWidth / drawW) * vw;
          const sh = (sourceHeight / drawH) * vh;

          octx.save();
          if (facingMode === "user") {
            octx.translate(lensWidth, 0);
            octx.scale(-1, 1);
            octx.drawImage(cameraVideo, vw - sx - sw, sy, sw, sh, 0, 0, lensWidth, lensHeight);
          } else {
            octx.drawImage(cameraVideo, sx, sy, sw, sh, 0, 0, lensWidth, lensHeight);
          }
          octx.restore();
        } else {
          octx.fillStyle = "#0b1622";
          octx.fillRect(0, 0, lensWidth, lensHeight);
        }
      } else {
        const presets = getBackgroundPresets(capturedPalette);
        const preset = presets[bgPresetIndex] || presets[0];

        if (preset.type === "photo" && images.length) {
          const activeIndex = wrapIndex(Math.round(scroll));
          const blurSnap = backdropSnapshots[activeIndex];
          if (blurSnap) {
            const scaleX = blurSnap.width / sceneCanvas.width;
            const scaleY = blurSnap.height / sceneCanvas.height;
            octx.drawImage(
              blurSnap,
              sourceLeft * scaleX,
              sourceTop * scaleY,
              sourceWidth * scaleX,
              sourceHeight * scaleY,
              0,
              0,
              lensWidth,
              lensHeight
            );
            octx.fillStyle = "rgba(6, 12, 20, 0.35)";
            octx.fillRect(0, 0, lensWidth, lensHeight);
            return;
          }
        }

        const grad = octx.createLinearGradient(0, 0, lensWidth, lensHeight);
        grad.addColorStop(0, preset.c2 || "#121e2b");
        grad.addColorStop(1, preset.c3 || "#071019");
        octx.fillStyle = grad;
        octx.fillRect(0, 0, lensWidth, lensHeight);
      }
    }

    /* =========================================================
       DRAW SHARP TAB ICONS & LABELS
       ========================================================= */
    function drawTabVectorIcon(octx, tabIdx, cx, cy, s) {
      octx.beginPath();
      if (tabIdx === 0) {
        const box = 7 * s;
        const gap = 3.5 * s;
        const r = 1.8 * s;
        octx.roundRect(cx - box - gap * 0.5, cy - box - gap * 0.5, box, box, r);
        octx.roundRect(cx + gap * 0.5, cy - box - gap * 0.5, box, box, r);
        octx.roundRect(cx + gap * 0.5, cy + gap * 0.5, box, box, r);
        octx.roundRect(cx - box - gap * 0.5, cy + gap * 0.5, box, box, r);
        octx.stroke();
      } else if (tabIdx === 1) {
        const w = 18 * s;
        const h = 13 * s;
        const topY = cy - h * 0.5 + 1.5 * s;
        octx.roundRect(cx - w * 0.5, topY, w, h, 3 * s);
        octx.moveTo(cx - 4.5 * s, topY);
        octx.lineTo(cx - 2.8 * s, topY - 2.6 * s);
        octx.lineTo(cx + 2.8 * s, topY - 2.6 * s);
        octx.lineTo(cx + 4.5 * s, topY);
        octx.stroke();

        octx.beginPath();
        octx.arc(cx, topY + h * 0.52, 3.1 * s, 0, Math.PI * 2);
        octx.stroke();
      } else {
        const w = 13.5 * s;
        const h = 19 * s;
        octx.roundRect(cx - w * 0.5, cy - h * 0.5, w, h, 2.8 * s);
        octx.moveTo(cx - 1.2 * s, cy + h * 0.5 - 3.2 * s);
        octx.lineTo(cx + 1.2 * s, cy + h * 0.5 - 3.2 * s);
        octx.stroke();
      }
    }

    function drawTabLabelsAndIcons(targetCtx, padX, padY, navW, navH, pillCenterX, pillCenterY, pillHalfW, pillHalfH) {
      const insetPx = 5 * dpr;
      const tabW = (navW - insetPx * 2) / 3;
      const labels = ["Explore", "Snap", "Mockup"];
      const iconY = padY + navH * 0.38;
      const textY = padY + navH * 0.75;

      // 1. Ikon & Teks Putih di Luar Pill
      targetCtx.save();
      targetCtx.strokeStyle = "rgba(255, 255, 255, 0.94)";
      targetCtx.fillStyle = "rgba(255, 255, 255, 0.94)";
      targetCtx.lineWidth = 1.85 * dpr;
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";
      targetCtx.font = `600 ${Math.round(10.5 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      targetCtx.textAlign = "center";
      targetCtx.textBaseline = "middle";

      for (let i = 0; i < 3; i++) {
        const cx = padX + insetPx + (i + 0.5) * tabW;
        drawTabVectorIcon(targetCtx, i, cx, iconY, dpr);
        targetCtx.fillText(labels[i], cx, textY);
      }
      targetCtx.restore();

      // 2. Ikon & Teks Berwarna Ekstraksi Foto di Dalam Pill
      targetCtx.save();
      drawRoundedRect(
        targetCtx,
        pillCenterX - pillHalfW * 0.95,
        pillCenterY - pillHalfH * 0.95,
        pillHalfW * 1.90,
        pillHalfH * 1.90,
        pillHalfH * 0.95
      );
      targetCtx.clip();
      targetCtx.clearRect(
        pillCenterX - pillHalfW,
        pillCenterY - pillHalfH,
        pillHalfW * 2,
        pillHalfH * 2
      );

      const accentColor = `rgb(${currentAccentRgb.join(",")})`;
      targetCtx.strokeStyle = accentColor;
      targetCtx.fillStyle = accentColor;
      targetCtx.lineWidth = 2.0 * dpr;
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";
      targetCtx.font = `680 ${Math.round(10.6 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      targetCtx.textAlign = "center";
      targetCtx.textBaseline = "middle";

      for (let i = 0; i < 3; i++) {
        const cx = padX + insetPx + (i + 0.5) * tabW;
        drawTabVectorIcon(targetCtx, i, cx, iconY, dpr);
        targetCtx.fillText(labels[i], cx, textY);
      }
      targetCtx.restore();
    }

    function renderOpticalNavSource(
      sourceLeft,
      sourceTop,
      sourceWidth,
      sourceHeight,
      lensWidth,
      lensHeight,
      padX,
      padY,
      navW,
      navH,
      pillCenterX,
      pillCenterY,
      pillHalfW,
      pillHalfH
    ) {
      navOpticsCtx.clearRect(0, 0, lensWidth, lensHeight);

      drawDynamicNavBackdrop(
        navOpticsCtx,
        sourceLeft,
        sourceTop,
        sourceWidth,
        sourceHeight,
        lensWidth,
        lensHeight
      );

      // Bingkai garis tipis navbar di dalam optical buffer agar melengkung cair saat dilewati lensa
      navOpticsCtx.save();
      drawRoundedRect(navOpticsCtx, padX, padY, navW, navH, navH * 0.5);
      navOpticsCtx.lineWidth = 1.0 * dpr;
      navOpticsCtx.strokeStyle = "rgba(255, 255, 255, 0.24)";
      navOpticsCtx.stroke();
      navOpticsCtx.restore();

      const insetPx = 5 * dpr;
      const tabW = (navW - insetPx * 2) / 3;
      const labels = ["Explore", "Snap", "Mockup"];
      const iconY = padY + navH * 0.38;
      const textY = padY + navH * 0.75;

      // 1. Ikon & Teks Putih di Luar Pill
      navOpticsCtx.save();
      navOpticsCtx.strokeStyle = "rgba(255, 255, 255, 0.94)";
      navOpticsCtx.fillStyle = "rgba(255, 255, 255, 0.94)";
      navOpticsCtx.lineWidth = 1.85 * dpr;
      navOpticsCtx.lineCap = "round";
      navOpticsCtx.lineJoin = "round";
      navOpticsCtx.font = `600 ${Math.round(10.5 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      navOpticsCtx.textAlign = "center";
      navOpticsCtx.textBaseline = "middle";

      for (let i = 0; i < 3; i++) {
        const cx = padX + insetPx + (i + 0.5) * tabW;
        drawTabVectorIcon(navOpticsCtx, i, cx, iconY, dpr);
        navOpticsCtx.fillText(labels[i], cx, textY);
      }
      navOpticsCtx.restore();

      // 2. Ikon & Teks Berwarna Ekstraksi Foto di Dalam Pill
      navOpticsCtx.save();
      drawRoundedRect(
        navOpticsCtx,
        pillCenterX - pillHalfW * 0.95,
        pillCenterY - pillHalfH * 0.95,
        pillHalfW * 1.90,
        pillHalfH * 1.90,
        pillHalfH * 0.95
      );
      navOpticsCtx.clip();

      drawDynamicNavBackdrop(
        navOpticsCtx,
        sourceLeft,
        sourceTop,
        sourceWidth,
        sourceHeight,
        lensWidth,
        lensHeight
      );

      drawRoundedRect(navOpticsCtx, padX, padY, navW, navH, navH * 0.5);
      navOpticsCtx.lineWidth = 1.0 * dpr;
      navOpticsCtx.strokeStyle = "rgba(255, 255, 255, 0.28)";
      navOpticsCtx.stroke();

      const accentColor = `rgb(${currentAccentRgb.join(",")})`;
      navOpticsCtx.strokeStyle = accentColor;
      navOpticsCtx.fillStyle = accentColor;
      navOpticsCtx.lineWidth = 2.0 * dpr;
      navOpticsCtx.lineCap = "round";
      navOpticsCtx.lineJoin = "round";
      navOpticsCtx.font = `680 ${Math.round(10.6 * dpr)}px -apple-system, BlinkMacSystemFont, sans-serif`;
      navOpticsCtx.textAlign = "center";
      navOpticsCtx.textBaseline = "middle";

      for (let i = 0; i < 3; i++) {
        const cx = padX + insetPx + (i + 0.5) * tabW;
        drawTabVectorIcon(navOpticsCtx, i, cx, iconY, dpr);
        navOpticsCtx.fillText(labels[i], cx, textY);
      }
      navOpticsCtx.restore();
    }

    /* =========================================================
       REAL-TIME LIQUID WATER OPTICS
       - IDLE: 100% Lensa OFF (Hanya ikon & teks bening, backdrop CSS asli terlihat murni)
       - SLIDE / UPWARD PULL: Lensa air aktif dengan gelombang riak & dispersi RGB tipis
       ========================================================= */
    function drawLiquidNavRefraction() {
      if (!sceneCanvas.width) return;

      resizeGlassCanvas();

      const lensWidth = glassCanvas.width;
      const lensHeight = glassCanvas.height;
      if (!lensWidth || !lensHeight || !glassImageData) return;

      const padX = 14 * dpr;
      const padY = 26 * dpr;
      const navW = lensWidth - padX * 2;
      const navH = lensHeight - padY * 2;
      const insetPx = 5 * dpr;
      const tabW = (navW - insetPx * 2) / 3;

      const { scaleX, scaleY } = getLiquidPillShape();

      const pillHalfW = (tabW * scaleX) * 0.5;
      const pillHalfH = ((navH - insetPx * 2) * scaleY) * 0.5;
      const pillCenterX = padX + insetPx + (pillPos + 0.5) * tabW;
      const pillCenterY = lensHeight * 0.5 + pillLiftY * dpr;

      const act = lensActivity;

      // 100% IDLE: Lensa OFF sepenuhnya! Tidak menggambar piksel latar belakang/pembiasan apa pun,
      // hanya ikon dan teks tajam di atas CSS Liquid Glass asli.
      if (act <= 0.002) {
        const idleKey = `${pillTarget}|${currentAccentRgb.join(",")}|${lensWidth}x${lensHeight}`;
        if (lastIdleDrawnKey === idleKey) return;
        lastIdleDrawnKey = idleKey;

        glassCtx.clearRect(0, 0, lensWidth, lensHeight);
        drawTabLabelsAndIcons(
          glassCtx,
          padX,
          padY,
          navW,
          navH,
          pillCenterX,
          lensHeight * 0.5,
          tabW * 0.5,
          (navH - insetPx * 2) * 0.5
        );
        return;
      }

      lastIdleDrawnKey = "";

      // AKTIF SAAT DISLIDE / DITARIK KE ATAS:
      const dockRect = liquidNav.getBoundingClientRect();
      const left = Math.round((dockRect.left - 14) * dpr);
      const top = Math.round((dockRect.top - 26) * dpr);
      const dispW = Math.round((dockRect.width + 28) * dpr);
      const dispH = Math.round((dockRect.height + 52) * dpr);

      const sourceLeft = Math.max(0, Math.min(sceneCanvas.width - 1, left));
      const sourceTop = Math.max(0, Math.min(sceneCanvas.height - 1, top));
      const sourceWidth = Math.max(1, Math.min(sceneCanvas.width - sourceLeft, dispW));
      const sourceHeight = Math.max(1, Math.min(sceneCanvas.height - sourceTop, dispH));

      renderOpticalNavSource(
        sourceLeft,
        sourceTop,
        sourceWidth,
        sourceHeight,
        lensWidth,
        lensHeight,
        padX,
        padY,
        navW,
        navH,
        pillCenterX,
        pillCenterY,
        pillHalfW,
        pillHalfH
      );

      let source;
      try {
        source = navOpticsCtx.getImageData(0, 0, lensWidth, lensHeight).data;
      } catch (error) {
        glassCtx.clearRect(0, 0, lensWidth, lensHeight);
        return;
      }

      const output = glassImageData.data;

      const barHalfW = navW * 0.5;
      const barHalfH = navH * 0.5;
      const barCornerR = barHalfH;
      const barBoxX = Math.max(0, barHalfW - barCornerR);

      const cornerR = Math.min(pillHalfW, pillHalfH);
      const boxHalfX = Math.max(0, pillHalfW - cornerR);
      const boxHalfY = Math.max(0, pillHalfH - cornerR);

      // Riak air (liquid surface ripple) saat digeser & ditarik ke atas
      const waveAmp = (Math.min(1.4, Math.abs(pillVel) * 0.08 + Math.abs(navWobble) * 0.45 + Math.abs(navLiftY) * 0.03)) * dpr * act;
      const phase = waterPhase;

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      for (let y = 0; y < lensHeight; y++) {
        const dyBar = y - lensHeight * 0.5;
        const oyBar = Math.abs(dyBar);
        const oyBar2 = oyBar * oyBar;

        const dyPill = y - pillCenterY;
        const qyPill = Math.abs(dyPill) - boxHalfY;
        const oyPill = qyPill > 0 ? qyPill : 0;
        const oyPill2 = oyPill * oyPill;

        for (let x = 0; x < lensWidth; x++) {
          const outIndex = (y * lensWidth + x) * 4;

          // Riak permukaan air halus pada batas kapsul agar melengkung cair (bukan gelembung kaku)
          const dxPill = x - pillCenterX;
          const surfaceRipple = waveAmp * Math.sin(dxPill * 0.065 + phase) * Math.cos(dyPill * 0.08 - phase * 0.7);

          const dxBar = x - lensWidth * 0.5;
          const qxBar = Math.abs(dxBar) - barBoxX;
          const oxBar = qxBar > 0 ? qxBar : 0;
          const sdfBar = Math.sqrt(oxBar * oxBar + oyBar2) + Math.min(Math.max(qxBar, oyBar), 0) - barCornerR;

          const qxPill = Math.abs(dxPill) - boxHalfX;
          const oxPill = qxPill > 0 ? qxPill : 0;
          const sdfPill = Math.sqrt(oxPill * oxPill + oyPill2) + Math.min(Math.max(qxPill, qyPill), 0) - cornerR + surfaceRipple * 0.45;

          const unionSdf = Math.min(sdfBar, sdfPill);
          if (unionSdf > 1.5 * dpr) {
            output[outIndex + 3] = 0;
            continue;
          }

          const alphaMask = 1.0 - smoothstep(-1.0 * dpr, 1.5 * dpr, unionSdf);

          let shiftX = 0;
          let shiftY = 0;
          let dispX = 0;
          let dispY = 0;

          if (sdfPill <= 1.2 * dpr) {
            const u = Math.max(0, Math.min(1, 1.0 + sdfPill / cornerR));
            const lipBend = Math.pow(u, 4.2);

            const nx = dxPill / pillHalfW;
            const ny = dyPill / pillHalfH;

            // Pembiasan air mengalir (water flow refraction + edge meniscus curve)
            shiftX = (-dxPill * 0.13 * (1.0 - lipBend) - nx * lipBend * 8.0 * dpr + surfaceRipple * 0.65) * act;
            shiftY = (-dyPill * 0.13 * (1.0 - lipBend) - ny * lipBend * 6.5 * dpr + surfaceRipple * 0.85) * act;

            dispX = nx * lipBend * 1.65 * dpr * act;
            dispY = ny * lipBend * 1.30 * dpr * act;
          }

          const baseX = x + shiftX;
          const baseY = y + shiftY;

          output[outIndex] = sampleBilinearChannel(source, lensWidth, lensHeight, baseX + dispX, baseY + dispY, 0);
          output[outIndex + 1] = sampleBilinearChannel(source, lensWidth, lensHeight, baseX, baseY, 1);
          output[outIndex + 2] = sampleBilinearChannel(source, lensWidth, lensHeight, baseX - dispX, baseY - dispY, 2);
          output[outIndex + 3] = Math.round(alphaMask * 255);
        }
      }

      glassCtx.putImageData(glassImageData, 0, 0);
    }

    function getOffset(index) {
      const count = items.length;
      let offset = index - scroll;
      offset = ((offset + count / 2) % count + count) % count - count / 2;
      return offset;
    }

    function drawScene() {
      const pixelWidth = sceneCanvas.width;
      const pixelHeight = sceneCanvas.height;

      const background = ctx.createLinearGradient(0, 0, pixelWidth, pixelHeight);
      background.addColorStop(0, "#1d2d3b");
      background.addColorStop(0.52, "#182838");
      background.addColorStop(1, "#07121e");
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      const activeIndex = wrapIndex(Math.round(scroll));

      if (activeIndex !== lastAppliedPaletteIndex && itemPalettes[activeIndex]) {
        lastAppliedPaletteIndex = activeIndex;
        applyNavMaterialYouPalette(itemPalettes[activeIndex]);
      }

      const activeBackdrop = backdropSnapshots[activeIndex];

      if (activeBackdrop) {
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.drawImage(activeBackdrop, 0, 0, pixelWidth, pixelHeight);
        ctx.restore();

        ctx.fillStyle = "rgba(5, 14, 22, 0.22)";
        ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      }

      const centerX = pixelWidth / 2;
      const centerY = cardCenterY;

      const visibleItems = items
        .map((item, index) => ({ index, offset: getOffset(index) }))
        .filter(({ offset }) => Math.abs(offset) <= 2.6)
        .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

      visibleItems.forEach(({ index, offset }) => {
        const distance = Math.abs(offset);
        const scale = 1 - Math.min(distance, 1) * 0.08;
        const w = cardWidth * scale;
        const h = cardHeight * scale;
        const x = centerX - w / 2;
        const y = centerY + offset * slot - h / 2;
        const snapshot = itemSnapshots[index];

        if (!snapshot) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0.55, 1 - distance * 0.14);

        ctx.shadowColor = "rgba(0, 0, 0, 0.36)";
        ctx.shadowBlur = 26 * dpr;
        ctx.shadowOffsetY = 10 * dpr;

        ctx.drawImage(snapshot, x, y, w, h);

        ctx.restore();
      });

      counter.textContent = `${activeIndex + 1} / ${items.length}`;
    }

    function uploadSceneTexture() {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        sceneCanvas
      );
    }

    function renderWebGLScene(now) {
      drawScene();
      uploadSceneTexture();

      gl.useProgram(program);
      gl.uniform1i(uniforms.scene, 0);
      gl.uniform2f(
        uniforms.resolution,
        visibleCanvas.width,
        visibleCanvas.height
      );
      gl.uniform2f(
        uniforms.cardCenter,
        0.5,
        1.0 - cardCenterY / visibleCanvas.height
      );
      gl.uniform2f(uniforms.cardSize, cardWidth, cardHeight);
      gl.uniform1f(uniforms.time, now / 1000);

      gl.clearColor(11 / 255, 24 / 255, 36 / 255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function renderFrame(time) {
      const now = time || performance.now();

      if (!previousFrameTime) previousFrameTime = now;
      const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
      previousFrameTime = now;

      if (!dragging) {
        const stiffness = 170;
        const damping = 2 * Math.sqrt(stiffness) * 0.92;

        velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
        scroll += velocity * dt;

        if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
          scroll = target;
          velocity = 0;
        }
      }

      updateLiquidPillPhysics(dt);

      if (activeTab === 0) {
        renderWebGLScene(now);
      } else if (activeTab === 2) {
        bgSliderCtrl.renderOptics();
        frameSliderCtrl.renderOptics();
      }

      drawLiquidNavRefraction();

      requestAnimationFrame(renderFrame);
    }

    function moveBy(direction) {
      target = Math.round(scroll) + direction;
      velocity = 0;
    }

    stage.addEventListener("pointerdown", (event) => {
      if (activeTab !== 0) return;
      if (event.button !== undefined && event.button !== 0) return;

      dragging = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);

      dragStartY = event.clientY;
      dragStartScroll = scroll;
      lastPointerY = event.clientY;
      lastPointerTime = performance.now();
      pointerVelocity = 0;
      velocity = 0;
      target = scroll;
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const now = performance.now();
      const elapsed = Math.max(1, now - lastPointerTime);
      const dy = event.clientY - dragStartY;

      scroll = dragStartScroll - (dy * dpr) / slot;
      target = scroll;

      pointerVelocity =
        (-(event.clientY - lastPointerY) * dpr / slot) /
        (elapsed / 1000);

      lastPointerY = event.clientY;
      lastPointerTime = now;
    });

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      stage.classList.remove("dragging");

      const projected = scroll + pointerVelocity * 0.16;
      target = Math.round(projected);

      if (Math.abs(pointerVelocity) > 1.1) {
        target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
      }

      velocity = pointerVelocity;
    }

    stage.addEventListener("pointerup", finishDrag);
    stage.addEventListener("pointercancel", finishDrag);

    stage.addEventListener("wheel", (event) => {
      if (activeTab !== 0) return;
      event.preventDefault();

      const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
        ? event.deltaY
        : event.deltaX;

      if (!delta) return;

      wheelDelta += delta;
      window.clearTimeout(wheelTimer);

      wheelTimer = window.setTimeout(() => {
        const direction = Math.sign(wheelDelta);
        const steps = Math.min(
          items.length,
          Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
        );

        if (direction) {
          target = Math.round(scroll) + direction * steps;
          velocity = 0;
        }

        wheelDelta = 0;
      }, 100);
    }, { passive: false });

    document.addEventListener("keydown", (event) => {
      if (activeTab !== 0) return;
      if (event.key === "ArrowDown") moveBy(1);
      if (event.key === "ArrowUp") moveBy(-1);
    });

    async function init() {
      gl = visibleCanvas.getContext("webgl2", {
        alpha: false,
        antialias: true,
        preserveDrawingBuffer: true
      });

      if (!gl) {
        stage.innerHTML =
          "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
        return;
      }

      try {
        images = await Promise.all(items.map((item) => loadImage(item.image)));

        program = createProgram();
        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());

        sceneTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        uniforms = {
          scene: gl.getUniformLocation(program, "uScene"),
          resolution: gl.getUniformLocation(program, "uResolution"),
          cardCenter: gl.getUniformLocation(program, "uCardCenter"),
          cardSize: gl.getUniformLocation(program, "uCardSize"),
          time: gl.getUniformLocation(program, "uTime")
        };

        resize();
        setTimeout(resize, 100);
        setTimeout(resize, 400);
        requestAnimationFrame(renderFrame);
      } catch (error) {
        console.error(error);
        stage.innerHTML =
          "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
      }
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    window.visualViewport?.addEventListener("resize", resize);

    init();
  </script>
</body>
</html>
