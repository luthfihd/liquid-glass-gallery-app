<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1824">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liquid Glass Gallery">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Liquid%20Glass%20Gallery","short_name":"Gallery","display":"fullscreen","background_color":"%230b1824","theme_color":"%230b1824"}'>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Liquid Glass Gallery</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1824;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100lvh;
      background-color: #0b1824;
      color: #f3f8ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100lvh;
      overflow: hidden;
      background: #0b1824;
    }

    .stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .stage.dragging {
      cursor: grabbing;
    }

    #gl {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: fixed;
      z-index: 3;
      top: auto;
      bottom: max(16px, calc(10px + env(safe-area-inset-bottom, 0px)));
      left: 14px;
      right: 14px;
      min-height: 72px;
      padding: 9px 11px 9px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: transparent;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.16);
      pointer-events: auto;
    }

    #glassLens {
      position: absolute;
      z-index: -1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
    }

    .topbar h1,
    .top-actions {
      position: relative;
      z-index: 1;
    }

    .topbar h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.055em;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .chevron {
      display: inline-block;
      margin-left: 4px;
      font-size: 0.72em;
      vertical-align: 0.12em;
    }

    .top-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .add-button,
    .avatar {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 50%;
    }

    .add-button {
      display: grid;
      place-items: center;
      padding: 0 0 4px;
      color: white;
      font: inherit;
      font-size: 2rem;
      line-height: 1;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .add-button:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.22);
    }

    .avatar {
      display: block;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.12);
    }

    #photoInput,
    #counter {
      display: none;
    }

    @media (max-width: 600px) {
      .topbar {
        left: 12px;
        right: 12px;
      }

      .topbar h1 {
        font-size: clamp(1.35rem, 6.5vw, 1.9rem);
      }

      .add-button,
      .avatar {
        width: 42px;
        height: 42px;
      }
    }

    @media (max-width: 360px) {
      .topbar {
        left: 9px;
        right: 9px;
        padding-left: 15px;
        padding-right: 8px;
      }

      .topbar h1 {
        font-size: 1.28rem;
      }

      .top-actions {
        gap: 6px;
      }

      .add-button,
      .avatar {
        width: 39px;
        height: 39px;
      }
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <section class="stage" id="stage" aria-label="Galeri foto vertikal">
      <canvas id="gl"></canvas>
    </section>

    <header class="topbar" id="topbar">
      <canvas id="glassLens" aria-hidden="true"></canvas>

      <h1>Upcoming <span class="chevron">⌄</span></h1>

      <div class="top-actions">
        <button class="add-button" id="addButton" type="button" aria-label="Tambah foto preview">+</button>
        <img
          class="avatar"
          id="avatarImg"
          src="https://images.unsplash.com/photo-1793605300952-49cbebdc3d49?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
          alt=""
        >
      </div>
    </header>

    <!-- Input file tersembunyi untuk session preview dari galeri -->
    <input type="file" id="photoInput" accept="image/*" multiple>

    <span id="counter" aria-live="polite">1 / 5</span>
  </main>

  <script>
    const items = [
      {
        image: "https://images.unsplash.com/photo-1793605300952-49cbebdc3d49?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://images.unsplash.com/photo-1793363562541-f27fa7e52688?q=80&w=2340&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://images.unsplash.com/photo-1793443196021-12939c7dac83?q=80&w=1365&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://plus.unsplash.com/premium_photo-1792411651238-b1ad8610446b?q=80&w=1285&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      },
      {
        image: "https://plus.unsplash.com/premium_photo-1792949574922-fc83c916d106?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
      }
    ];

    const app = document.getElementById("app");
    const stage = document.getElementById("stage");
    const visibleCanvas = document.getElementById("gl");
    const counter = document.getElementById("counter");
    const glassCanvas = document.getElementById("glassLens");
    const topbar = document.getElementById("topbar");
    const addButton = document.getElementById("addButton");
    const photoInput = document.getElementById("photoInput");

    const sceneCanvas = document.createElement("canvas");
    const ctx = sceneCanvas.getContext("2d");
    const glassCtx = glassCanvas.getContext("2d", { willReadFrequently: true });

    let gl;
    let program;
    let sceneTexture;
    let uniforms;
    let images = [];
    let itemSnapshots = [];
    const sessionObjectUrls = [];

    let width = 0;
    let height = 0;
    let dpr = 1;

    let cardWidth = 0;
    let cardHeight = 0;
    let slot = 0;
    let cardCenterY = 0;

    let scroll = 0;
    let target = 0;
    let velocity = 0;
    let dragging = false;

    let dragStartY = 0;
    let dragStartScroll = 0;
    let lastPointerY = 0;
    let lastPointerTime = 0;
    let pointerVelocity = 0;
    let previousFrameTime = 0;
    let liquidMotion = 0;

    let wheelDelta = 0;
    let wheelTimer = 0;
    let lastGlassDraw = 0;
    let glassImageData = null;

    const wrapIndex = (index) =>
      ((index % items.length) + items.length) % items.length;

    const vertexSource = `#version 300 es
      precision highp float;

      void main() {
        vec2 point = vec2(
          float((gl_VertexID << 1) & 2),
          float(gl_VertexID & 2)
        );
        gl_Position = vec4(point * 2.0 - 1.0, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      out vec4 outColor;

      uniform sampler2D uScene;
      uniform vec2 uResolution;
      uniform vec4 uLensBox;
      uniform float uLensRadius;
      uniform float uTime;
      uniform float uMotion;
      uniform float uDirection;

      float sdRoundedBox(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      vec4 sampleScene(vec2 uv) {
        return texture(uScene, clamp(uv, 0.001, 0.999));
      }

      void main() {
        vec2 fragPos = gl_FragCoord.xy;
        vec2 uv = fragPos / uResolution;

        vec2 p = fragPos - uLensBox.xy;
        vec2 halfSize = uLensBox.zw;
        float dist = sdRoundedBox(p, halfSize, uLensRadius);

        vec2 normP = p / max(halfSize, vec2(1.0));
        float radialDist = length(normP);

        float bevelWidth = 46.0 + uMotion * 38.0;
        float rimZone = exp(-abs(dist) / bevelWidth);
        float insideLens = 1.0 - smoothstep(-6.0, 6.0, dist);

        vec2 eps = vec2(2.0, 0.0);
        vec2 grad = normalize(vec2(
          sdRoundedBox(p + eps.xy, halfSize, uLensRadius) - sdRoundedBox(p - eps.xy, halfSize, uLensRadius),
          sdRoundedBox(p + eps.yx, halfSize, uLensRadius) - sdRoundedBox(p - eps.yx, halfSize, uLensRadius)
        ) + vec2(0.0001));

        float pullStrength = (18.0 + uMotion * 54.0);
        float innerBulge = insideLens * pow(clamp(radialDist, 0.0, 1.2), 2.4) * (10.0 + uMotion * 22.0);
        float edgeRefract = rimZone * pullStrength;

        float wave = sin(normP.x * 9.0 + uTime * 3.0) * 0.5 + sin(normP.x * 17.0 - uTime * 2.1) * 0.3;
        float ripple = wave * rimZone * (2.5 + uMotion * 14.0);

        vec2 refractOffset = (grad * (edgeRefract + innerBulge) + vec2(0.0, uDirection * ripple)) / uResolution;

        float dispersion = (0.0022 + uMotion * 0.0065) * rimZone;
        vec2 dispDir = grad * dispersion;

        vec2 sampleUV = uv - refractOffset;

        vec4 color;
        color.r = sampleScene(sampleUV - dispDir).r;
        color.g = sampleScene(sampleUV).g;
        color.b = sampleScene(sampleUV + dispDir).b;
        color.a = 1.0;

        float outsideBlur = (1.0 - insideLens) * exp(-max(dist, 0.0) / 140.0) * (0.35 + uMotion * 0.55);
        if (outsideBlur > 0.01) {
          vec2 bOff = vec2(0.004, 0.014) * (0.6 + uMotion);
          vec3 frosted =
            0.36 * sampleScene(sampleUV).rgb +
            0.18 * sampleScene(sampleUV + vec2(0.0, bOff.y)).rgb +
            0.18 * sampleScene(sampleUV - vec2(0.0, bOff.y)).rgb +
            0.14 * sampleScene(sampleUV + vec2(bOff.x, 0.0)).rgb +
            0.14 * sampleScene(sampleUV - vec2(bOff.x, 0.0)).rgb;
          color.rgb = mix(color.rgb, frosted, clamp(outsideBlur, 0.0, 0.75));
        }

        float fresnelLine = exp(-abs(dist) / 3.2);
        float lightAngle = clamp(0.55 + normP.y * 0.45 - normP.x * 0.15, 0.15, 1.0);
        vec3 glassRim = vec3(0.75, 0.85, 0.96) * fresnelLine * lightAngle * (0.28 + uMotion * 0.32);
        color.rgb += glassRim;

        outColor = color;
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || "Shader gagal dikompilasi.");
      }

      return shader;
    }

    function createProgram() {
      const vertex = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      const result = gl.createProgram();

      gl.attachShader(result, vertex);
      gl.attachShader(result, fragment);
      gl.linkProgram(result);

      if (!gl.getProgramParameter(result, gl.LINK_STATUS)) {
        throw new Error(
          gl.getProgramInfoLog(result) || "Program WebGL gagal dibuat."
        );
      }

      return result;
    }

    function loadImage(url, isBlob = false) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        if (!isBlob) {
          image.crossOrigin = "anonymous";
        }
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Gagal memuat gambar: ${url}`));
        image.src = url;
      });
    }

    function drawRoundedRect(context, x, y, w, h, radius) {
      const r = Math.min(radius, w / 2, h / 2);

      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + w, y, x + w, y + h, r);
      context.arcTo(x + w, y + h, x, y + h, r);
      context.arcTo(x, y + h, x, y, r);
      context.arcTo(x, y, x + w, y, r);
      context.closePath();
    }

    function drawImageToContext(context, image, x, y, w, h) {
      const imageAspect = image.width / image.height;
      const boxAspect = w / h;

      let sx = 0;
      let sy = 0;
      let sw = image.width;
      let sh = image.height;

      if (imageAspect > boxAspect) {
        sw = image.height * boxAspect;
        sx = (image.width - sw) / 2;
      } else {
        sh = image.width / boxAspect;
        sy = (image.height - sh) / 2;
      }

      context.drawImage(image, sx, sy, sw, sh, x, y, w, h);
    }

    function createSnapshotForImage(image) {
      const w = Math.max(1, Math.round(cardWidth));
      const h = Math.max(1, Math.round(cardHeight));
      const radius = 35 * dpr;

      const snap = document.createElement("canvas");
      snap.width = w;
      snap.height = h;
      const sctx = snap.getContext("2d");

      drawRoundedRect(sctx, 0, 0, w, h, radius);
      sctx.fillStyle = "#263646";
      sctx.fill();

      sctx.save();
      drawRoundedRect(sctx, 0, 0, w, h, radius);
      sctx.clip();

      drawImageToContext(sctx, image, 0, 0, w, h);

      const blurBandHeight = h * 0.30;
      const blurBandY = h - blurBandHeight;

      sctx.save();
      sctx.beginPath();
      sctx.rect(0, blurBandY, w, blurBandHeight);
      sctx.clip();

      const bRadius = 18 * dpr;
      sctx.filter = `blur(${bRadius}px) saturate(1.18)`;
      drawImageToContext(sctx, image, -bRadius, -bRadius, w + bRadius * 2, h + bRadius * 2);
      sctx.restore();

      const shade = sctx.createLinearGradient(0, h * 0.56, 0, h);
      shade.addColorStop(0, "rgba(5, 12, 20, 0)");
      shade.addColorStop(0.55, "rgba(5, 12, 20, 0.14)");
      shade.addColorStop(1, "rgba(5, 12, 20, 0.34)");
      sctx.fillStyle = shade;
      sctx.fillRect(0, 0, w, h);

      sctx.restore();

      const gloss = sctx.createLinearGradient(0, 0, w, h * 0.55);
      gloss.addColorStop(0, "rgba(255,255,255,0.20)");
      gloss.addColorStop(0.38, "rgba(255,255,255,0.04)");
      gloss.addColorStop(1, "rgba(255,255,255,0)");

      drawRoundedRect(sctx, 0, 0, w, h, radius);
      sctx.fillStyle = gloss;
      sctx.fill();

      drawRoundedRect(sctx, 0, 0, w, h, radius);
      sctx.lineWidth = 1.2 * dpr;
      sctx.strokeStyle = "rgba(255,255,255,0.40)";
      sctx.stroke();

      return snap;
    }

    function buildItemSnapshots() {
      if (!images.length || !cardWidth || !cardHeight) return;
      itemSnapshots = images.map((image) => createSnapshotForImage(image));
    }

    // Handler tambah foto dari galeri sebagai session cache preview
    addButton.addEventListener("click", (event) => {
      event.stopPropagation();
      photoInput.click();
    });

    photoInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files || []).filter((file) =>
        file.type.startsWith("image/")
      );
      if (!files.length) return;

      const firstNewIndex = items.length;

      for (const file of files) {
        const objectUrl = URL.createObjectURL(file);
        sessionObjectUrls.push(objectUrl);

        try {
          const loadedImg = await loadImage(objectUrl, true);
          items.push({ image: objectUrl, isSession: true });
          images.push(loadedImg);
          itemSnapshots.push(createSnapshotForImage(loadedImg));
        } catch (err) {
          console.error("Gagal memuat foto preview:", err);
        }
      }

      // Reset input agar file yang sama tetap bisa dipilih lagi jika mau
      photoInput.value = "";

      // Gulir mulus (spring animation) menuju foto pertama yang baru ditambahkan
      if (items.length > firstNewIndex) {
        const currentRound = Math.round(scroll);
        const currentWrapped = wrapIndex(currentRound);
        let diff = firstNewIndex - currentWrapped;
        if (diff <= 0) diff += items.length;
        target = currentRound + diff;
      }
    });

    window.addEventListener("beforeunload", () => {
      sessionObjectUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    function getFullScreenDimensions() {
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;

      let w = Math.max(window.innerWidth, document.documentElement.clientWidth);
      let h = Math.max(window.innerHeight, document.documentElement.clientHeight);

      if (isStandalone && window.screen) {
        const isPortrait = window.innerHeight >= window.innerWidth;
        const screenH = isPortrait
          ? Math.max(window.screen.height, window.screen.width)
          : Math.min(window.screen.height, window.screen.width);

        h = Math.max(h, screenH);
      }

      return { w, h };
    }

    function resize() {
      const { w, h } = getFullScreenDimensions();
      if (!w || !h) return;

      document.documentElement.style.height = `${h}px`;
      document.body.style.height = `${h}px`;
      app.style.height = `${h}px`;
      stage.style.height = `${h}px`;
      visibleCanvas.style.height = `${h}px`;

      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = w;
      height = h;

      const pixelWidth = Math.max(1, Math.round(width * dpr));
      const pixelHeight = Math.max(1, Math.round(height * dpr));

      visibleCanvas.width = pixelWidth;
      visibleCanvas.height = pixelHeight;
      sceneCanvas.width = pixelWidth;
      sceneCanvas.height = pixelHeight;

      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      const aspectRatio = 0.72;
      cardWidth = pixelWidth * (isMobile ? 0.94 : 0.74);
      cardHeight = cardWidth / aspectRatio;

      const maxCardHeight = pixelHeight * (isMobile ? 0.62 : 0.66);
      if (cardHeight > maxCardHeight) {
        cardHeight = maxCardHeight;
        cardWidth = cardHeight * aspectRatio;
      }

      const cardGap = (isMobile ? 120 : 48) * dpr;
      slot = cardHeight + cardGap;

      cardCenterY = pixelHeight * (isMobile ? 0.45 : 0.53);

      buildItemSnapshots();

      if (gl) {
        gl.viewport(0, 0, pixelWidth, pixelHeight);
      }

      resizeGlassCanvas();
    }

    function resizeGlassCanvas() {
      const rect = topbar.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const newWidth = Math.max(1, Math.round(rect.width * dpr));
      const newHeight = Math.max(1, Math.round(rect.height * dpr));

      if (glassCanvas.width !== newWidth || glassCanvas.height !== newHeight) {
        glassCanvas.width = newWidth;
        glassCanvas.height = newHeight;
        glassImageData = glassCtx.createImageData(newWidth, newHeight);
      }
    }

    function drawLiquidPill(now) {
      if (now - lastGlassDraw < 30) return;
      lastGlassDraw = now;

      const rect = topbar.getBoundingClientRect();
      if (!rect.width || !rect.height || !sceneCanvas.width) return;

      resizeGlassCanvas();

      const lensWidth = glassCanvas.width;
      const lensHeight = glassCanvas.height;
      if (!lensWidth || !lensHeight || !glassImageData) return;

      const left = Math.round(rect.left * dpr);
      const top = Math.round(rect.top * dpr);

      const pad = Math.round(14 * dpr);
      const sourceLeft = Math.max(0, left - pad);
      const sourceTop = Math.max(0, top - pad);
      const sourceRight = Math.min(
        sceneCanvas.width,
        left + lensWidth + pad
      );
      const sourceBottom = Math.min(
        sceneCanvas.height,
        top + lensHeight + pad
      );

      const sourceWidth = sourceRight - sourceLeft;
      const sourceHeight = sourceBottom - sourceTop;
      if (sourceWidth <= 0 || sourceHeight <= 0) return;

      let source;
      try {
        source = ctx.getImageData(
          sourceLeft,
          sourceTop,
          sourceWidth,
          sourceHeight
        ).data;
      } catch (error) {
        glassCtx.clearRect(0, 0, lensWidth, lensHeight);
        return;
      }

      const output = glassImageData.data;
      const centerX = lensWidth * 0.5;
      const centerY = lensHeight * 0.5;
      const halfW = Math.max(1, centerX);
      const halfH = Math.max(1, centerY);
      const maxOffset = 11 * dpr;

      function smoothstep(edge0, edge1, value) {
        const t = Math.max(0, Math.min(1, (value - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      function readChannel(x, y, channel) {
        const sx = Math.max(0, Math.min(sourceWidth - 1, x));
        const sy = Math.max(0, Math.min(sourceHeight - 1, y));
        return source[(sy * sourceWidth + sx) * 4 + channel];
      }

      for (let y = 0; y < lensHeight; y++) {
        const ny = (y - centerY) / halfH;

        for (let x = 0; x < lensWidth; x++) {
          const nx = (x - centerX) / halfW;
          const radius = Math.sqrt(nx * nx + ny * ny);

          const cornerRadius = Math.min(lensHeight * 0.5, lensWidth * 0.5);
          const cssX = x / dpr;
          const cssY = y / dpr;
          const cssW = lensWidth / dpr;
          const cssH = lensHeight / dpr;
          const cssRadius = cornerRadius / dpr;

          const qx = Math.abs(cssX - cssW / 2) - (cssW / 2 - cssRadius);
          const qy = Math.abs(cssY - cssH / 2) - (cssH / 2 - cssRadius);
          const outsideCorner =
            Math.max(qx, 0) * Math.max(qx, 0) +
            Math.max(qy, 0) * Math.max(qy, 0) >
            cssRadius * cssRadius;

          const outIndex = (y * lensWidth + x) * 4;

          if (outsideCorner) {
            output[outIndex + 3] = 0;
            continue;
          }

          const edge = smoothstep(0.28, 1.12, radius);
          const displacement = edge * maxOffset;

          const sourceX =
            Math.round(left + x + nx * displacement - sourceLeft);
          const sourceY =
            Math.round(top + y + ny * displacement - sourceTop);

          output[outIndex] = readChannel(sourceX, sourceY, 0);
          output[outIndex + 1] = readChannel(sourceX, sourceY, 1);
          output[outIndex + 2] = readChannel(sourceX, sourceY, 2);
          output[outIndex + 3] = 255;
        }
      }

      glassCtx.putImageData(glassImageData, 0, 0);
    }

    function getOffset(index) {
      const count = items.length;
      let offset = index - scroll;
      offset = ((offset + count / 2) % count + count) % count - count / 2;
      return offset;
    }

    function drawScene() {
      const pixelWidth = sceneCanvas.width;
      const pixelHeight = sceneCanvas.height;

      const background = ctx.createLinearGradient(0, 0, pixelWidth, pixelHeight);
      background.addColorStop(0, "#1d2d3b");
      background.addColorStop(0.52, "#182838");
      background.addColorStop(1, "#07121e");
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, pixelWidth, pixelHeight);

      const activeIndex = wrapIndex(Math.round(scroll));
      const activeImage = images[activeIndex];

      if (activeImage) {
        ctx.save();
        ctx.globalAlpha = 0.78;
        const blurAmount = 32 * dpr;
        const bleed = blurAmount * 2.5;
        ctx.filter = `blur(${blurAmount}px) saturate(1.12)`;

        drawImageToContext(
          ctx,
          activeImage,
          -bleed,
          -bleed,
          pixelWidth + bleed * 2,
          pixelHeight + bleed * 2
        );

        ctx.restore();

        ctx.fillStyle = "rgba(5, 14, 22, 0.24)";
        ctx.fillRect(0, 0, pixelWidth, pixelHeight);
      }

      const centerX = pixelWidth / 2;
      const centerY = cardCenterY;

      const visibleItems = items
        .map((item, index) => ({ index, offset: getOffset(index) }))
        .filter(({ offset }) => Math.abs(offset) <= 2.6)
        .sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset));

      visibleItems.forEach(({ index, offset }) => {
        const distance = Math.abs(offset);
        const scale = 1 - Math.min(distance, 1) * 0.04;
        const w = cardWidth * scale;
        const h = cardHeight * scale;
        const x = centerX - w / 2;
        const y = centerY + offset * slot - h / 2;
        const snapshot = itemSnapshots[index];

        if (!snapshot) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0.75, 1 - distance * 0.14);

        ctx.shadowColor = "rgba(0, 0, 0, 0.42)";
        ctx.shadowBlur = 28 * dpr;
        ctx.shadowOffsetY = 12 * dpr;

        ctx.drawImage(snapshot, x, y, w, h);

        ctx.restore();
      });

      counter.textContent = `${activeIndex + 1} / ${items.length}`;
    }

    function uploadSceneTexture() {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        sceneCanvas
      );
    }

    function renderFrame(time) {
      const now = time || performance.now();

      if (!previousFrameTime) previousFrameTime = now;
      const dt = Math.min((now - previousFrameTime) / 1000, 0.032);
      previousFrameTime = now;

      if (!dragging) {
        const stiffness = 170;
        const damping = 2 * Math.sqrt(stiffness) * 0.92;

        velocity += (-stiffness * (scroll - target) - damping * velocity) * dt;
        scroll += velocity * dt;

        if (Math.abs(target - scroll) < 0.001 && Math.abs(velocity) < 0.01) {
          scroll = target;
          velocity = 0;
        }
      }

      const movementSpeed = dragging
        ? Math.abs(pointerVelocity)
        : Math.abs(velocity);

      const motionTarget = Math.min(1, movementSpeed * 0.42);
      const motionBlend = 1 - Math.exp(-dt * 10);
      liquidMotion += (motionTarget - liquidMotion) * motionBlend;

      drawScene();
      drawLiquidPill(now);
      uploadSceneTexture();

      gl.useProgram(program);
      gl.uniform1i(uniforms.scene, 0);
      gl.uniform2f(
        uniforms.resolution,
        visibleCanvas.width,
        visibleCanvas.height
      );

      const lensCenterX = visibleCanvas.width * 0.5;
      const lensCenterY = visibleCanvas.height - cardCenterY;
      const lensHalfW = cardWidth * 0.5;
      const lensHalfH = cardHeight * 0.5;

      gl.uniform4f(
        uniforms.lensBox,
        lensCenterX,
        lensCenterY,
        lensHalfW,
        lensHalfH
      );
      gl.uniform1f(uniforms.lensRadius, 35 * dpr);
      gl.uniform1f(uniforms.time, now / 1000);
      gl.uniform1f(uniforms.motion, liquidMotion);

      const movementDirection = dragging ? pointerVelocity : velocity;
      gl.uniform1f(uniforms.direction, Math.sign(movementDirection));

      gl.clearColor(11 / 255, 24 / 255, 36 / 255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      requestAnimationFrame(renderFrame);
    }

    function moveBy(direction) {
      target = Math.round(scroll) + direction;
      velocity = 0;
    }

    stage.addEventListener("pointerdown", (event) => {
      if (event.button !== undefined && event.button !== 0) return;

      dragging = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);

      dragStartY = event.clientY;
      dragStartScroll = scroll;
      lastPointerY = event.clientY;
      lastPointerTime = performance.now();
      pointerVelocity = 0;
      velocity = 0;
      target = scroll;
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const now = performance.now();
      const elapsed = Math.max(1, now - lastPointerTime);
      const dy = event.clientY - dragStartY;

      scroll = dragStartScroll - (dy * dpr) / slot;
      target = scroll;

      pointerVelocity =
        (-(event.clientY - lastPointerY) * dpr / slot) /
        (elapsed / 1000);

      lastPointerY = event.clientY;
      lastPointerTime = now;
    });

    function finishDrag() {
      if (!dragging) return;

      dragging = false;
      stage.classList.remove("dragging");

      const projected = scroll + pointerVelocity * 0.16;
      target = Math.round(projected);

      if (Math.abs(pointerVelocity) > 1.1) {
        target = Math.round(target + Math.sign(pointerVelocity) * 0.15);
      }

      velocity = pointerVelocity;
    }

    stage.addEventListener("pointerup", finishDrag);
    stage.addEventListener("pointercancel", finishDrag);

    stage.addEventListener("wheel", (event) => {
      event.preventDefault();

      const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX)
        ? event.deltaY
        : event.deltaX;

      if (!delta) return;

      wheelDelta += delta;
      window.clearTimeout(wheelTimer);

      wheelTimer = window.setTimeout(() => {
        const direction = Math.sign(wheelDelta);
        const steps = Math.min(
          items.length,
          Math.max(1, Math.round(Math.abs(wheelDelta) / 120))
        );

        if (direction) {
          target = Math.round(scroll) + direction * steps;
          velocity = 0;
        }

        wheelDelta = 0;
      }, 100);
    }, { passive: false });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown") moveBy(1);
      if (event.key === "ArrowUp") moveBy(-1);
    });

    async function init() {
      gl = visibleCanvas.getContext("webgl2", {
        alpha: false,
        antialias: true
      });

      if (!gl) {
        stage.innerHTML =
          "<p style='padding:24px'>Browser ini tidak mendukung WebGL 2.</p>";
        return;
      }

      try {
        images = await Promise.all(items.map((item) => loadImage(item.image)));

        program = createProgram();
        gl.useProgram(program);
        gl.bindVertexArray(gl.createVertexArray());

        sceneTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        uniforms = {
          scene: gl.getUniformLocation(program, "uScene"),
          resolution: gl.getUniformLocation(program, "uResolution"),
          lensBox: gl.getUniformLocation(program, "uLensBox"),
          lensRadius: gl.getUniformLocation(program, "uLensRadius"),
          time: gl.getUniformLocation(program, "uTime"),
          motion: gl.getUniformLocation(program, "uMotion"),
          direction: gl.getUniformLocation(program, "uDirection")
        };

        resize();
        setTimeout(resize, 100);
        setTimeout(resize, 400);
        requestAnimationFrame(renderFrame);
      } catch (error) {
        console.error(error);
        stage.innerHTML =
          "<p style='padding:24px'>Gambar atau shader gagal dimuat. Buka Console browser untuk detailnya.</p>";
      }
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 150));
    window.visualViewport?.addEventListener("resize", resize);

    init();
  </script>
</body>
</html>
